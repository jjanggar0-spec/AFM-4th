<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음 게시판 — 고민 · 칭찬 · 응원</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💌</text></svg>">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-pop { animation: pop-in .2s ease-out both; }

    /* 공감 수가 바뀌었을 때 잠깐 튀어오르기 */
    @keyframes bump {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    .anim-bump { animation: bump .35s ease-out; display: inline-block; }

    @media (prefers-reduced-motion: reduce) {
      .anim-pop, .anim-bump { animation: none; }
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks & Config
    // ========================================
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const API_BASE_URL = '/api';
    const POLL_MS = 5000;        // 다른 사람의 글·공감 반영 주기
    const CONTENT_MAX = 500;     // server.js 의 CONTENT_MAX 와 같아야 한다
    const LIKED_KEY = 'cheer-board:liked'; // { [postId]: true }
    const ADMIN_KEY = 'cheer-board:admin'; // sessionStorage — { token, expiresAt } (탭을 닫으면 로그아웃)

    // 카테고리별 색 — Tailwind 클래스는 문자열 그대로 둬야 CDN 이 인식한다
    const CATEGORY = {
      고민: {
        emoji: '💭',
        hint: '혼자 끙끙 앓던 이야기를 털어놓아 보세요.',
        placeholder: '예) 요즘 진로 때문에 밤에 잠이 잘 안 와요…',
        badge: 'bg-violet-100 text-violet-800',
        picker: 'border-violet-500 bg-violet-50 text-violet-900 ring-violet-300',
        bar: 'bg-violet-400',
      },
      칭찬: {
        emoji: '👏',
        hint: '고마운 사람, 잘해낸 나 자신을 칭찬해 주세요.',
        placeholder: '예) 오늘 처음으로 새벽 운동을 나간 나, 칭찬해!',
        badge: 'bg-amber-100 text-amber-800',
        picker: 'border-amber-500 bg-amber-50 text-amber-900 ring-amber-300',
        bar: 'bg-amber-400',
      },
      응원: {
        emoji: '📣',
        hint: '힘이 필요한 누군가에게 한마디 건네 주세요.',
        placeholder: '예) 시험 준비하는 모든 분들, 끝까지 힘내요!',
        badge: 'bg-emerald-100 text-emerald-800',
        picker: 'border-emerald-500 bg-emerald-50 text-emerald-900 ring-emerald-300',
        bar: 'bg-emerald-400',
      },
    };
    const CATEGORY_NAMES = Object.keys(CATEGORY);

    // ========================================
    // 🛠️ Utilities
    // ========================================
    async function api(endpoint, { token, headers, ...options } = {}) {
      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...headers,
        },
      });
      let body = null;
      try { body = await res.json(); } catch {}
      if (!res.ok || !body?.success) {
        const err = new Error(body?.message || `요청에 실패했어요. (HTTP ${res.status})`);
        err.status = res.status;
        throw err;
      }
      return body.data;
    }

    // localStorage 는 사생활 보호 모드 등에서 막힐 수 있어 항상 try 로 감싼다
    function loadLiked() {
      try { return JSON.parse(localStorage.getItem(LIKED_KEY)) || {}; } catch { return {}; }
    }
    function saveLiked(liked) {
      try { localStorage.setItem(LIKED_KEY, JSON.stringify(liked)); } catch {}
    }

    // 만료된 관리자 토큰은 읽는 순간 버린다
    function loadAdmin() {
      try {
        const admin = JSON.parse(sessionStorage.getItem(ADMIN_KEY));
        if (admin?.token && new Date(admin.expiresAt).getTime() > Date.now()) return admin;
        sessionStorage.removeItem(ADMIN_KEY);
      } catch {}
      return null;
    }
    function saveAdmin(admin) {
      try {
        if (admin) sessionStorage.setItem(ADMIN_KEY, JSON.stringify(admin));
        else sessionStorage.removeItem(ADMIN_KEY);
      } catch {}
    }

    const nf = new Intl.NumberFormat('ko-KR');
    const fmt = (n) => nf.format(n);
    const charCount = (s) => [...s].length;

    function timeAgo(iso) {
      const sec = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (sec < 60) return '방금 전';
      if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
      if (sec < 86400) return `${Math.floor(sec / 3600)}시간 전`;
      if (sec < 86400 * 30) return `${Math.floor(sec / 86400)}일 전`;
      return new Date(iso).toLocaleDateString('ko-KR');
    }

    // 값이 바뀔 때마다 증가하는 key — 같은 요소에 애니메이션을 다시 걸 때 쓴다
    function useChangeKey(value) {
      const ref = useRef({ value, key: 0 });
      if (ref.current.value !== value) ref.current = { value, key: ref.current.key + 1 };
      return ref.current.key;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, className = '', children, type = 'button', ...props }) {
      const variants = {
        primary: 'bg-stone-900 text-white hover:bg-stone-700 focus-visible:ring-stone-500',
        secondary: 'bg-white text-stone-700 border border-stone-300 hover:bg-stone-100 focus-visible:ring-stone-400',
        danger: 'bg-red-600 text-white hover:bg-red-500 focus-visible:ring-red-400',
        ghost: 'text-stone-600 hover:bg-stone-100 focus-visible:ring-stone-400',
        dangerGhost: 'text-red-600 hover:bg-red-50 focus-visible:ring-red-300',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2.5 text-sm',
        lg: 'px-5 py-3 text-base',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition
            focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
            disabled:opacity-50 disabled:cursor-not-allowed
            ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        >
          {children}
        </button>
      );
    }

    function Textarea({ id, label, value, onChange, placeholder, error, disabled = false, maxChars, rows = 4, className = '', ...props }) {
      const count = maxChars ? charCount(value) : 0;
      return (
        <div className={className}>
          {label && (
            <label htmlFor={id} className="mb-1.5 block text-sm font-medium text-stone-700">{label}</label>
          )}
          <textarea
            id={id}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            rows={rows}
            aria-invalid={!!error}
            aria-describedby={maxChars ? `${id}-count` : undefined}
            className={`block w-full resize-y rounded-xl border bg-white px-3.5 py-3 text-[15px] leading-relaxed placeholder:text-stone-400 transition
              focus:outline-none focus:ring-2
              disabled:bg-stone-100 disabled:text-stone-500
              ${error ? 'border-red-400 focus:ring-red-300' : 'border-stone-300 focus:border-stone-400 focus:ring-stone-300'}`}
            {...props}
          />
          <div className="mt-1 flex items-start justify-between gap-3">
            <p className="text-xs text-red-600">{error}</p>
            {maxChars && (
              <span id={`${id}-count`} className={`shrink-0 text-xs tabular-nums ${count > maxChars ? 'text-red-600' : 'text-stone-400'}`}>
                {count}/{maxChars}
              </span>
            )}
          </div>
        </div>
      );
    }

    function Input({ id, type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', ...props }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="mb-1.5 block text-sm font-medium text-stone-700">{label}</label>}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            className={`block w-full rounded-xl border bg-white px-3.5 py-2.5 text-[15px] placeholder:text-stone-400 transition
              focus:outline-none focus:ring-2
              disabled:bg-stone-100 disabled:text-stone-500
              ${error ? 'border-red-400 focus:ring-red-300' : 'border-stone-300 focus:border-stone-400 focus:ring-stone-300'}`}
            {...props}
          />
          {error && <p className="mt-1 text-xs text-red-600">{error}</p>}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'sm' }) {
      const panelRef = useRef(null);
      const onCloseRef = useRef(onClose);
      onCloseRef.current = onClose; // 매 렌더마다 새 함수가 와도 아래 effect 가 다시 돌지 않게

      // Esc 로 닫기 + 열릴 때 첫 입력칸에 포커스 + 닫히면 원래 포커스로 복귀
      useEffect(() => {
        if (!isOpen) return;
        const previous = document.activeElement;
        const onKey = (e) => { if (e.key === 'Escape') onCloseRef.current(); };
        document.addEventListener('keydown', onKey);
        panelRef.current?.querySelector('input, button, textarea')?.focus();
        return () => {
          document.removeEventListener('keydown', onKey);
          previous?.focus?.();
        };
      }, [isOpen]);

      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg' };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-stone-900/40" onClick={onClose} aria-hidden="true" />
          <div
            ref={panelRef}
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            className={`anim-pop relative w-full ${sizes[size]} rounded-2xl bg-white p-5 shadow-xl sm:p-6`}
          >
            <h2 id="modal-title" className="text-lg font-bold text-stone-900">{title}</h2>
            <div className="mt-3">{children}</div>
          </div>
        </div>
      );
    }

    function Card({ className = '', children, ...props }) {
      return (
        <div className={`rounded-2xl border border-stone-200 bg-white shadow-sm ${className}`} {...props}>
          {children}
        </div>
      );
    }

    function Badge({ className = '', children }) {
      return (
        <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold ${className}`}>
          {children}
        </span>
      );
    }

    function Tabs({ tabs, value, onChange, label, className = '' }) {
      return (
        <div role="tablist" aria-label={label} className={`inline-flex max-w-full overflow-x-auto rounded-xl bg-stone-200/70 p-1 ${className}`}>
          {tabs.map((tab) => (
            <button
              key={tab.value}
              type="button"
              role="tab"
              aria-selected={value === tab.value}
              onClick={() => onChange(tab.value)}
              className={`shrink-0 whitespace-nowrap rounded-lg px-3 py-1.5 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-400
                ${value === tab.value ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-500 hover:text-stone-800'}`}
            >
              {tab.label}
            </button>
          ))}
        </div>
      );
    }

    function Spinner({ className = 'h-4 w-4' }) {
      return (
        <svg className={`animate-spin ${className}`} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" className="opacity-25" />
          <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
        </svg>
      );
    }

    function HeartIcon({ filled, className = 'h-5 w-5' }) {
      return (
        <svg className={className} viewBox="0 0 24 24" aria-hidden="true"
          fill={filled ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinejoin="round">
          <path d="M12 20.5s-7.5-4.6-9.3-9.6C1.5 7.4 3.8 4 7.3 4c2 0 3.6 1.1 4.7 2.7C13.1 5.1 14.7 4 16.7 4c3.5 0 5.8 3.4 4.6 6.9-1.8 5-9.3 9.6-9.3 9.6z" />
        </svg>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header({ summary }) {
      return (
        <header className="border-b border-stone-200 bg-white">
          <div className="mx-auto flex max-w-2xl flex-col gap-4 px-4 py-6 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <h1 className="text-2xl font-black tracking-tight text-stone-900 sm:text-3xl">💌 마음 게시판</h1>
              <p className="mt-1.5 text-sm text-stone-500">
                익명으로 고민을 털어놓고, 칭찬하고, 응원해요. 마음에 닿는 글엔 공감을 눌러 주세요.
              </p>
            </div>
            {summary && (
              <p className="shrink-0 text-sm text-stone-500">
                글 <b className="tabular-nums text-stone-800">{fmt(summary.total)}</b>개 ·
                공감 <b className="tabular-nums text-rose-600">{fmt(summary.likes)}</b>번
              </p>
            )}
          </div>
        </header>
      );
    }

    function Footer({ isAdmin, onAdminClick }) {
      return (
        <footer className="mx-auto max-w-2xl px-4 pb-10 pt-4 text-center text-xs text-stone-400">
          <p>글과 공감 수는 {POLL_MS / 1000}초마다 자동으로 갱신돼요 · 한 브라우저에서 글마다 한 번씩 공감할 수 있어요</p>
          {!isAdmin && (
            <button
              type="button"
              onClick={onAdminClick}
              className="mt-3 rounded px-2 py-1 text-stone-400 underline-offset-2 hover:text-stone-600 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-300"
            >
              🛡️ 관리자 모드
            </button>
          )}
        </footer>
      );
    }

    function AdminBar({ expiresAt, onLogout }) {
      const until = new Date(expiresAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      return (
        <div className="sticky top-0 z-40 border-b border-red-200 bg-red-50/95 backdrop-blur" role="region" aria-label="관리자 모드">
          <div className="mx-auto flex max-w-2xl flex-wrap items-center justify-between gap-2 px-4 py-2.5">
            <p className="text-sm text-red-800">
              <b>🛡️ 관리자 모드</b>
              <span className="ml-2 text-red-700/80">글마다 삭제 버튼이 보여요 · {until}까지 유지</span>
            </p>
            <Button variant="secondary" size="sm" onClick={onLogout}>관리자 모드 나가기</Button>
          </div>
        </div>
      );
    }

    // ========================================
    // 💌 Feature Components
    // ========================================
    function PostForm({ onCreated }) {
      const [category, setCategory] = useState('고민');
      const [content, setContent] = useState('');
      const [touched, setTouched] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [serverError, setServerError] = useState('');

      const text = content.trim();
      const error = !text ? '내용을 입력해 주세요.' : charCount(text) > CONTENT_MAX ? `${CONTENT_MAX}자까지 쓸 수 있어요.` : '';

      async function handleSubmit(e) {
        e.preventDefault();
        setTouched(true);
        setServerError('');
        if (error) return;
        setSubmitting(true);
        try {
          const post = await api('/posts', {
            method: 'POST',
            body: JSON.stringify({ category, content: text }),
          });
          setContent('');
          setTouched(false);
          onCreated(post);
        } catch (err) {
          setServerError(err.message);
        } finally {
          setSubmitting(false);
        }
      }

      // Ctrl/Cmd + Enter 로 바로 등록
      function handleKeyDown(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleSubmit(e);
      }

      return (
        <Card className="p-5 sm:p-6">
          <form onSubmit={handleSubmit} noValidate>
            <h2 className="text-base font-bold text-stone-900">마음 남기기</h2>

            <fieldset className="mt-3">
              <legend className="sr-only">카테고리</legend>
              <div className="grid grid-cols-3 gap-2">
                {CATEGORY_NAMES.map((name) => {
                  const selected = category === name;
                  return (
                    <label
                      key={name}
                      className={`flex cursor-pointer items-center justify-center gap-1.5 rounded-xl border-2 px-2 py-2.5 text-sm font-bold transition
                        focus-within:ring-2
                        ${selected ? CATEGORY[name].picker : 'border-stone-200 bg-white text-stone-500 hover:border-stone-300 hover:text-stone-800'}`}
                    >
                      <input
                        type="radio"
                        name="category"
                        value={name}
                        checked={selected}
                        onChange={() => setCategory(name)}
                        disabled={submitting}
                        className="sr-only"
                      />
                      <span aria-hidden="true">{CATEGORY[name].emoji}</span>
                      {name}
                    </label>
                  );
                })}
              </div>
              <p className="mt-2 text-sm text-stone-500">{CATEGORY[category].hint}</p>
            </fieldset>

            <Textarea
              id="content"
              label="내용"
              className="mt-3"
              value={content}
              onChange={(e) => setContent(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder={CATEGORY[category].placeholder}
              maxChars={CONTENT_MAX}
              error={touched ? error : ''}
              disabled={submitting}
            />

            {serverError && (
              <p role="alert" className="mt-2 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{serverError}</p>
            )}

            <div className="mt-3 flex items-center justify-between gap-3">
              <p className="hidden text-xs text-stone-400 sm:block">Ctrl + Enter 로 바로 등록</p>
              <Button type="submit" disabled={submitting} className="w-full sm:w-auto">
                {submitting ? <><Spinner /> 등록 중…</> : `${CATEGORY[category].emoji} ${category} 올리기`}
              </Button>
            </div>
          </form>
        </Card>
      );
    }

    function LikeButton({ likes, liked, pending, onLike }) {
      const bumpKey = useChangeKey(likes);
      return (
        <button
          type="button"
          onClick={onLike}
          disabled={liked || pending}
          aria-pressed={liked}
          aria-label={liked ? `공감함, 공감 ${likes}개` : `공감하기, 현재 공감 ${likes}개`}
          className={`inline-flex items-center gap-1.5 rounded-full border px-3.5 py-1.5 text-sm font-semibold transition
            focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-300 focus-visible:ring-offset-2
            ${liked
              ? 'cursor-default border-rose-200 bg-rose-50 text-rose-600'
              : 'border-stone-200 bg-white text-stone-600 hover:border-rose-300 hover:bg-rose-50 hover:text-rose-600 disabled:cursor-wait'}`}
        >
          <span key={bumpKey} className={bumpKey ? 'anim-bump' : ''}>
            <HeartIcon filled={liked} className="h-[18px] w-[18px]" />
          </span>
          {liked ? '공감했어요' : '공감'}
          <span className="tabular-nums">{fmt(likes)}</span>
        </button>
      );
    }

    // 관리자 모드에서만 보이는 삭제 영역 — 한 번 더 확인받고 지운다
    function AdminDeleteControls({ deleting, onDelete }) {
      const [confirming, setConfirming] = useState(false);

      if (!confirming) {
        return (
          <Button variant="dangerGhost" size="sm" onClick={() => setConfirming(true)}>
            🗑️ 삭제
          </Button>
        );
      }
      return (
        <div className="flex items-center gap-1.5" role="group" aria-label="삭제 확인">
          <span className="text-xs font-semibold text-red-700">정말 삭제할까요?</span>
          <Button variant="danger" size="sm" disabled={deleting} onClick={onDelete} autoFocus>
            {deleting ? <><Spinner /> 삭제 중…</> : '삭제'}
          </Button>
          <Button variant="secondary" size="sm" disabled={deleting} onClick={() => setConfirming(false)}>취소</Button>
        </div>
      );
    }

    function PostCard({ post, liked, pending, error, onLike, isAdmin, deleting, onDelete }) {
      const tone = CATEGORY[post.category] || CATEGORY['고민'];
      return (
        <Card className={`anim-pop relative overflow-hidden p-4 pl-5 sm:p-5 sm:pl-6 transition-opacity ${deleting ? 'opacity-50' : ''}`}>
          <div className={`absolute inset-y-0 left-0 w-1 ${tone.bar}`} aria-hidden="true" />
          <div className="flex items-center justify-between gap-2">
            <Badge className={tone.badge}>
              <span aria-hidden="true">{tone.emoji}</span>{post.category}
            </Badge>
            <p className="text-xs text-stone-400">
              {isAdmin && <span className="mr-1.5 font-mono text-stone-300">#{post.id}</span>}
              <time dateTime={post.createdAt} title={new Date(post.createdAt).toLocaleString('ko-KR')}>
                {timeAgo(post.createdAt)}
              </time>
            </p>
          </div>

          <p className="mt-3 whitespace-pre-wrap break-words text-[15px] leading-relaxed text-stone-800">{post.content}</p>

          {error && <p role="alert" className="mt-3 text-xs text-red-600">{error}</p>}

          <div className={`mt-4 flex flex-wrap items-center gap-2 ${isAdmin ? 'justify-between' : 'justify-end'}`}>
            {isAdmin && <AdminDeleteControls deleting={deleting} onDelete={onDelete} />}
            <LikeButton likes={post.likes} liked={liked} pending={pending} onLike={onLike} />
          </div>
        </Card>
      );
    }

    function AdminLoginModal({ isOpen, onClose, onLogin }) {
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (isOpen) { setPassword(''); setError(''); }
      }, [isOpen]);

      async function handleSubmit(e) {
        e.preventDefault();
        if (!password) return setError('비밀번호를 입력해 주세요.');
        setSubmitting(true);
        setError('');
        try {
          const admin = await api('/admin/login', { method: 'POST', body: JSON.stringify({ password }) });
          onLogin(admin);
        } catch (err) {
          setError(err.message);
        } finally {
          setSubmitting(false);
        }
      }

      return (
        <Modal isOpen={isOpen} onClose={() => { if (!submitting) onClose(); }} title="🛡️ 관리자 로그인">
          <form onSubmit={handleSubmit} noValidate>
            <p className="text-sm text-stone-500">관리자 모드에서는 게시글을 삭제할 수 있어요.</p>
            <Input
              id="admin-password"
              type="password"
              label="관리자 비밀번호"
              className="mt-4"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              error={error}
              disabled={submitting}
              autoComplete="current-password"
            />
            <div className="mt-5 flex justify-end gap-2">
              <Button variant="secondary" onClick={onClose} disabled={submitting}>취소</Button>
              <Button type="submit" disabled={submitting}>
                {submitting ? <><Spinner /> 확인 중…</> : '로그인'}
              </Button>
            </div>
          </form>
        </Modal>
      );
    }

    function SkeletonCard() {
      return (
        <Card className="p-5" aria-hidden="true">
          <div className="flex justify-between">
            <div className="h-5 w-14 animate-pulse rounded-full bg-stone-200" />
            <div className="h-4 w-12 animate-pulse rounded bg-stone-200" />
          </div>
          <div className="mt-4 space-y-2">
            <div className="h-4 w-full animate-pulse rounded bg-stone-100" />
            <div className="h-4 w-2/3 animate-pulse rounded bg-stone-100" />
          </div>
          <div className="mt-4 flex justify-end">
            <div className="h-8 w-24 animate-pulse rounded-full bg-stone-100" />
          </div>
        </Card>
      );
    }

    function EmptyState({ category }) {
      return (
        <Card className="px-6 py-14 text-center">
          <div className="text-5xl" aria-hidden="true">{category ? CATEGORY[category].emoji : '💌'}</div>
          <p className="mt-3 font-bold text-stone-800">
            {category ? `아직 ${category} 글이 없어요` : '아직 올라온 글이 없어요'}
          </p>
          <p className="mt-1 text-sm text-stone-500">위에서 첫 번째 마음을 남겨 보세요!</p>
        </Card>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function BoardPage() {
      const [sort, setSort] = useState('latest');       // 'latest' | 'likes'
      const [category, setCategory] = useState('all');  // 'all' | '고민' | '칭찬' | '응원'
      const [byId, setById] = useState({});             // { [id]: post }
      const [order, setOrder] = useState([]);           // 화면에 보이는 순서 (id 배열)
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState('');
      const [liked, setLiked] = useState(loadLiked);
      const [pending, setPending] = useState({});       // { [id]: true }
      const [cardErrors, setCardErrors] = useState({});  // 공감·삭제 실패 메시지 { [id]: string }
      const [notice, setNotice] = useState('');
      const [admin, setAdmin] = useState(loadAdmin);     // { token, expiresAt } | null
      const [loginOpen, setLoginOpen] = useState(false);
      const [deleting, setDeleting] = useState({});      // { [id]: true }

      const queryRef = useRef({ sort, category });
      const requestSeq = useRef(0);
      const reorderPending = useRef(false);
      const deletedIds = useRef(new Set()); // 삭제 전에 보낸 폴링 응답이 늦게 와도 지운 글이 되살아나지 않게

      // reorder = true: 서버 순서대로 다시 정렬 (첫 로딩·정렬/필터 변경·새 글 등록)
      // reorder = false: 폴링 — 공감을 누르려는 순간 카드가 움직이지 않게 기존 순서를 유지하고
      //                   새로 생긴 글만 맨 위에 붙인다
      const load = useCallback(async (options = {}) => {
        const seq = ++requestSeq.current;
        // 정렬 변경 요청이 끝나기 전에 폴링이 끼어들면 그 폴링이 대신 순서를 다시 잡는다
        const reorder = !!options.reorder || reorderPending.current;
        reorderPending.current = reorder;
        const { sort, category } = queryRef.current;
        const params = new URLSearchParams({ sort });
        if (category !== 'all') params.set('category', category);
        try {
          const data = await api(`/posts?${params}`);
          if (seq !== requestSeq.current) return; // 더 늦게 보낸 요청이 이미 도착함
          data.posts = data.posts.filter((p) => !deletedIds.current.has(p.id));
          const serverIds = data.posts.map((p) => p.id);

          // 공감 수는 늘기만 하므로 더 큰 값을 남긴다 — 공감 누르기 전에 보낸 요청이
          // 늦게 도착해도 방금 올린 +1 이 되돌아가 보이지 않는다
          setById((prev) => Object.fromEntries(data.posts.map((p) => [
            p.id,
            prev[p.id]?.likes > p.likes ? { ...p, likes: prev[p.id].likes } : p,
          ])));
          setOrder((prev) => {
            if (reorder) return serverIds;
            const known = new Set(prev);
            const alive = new Set(serverIds);
            const fresh = serverIds.filter((id) => !known.has(id));
            return [...fresh, ...prev.filter((id) => alive.has(id))];
          });
          reorderPending.current = false;
          setSummary(data.summary);
          setLoadError('');
        } catch (err) {
          if (seq !== requestSeq.current) return;
          setLoadError(err.message);
        } finally {
          if (seq === requestSeq.current) setLoading(false);
        }
      }, []);

      // 정렬·카테고리가 바뀌면 서버 순서로 새로 불러온다
      useEffect(() => {
        queryRef.current = { sort, category };
        setLoading(true);
        load({ reorder: true });
      }, [sort, category, load]);

      // 폴링 — 탭이 안 보일 때는 멈추고, 돌아오면 즉시 갱신
      useEffect(() => {
        let timer = null;
        const start = () => {
          clearInterval(timer);
          timer = setInterval(() => load(), POLL_MS);
        };
        const onVisibility = () => {
          if (document.hidden) clearInterval(timer);
          else { load(); start(); }
        };
        if (!document.hidden) start();
        document.addEventListener('visibilitychange', onVisibility);
        return () => {
          clearInterval(timer);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [load]);

      // 다른 탭에서 공감하면 이 탭의 버튼 상태도 맞춰 준다
      useEffect(() => {
        const onStorage = (e) => { if (e.key === LIKED_KEY) setLiked(loadLiked()); };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      useEffect(() => {
        if (!notice) return;
        const t = setTimeout(() => setNotice(''), 2500);
        return () => clearTimeout(t);
      }, [notice]);

      const handleCreated = useCallback((post) => {
        setNotice(`${CATEGORY[post.category].emoji} ${post.category} 글이 올라갔어요!`);
        // 방금 쓴 글이 바로 보이도록 최신순 + 해당 글이 보이는 필터로 맞춘다
        const { sort, category } = queryRef.current;
        const nextCategory = category === 'all' || category === post.category ? category : 'all';
        if (sort !== 'latest' || nextCategory !== category) {
          setSort('latest');
          setCategory(nextCategory);
        } else {
          setById((prev) => ({ ...prev, [post.id]: post }));
          setOrder((prev) => [post.id, ...prev.filter((id) => id !== post.id)]);
          load({ reorder: true });
        }
      }, [load]);

      const handleLike = useCallback(async (id) => {
        if (liked[id] || pending[id]) return;
        setPending((p) => ({ ...p, [id]: true }));
        setCardErrors((e) => ({ ...e, [id]: '' }));
        // 낙관적 업데이트 — 누르자마자 +1 보여주고, 실패하면 되돌린다
        setById((prev) => (prev[id] ? { ...prev, [id]: { ...prev[id], likes: prev[id].likes + 1 } } : prev));
        setLiked((prev) => ({ ...prev, [id]: true }));
        try {
          const post = await api(`/posts/${id}/like`, { method: 'PATCH' });
          setById((prev) => ({ ...prev, [id]: post })); // 서버의 정확한 값으로 맞춤
          setLiked((prev) => {
            const next = { ...prev, [id]: true };
            saveLiked(next);
            return next;
          });
          setSummary((s) => (s ? { ...s, likes: s.likes + 1 } : s));
        } catch (err) {
          setById((prev) => (prev[id] ? { ...prev, [id]: { ...prev[id], likes: Math.max(0, prev[id].likes - 1) } } : prev));
          setLiked((prev) => {
            const next = { ...prev };
            delete next[id];
            return next;
          });
          setCardErrors((e) => ({ ...e, [id]: err.message }));
          if (err.status === 404) load();
        } finally {
          setPending((p) => {
            const next = { ...p };
            delete next[id];
            return next;
          });
        }
      }, [liked, pending, load]);

      // ── 관리자 모드 ──
      const logoutAdmin = useCallback((message) => {
        saveAdmin(null);
        setAdmin(null);
        if (message) setNotice(message);
      }, []);

      const handleAdminLogin = useCallback((next) => {
        saveAdmin(next);
        setAdmin(next);
        setLoginOpen(false);
        setNotice('🛡️ 관리자 모드로 전환했어요');
      }, []);

      // 토큰 만료 시각이 되면 자동으로 관리자 모드를 끝낸다
      useEffect(() => {
        if (!admin) return;
        const ms = new Date(admin.expiresAt).getTime() - Date.now();
        const t = setTimeout(() => logoutAdmin('관리자 로그인 시간이 끝났어요'), Math.max(0, Math.min(ms, 2 ** 31 - 1)));
        return () => clearTimeout(t);
      }, [admin, logoutAdmin]);

      const removePostLocally = useCallback((id) => {
        deletedIds.current.add(id);
        setOrder((prev) => prev.filter((x) => x !== id));
        setById((prev) => {
          const next = { ...prev };
          delete next[id];
          return next;
        });
      }, []);

      const handleDelete = useCallback(async (id) => {
        if (!admin || deleting[id]) return;
        setDeleting((d) => ({ ...d, [id]: true }));
        setCardErrors((e) => ({ ...e, [id]: '' }));
        try {
          await api(`/posts/${id}`, { method: 'DELETE', token: admin.token });
          removePostLocally(id);
          setNotice('🗑️ 글을 삭제했어요');
          load(); // 카테고리별 글 수·공감 합계를 서버 값으로 맞춘다
        } catch (err) {
          if (err.status === 401) {
            logoutAdmin();
            setLoginOpen(true);
          }
          if (err.status === 404) {
            removePostLocally(id);
            load();
          }
          setCardErrors((e) => ({ ...e, [id]: err.message }));
        } finally {
          setDeleting((d) => {
            const next = { ...d };
            delete next[id];
            return next;
          });
        }
      }, [admin, deleting, removePostLocally, load, logoutAdmin]);

      const closeLogin = useCallback(() => setLoginOpen(false), []);

      const posts = useMemo(() => order.map((id) => byId[id]).filter(Boolean), [order, byId]);

      const categoryTabs = [
        { value: 'all', label: `전체${summary ? ` ${fmt(summary.total)}` : ''}` },
        ...CATEGORY_NAMES.map((name) => ({
          value: name,
          label: `${CATEGORY[name].emoji} ${name}${summary ? ` ${fmt(summary.byCategory[name])}` : ''}`,
        })),
      ];

      return (
        <>
          {admin && <AdminBar expiresAt={admin.expiresAt} onLogout={() => logoutAdmin('관리자 모드를 나왔어요')} />}
          <Header summary={summary} />

          <main className="mx-auto max-w-2xl space-y-6 px-4 py-6">
            <PostForm onCreated={handleCreated} />

            <section aria-labelledby="list-title" className="space-y-4">
              <h2 id="list-title" className="sr-only">게시글 목록</h2>
              <div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <Tabs label="카테고리" value={category} onChange={setCategory} tabs={categoryTabs} />
                <Tabs
                  label="정렬"
                  value={sort}
                  onChange={setSort}
                  className="self-start sm:self-auto"
                  tabs={[
                    { value: 'latest', label: '🆕 최신순' },
                    { value: 'likes', label: '❤️ 공감순' },
                  ]}
                />
              </div>

              {loadError && (
                <div role="alert" className="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
                  <span>⚠️ {loadError} {posts.length > 0 && '(마지막으로 받은 목록을 보여주고 있어요)'}</span>
                  <Button variant="secondary" size="sm" onClick={() => load({ reorder: true })}>다시 시도</Button>
                </div>
              )}

              {loading && posts.length === 0 ? (
                <div className="space-y-4">
                  <SkeletonCard />
                  <SkeletonCard />
                  <SkeletonCard />
                </div>
              ) : posts.length === 0 ? (
                !loadError && <EmptyState category={category === 'all' ? null : category} />
              ) : (
                <ul className={`space-y-4 transition-opacity ${loading ? 'opacity-60' : ''}`} aria-busy={loading}>
                  {posts.map((post) => (
                    <li key={post.id}>
                      <PostCard
                        post={post}
                        liked={!!liked[post.id]}
                        pending={!!pending[post.id]}
                        error={cardErrors[post.id]}
                        onLike={() => handleLike(post.id)}
                        isAdmin={!!admin}
                        deleting={!!deleting[post.id]}
                        onDelete={() => handleDelete(post.id)}
                      />
                    </li>
                  ))}
                </ul>
              )}
            </section>
          </main>

          <Footer isAdmin={!!admin} onAdminClick={() => setLoginOpen(true)} />

          <AdminLoginModal isOpen={loginOpen} onClose={closeLogin} onLogin={handleAdminLogin} />

          {notice && (
            <div
              role="status"
              className="anim-pop fixed bottom-6 left-1/2 z-50 -translate-x-1/2 whitespace-nowrap rounded-full bg-stone-900 px-5 py-2.5 text-sm font-semibold text-white shadow-lg"
            >
              {notice}
            </div>
          )}
        </>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      return <BoardPage />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
