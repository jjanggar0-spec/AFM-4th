<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéCorp | 포켓몬과 사람을 잇는 회사</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    html { scroll-behavior: smooth; }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-18px) rotate(8deg); }
    }
    .animate-float-slow { animation: float-slow 6s ease-in-out infinite; }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up .45s ease-out both; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ========================================
    // 🔧 Config
    // ========================================
    const API_BASE_URL = '/api';

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', type = 'button', disabled = false, onClick, className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-2 font-bold rounded-full transition-all duration-200 focus:outline-none focus-visible:ring-4 focus-visible:ring-amber-300/60 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-amber-400 text-slate-900 shadow-lg shadow-amber-400/30 hover:bg-amber-300 hover:-translate-y-0.5 active:translate-y-0',
        secondary: 'bg-slate-900 text-white hover:bg-slate-700 hover:-translate-y-0.5 active:translate-y-0',
        danger: 'bg-rose-500 text-white hover:bg-rose-400',
        ghost: 'bg-transparent text-slate-700 border border-slate-300 hover:bg-white hover:border-slate-400',
      };
      const sizes = { sm: 'px-4 py-1.5 text-sm', md: 'px-6 py-3 text-sm', lg: 'px-8 py-4 text-base' };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ id, label, type = 'text', value, onChange, placeholder, error, disabled = false, required = false, className = '' }) {
      return (
        <div className={className}>
          {label && (
            <label htmlFor={id} className="block mb-1.5 text-sm font-semibold text-slate-700">
              {label}{required && <span className="text-rose-500 ml-0.5">*</span>}
            </label>
          )}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-xl border bg-white px-4 py-3 text-sm outline-none transition
              ${error ? 'border-rose-400 focus:ring-4 focus:ring-rose-100' : 'border-slate-300 focus:border-amber-400 focus:ring-4 focus:ring-amber-100'}
              disabled:bg-slate-100 disabled:text-slate-400`}
          />
          {error && <p id={`${id}-error`} className="mt-1.5 text-xs font-medium text-rose-500">{error}</p>}
        </div>
      );
    }

    function Textarea({ id, label, value, onChange, placeholder, error, disabled = false, required = false, rows = 5, className = '' }) {
      return (
        <div className={className}>
          {label && (
            <label htmlFor={id} className="block mb-1.5 text-sm font-semibold text-slate-700">
              {label}{required && <span className="text-rose-500 ml-0.5">*</span>}
            </label>
          )}
          <textarea
            id={id}
            rows={rows}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full resize-y rounded-xl border bg-white px-4 py-3 text-sm outline-none transition
              ${error ? 'border-rose-400 focus:ring-4 focus:ring-rose-100' : 'border-slate-300 focus:border-amber-400 focus:ring-4 focus:ring-amber-100'}
              disabled:bg-slate-100 disabled:text-slate-400`}
          />
          {error && <p id={`${id}-error`} className="mt-1.5 text-xs font-medium text-rose-500">{error}</p>}
        </div>
      );
    }

    function Select({ id, label, value, onChange, options = [], error, disabled = false, required = false, className = '' }) {
      return (
        <div className={className}>
          {label && (
            <label htmlFor={id} className="block mb-1.5 text-sm font-semibold text-slate-700">
              {label}{required && <span className="text-rose-500 ml-0.5">*</span>}
            </label>
          )}
          <select
            id={id}
            value={value}
            onChange={onChange}
            disabled={disabled}
            aria-invalid={!!error}
            className={`w-full appearance-none rounded-xl border bg-white px-4 py-3 text-sm outline-none transition
              ${error ? 'border-rose-400 focus:ring-4 focus:ring-rose-100' : 'border-slate-300 focus:border-amber-400 focus:ring-4 focus:ring-amber-100'}
              disabled:bg-slate-100 disabled:text-slate-400`}
          >
            {options.map((opt) => <option key={opt} value={opt}>{opt}</option>)}
          </select>
          {error && <p className="mt-1.5 text-xs font-medium text-rose-500">{error}</p>}
        </div>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`rounded-2xl bg-white shadow-sm ring-1 ring-slate-900/5 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'amber', className = '', children }) {
      const tones = {
        amber: 'bg-amber-100 text-amber-800',
        slate: 'bg-slate-100 text-slate-700',
        sky: 'bg-sky-100 text-sky-800',
        emerald: 'bg-emerald-100 text-emerald-800',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-3 py-1 text-xs font-bold tracking-wide ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function SectionTitle({ eyebrow, title, description, align = 'center' }) {
      const alignCls = align === 'center' ? 'text-center mx-auto' : 'text-left';
      return (
        <div className={`max-w-2xl ${alignCls}`}>
          {eyebrow && <Badge className="mb-4">{eyebrow}</Badge>}
          <h2 className="text-3xl sm:text-4xl font-black tracking-tight text-slate-900">{title}</h2>
          {description && <p className="mt-4 text-base leading-relaxed text-slate-600">{description}</p>}
        </div>
      );
    }

    function PokeballIcon({ className = 'w-8 h-8' }) {
      return (
        <svg viewBox="0 0 64 64" className={className} aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="#fff" stroke="#0f172a" strokeWidth="4" />
          <path d="M3 32a29 29 0 0 1 58 0Z" fill="#ef4444" stroke="#0f172a" strokeWidth="4" />
          <line x1="3" y1="32" x2="61" y2="32" stroke="#0f172a" strokeWidth="4" />
          <circle cx="32" cy="32" r="9" fill="#fff" stroke="#0f172a" strokeWidth="4" />
        </svg>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================
    const NAV_ITEMS = [
      { href: '#business', label: '사업영역' },
      { href: '#about', label: '회사소개' },
      { href: '#history', label: '연혁' },
      { href: '#contact', label: '문의하기' },
    ];

    function Header() {
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 20);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <header className={`fixed inset-x-0 top-0 z-50 transition-all duration-300
          ${scrolled ? 'bg-white/90 backdrop-blur shadow-sm' : 'bg-transparent'}`}>
          <div className="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
            <a href="#top" className="flex items-center gap-2.5 font-black tracking-tight">
              <PokeballIcon className="w-8 h-8" />
              <span className="text-lg">Poké<span className="text-rose-500">Corp</span></span>
            </a>

            <nav className="hidden md:flex items-center gap-1" aria-label="주요 메뉴">
              {NAV_ITEMS.map((item) => (
                <a
                  key={item.href}
                  href={item.href}
                  className="rounded-full px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-900/5 hover:text-slate-900"
                >
                  {item.label}
                </a>
              ))}
              <a href="#contact" className="ml-2">
                <Button size="sm">문의 남기기</Button>
              </a>
            </nav>

            <button
              type="button"
              className="md:hidden rounded-lg p-2 text-slate-800 hover:bg-slate-900/5"
              aria-expanded={menuOpen}
              aria-label="메뉴 열기"
              onClick={() => setMenuOpen((v) => !v)}
            >
              <svg viewBox="0 0 24 24" className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2">
                {menuOpen
                  ? <path d="M6 6l12 12M18 6L6 18" strokeLinecap="round" />
                  : <path d="M4 7h16M4 12h16M4 17h16" strokeLinecap="round" />}
              </svg>
            </button>
          </div>

          {menuOpen && (
            <nav className="md:hidden border-t border-slate-200 bg-white px-5 py-3" aria-label="모바일 메뉴">
              {NAV_ITEMS.map((item) => (
                <a
                  key={item.href}
                  href={item.href}
                  onClick={() => setMenuOpen(false)}
                  className="block rounded-lg px-3 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50"
                >
                  {item.label}
                </a>
              ))}
            </nav>
          )}
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="bg-slate-900 text-slate-400">
          <div className="mx-auto grid max-w-6xl gap-10 px-5 py-14 md:grid-cols-3">
            <div>
              <div className="flex items-center gap-2.5 text-white font-black text-lg">
                <PokeballIcon className="w-7 h-7" />
                <span>Poké<span className="text-rose-400">Corp</span></span>
              </div>
              <p className="mt-4 text-sm leading-relaxed">
                포켓몬과 사람이 함께 자라는 세상을 만듭니다.<br />
                (본 사이트는 학습용으로 만든 가상의 회사 홈페이지입니다.)
              </p>
            </div>
            <div>
              <h3 className="text-sm font-bold text-white">회사 정보</h3>
              <ul className="mt-4 space-y-2 text-sm">
                <li>주식회사 포케코프 (PokéCorp Inc.)</li>
                <li>대표이사 오박사</li>
                <li>서울특별시 태초마을로 151</li>
                <li>사업자등록번호 000-00-00000</li>
              </ul>
            </div>
            <div>
              <h3 className="text-sm font-bold text-white">연락처</h3>
              <ul className="mt-4 space-y-2 text-sm">
                <li>대표전화 02-000-0000</li>
                <li>이메일 hello@pokecorp.example</li>
                <li>평일 09:00 – 18:00 (주말·공휴일 휴무)</li>
              </ul>
            </div>
          </div>
          <div className="border-t border-white/10 px-5 py-5 text-center text-xs">
            © 2026 PokéCorp Inc. All rights reserved.
          </div>
        </footer>
      );
    }

    // ========================================
    // 📄 Section Components
    // ========================================
    function Hero() {
      return (
        <section id="top" className="relative overflow-hidden bg-gradient-to-br from-amber-200 via-amber-100 to-sky-100 pt-32 pb-24">
          <PokeballIcon className="pointer-events-none absolute -right-16 -top-10 w-64 opacity-20 animate-float-slow" />
          <PokeballIcon className="pointer-events-none absolute -left-10 bottom-0 w-40 opacity-10 animate-float-slow" />

          <div className="relative mx-auto max-w-6xl px-5">
            <div className="max-w-2xl animate-fade-up">
              <Badge tone="slate">SINCE 1996 · 태초마을</Badge>
              <h1 className="mt-5 text-4xl sm:text-5xl lg:text-6xl font-black leading-tight tracking-tight text-slate-900">
                포켓몬과 사람을<br />잇는 기술 회사
              </h1>
              <p className="mt-6 max-w-xl text-base sm:text-lg leading-relaxed text-slate-700">
                PokéCorp는 포켓몬 도감 데이터 플랫폼부터 배틀 리그 운영, 포켓몬 케어 서비스까지
                트레이너의 여정에 필요한 모든 것을 만듭니다.
              </p>
              <div className="mt-9 flex flex-wrap gap-3">
                <a href="#contact"><Button size="lg">문의 남기기</Button></a>
                <a href="#business"><Button size="lg" variant="ghost">사업영역 보기</Button></a>
              </div>
            </div>
          </div>
        </section>
      );
    }

    const BUSINESSES = [
      {
        emoji: '📘',
        title: '포켓몬 도감 플랫폼',
        desc: '1,000종이 넘는 포켓몬 데이터를 실시간으로 제공하는 개방형 API와 도감 서비스를 운영합니다.',
        tags: ['Open API', '데이터'],
      },
      {
        emoji: '⚔️',
        title: '배틀 리그 운영',
        desc: '지역 체육관부터 세계 챔피언십까지, 공정한 룰과 중계 시스템으로 리그 전체를 설계합니다.',
        tags: ['e스포츠', '중계'],
      },
      {
        emoji: '🏥',
        title: '포켓몬 케어',
        desc: '포켓몬센터 네트워크와 함께 회복·검진·상담을 잇는 통합 케어 솔루션을 제공합니다.',
        tags: ['헬스케어', '네트워크'],
      },
      {
        emoji: '🎒',
        title: '트레이너 용품',
        desc: '몬스터볼, 상처약, 배지 케이스까지. 현장에서 검증된 트레이너 장비를 설계하고 유통합니다.',
        tags: ['제조', '커머스'],
      },
    ];

    function Business() {
      return (
        <section id="business" className="scroll-mt-24 bg-white py-24">
          <div className="mx-auto max-w-6xl px-5">
            <SectionTitle
              eyebrow="BUSINESS"
              title="네 가지 축으로 움직입니다"
              description="데이터, 리그, 케어, 용품. PokéCorp의 사업은 트레이너의 하루를 따라 이어져 있습니다."
            />
            <div className="mt-14 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
              {BUSINESSES.map((b) => (
                <Card key={b.title} className="p-7 transition hover:-translate-y-1 hover:shadow-lg">
                  <div className="text-4xl" aria-hidden="true">{b.emoji}</div>
                  <h3 className="mt-5 text-lg font-bold text-slate-900">{b.title}</h3>
                  <p className="mt-3 text-sm leading-relaxed text-slate-600">{b.desc}</p>
                  <div className="mt-5 flex flex-wrap gap-2">
                    {b.tags.map((t) => <Badge key={t} tone="slate">{t}</Badge>)}
                  </div>
                </Card>
              ))}
            </div>
          </div>
        </section>
      );
    }

    const STATS = [
      { value: '1,025', label: '등록 포켓몬 종' },
      { value: '128', label: '운영 중인 포켓몬센터' },
      { value: '54M', label: '누적 도감 API 호출' },
      { value: '30년', label: '트레이너와 함께한 시간' },
    ];

    function Stats() {
      return (
        <section className="bg-slate-900 py-16">
          <div className="mx-auto grid max-w-6xl grid-cols-2 gap-8 px-5 lg:grid-cols-4">
            {STATS.map((s) => (
              <div key={s.label} className="text-center">
                <div className="text-3xl sm:text-4xl font-black text-amber-300">{s.value}</div>
                <div className="mt-2 text-xs sm:text-sm font-medium text-slate-400">{s.label}</div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    const VALUES = [
      { title: '함께 자란다', desc: '포켓몬도 트레이너도 성장합니다. 우리의 모든 제품은 그 성장의 과정을 돕습니다.' },
      { title: '공정하게 겨룬다', desc: '리그와 데이터에 편향이 없도록, 규칙과 기록을 투명하게 공개합니다.' },
      { title: '끝까지 돌본다', desc: '한 마리도 지나치지 않습니다. 케어 네트워크는 24시간 열려 있습니다.' },
    ];

    function About() {
      return (
        <section id="about" className="scroll-mt-24 bg-slate-50 py-24">
          <div className="mx-auto max-w-6xl px-5">
            <div className="grid items-start gap-14 lg:grid-cols-2">
              <div>
                <SectionTitle
                  align="left"
                  eyebrow="ABOUT US"
                  title="태초마을의 작은 연구실에서 시작했습니다"
                  description="1996년, 포켓몬을 더 잘 이해하기 위해 만든 도감 한 권이 회사의 시작이었습니다. 지금도 우리는 같은 질문을 합니다 — 어떻게 하면 포켓몬과 사람이 더 잘 지낼 수 있을까?"
                />
                <div className="mt-8">
                  <a href="#contact"><Button variant="secondary">협업 제안하기</Button></a>
                </div>
              </div>
              <div className="grid gap-4">
                {VALUES.map((v, i) => (
                  <Card key={v.title} className="flex gap-5 p-6">
                    <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-amber-400 font-black text-slate-900">
                      {i + 1}
                    </div>
                    <div>
                      <h3 className="font-bold text-slate-900">{v.title}</h3>
                      <p className="mt-1.5 text-sm leading-relaxed text-slate-600">{v.desc}</p>
                    </div>
                  </Card>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    const HISTORY = [
      { year: '1996', text: '태초마을 연구실에서 초판 포켓몬 도감 발간' },
      { year: '2004', text: '포켓몬센터 케어 네트워크 1호점 개소' },
      { year: '2013', text: '도감 Open API 공개, 개발자 생태계 시작' },
      { year: '2020', text: '세계 배틀 리그 온라인 중계 플랫폼 런칭' },
      { year: '2026', text: '누적 도감 API 호출 5,400만 건 돌파' },
    ];

    function History() {
      return (
        <section id="history" className="scroll-mt-24 bg-white py-24">
          <div className="mx-auto max-w-6xl px-5">
            <SectionTitle eyebrow="HISTORY" title="걸어온 길" />
            <ol className="relative mx-auto mt-14 max-w-2xl border-l-2 border-amber-200 pl-8">
              {HISTORY.map((h) => (
                <li key={h.year} className="relative pb-10 last:pb-0">
                  <span className="absolute -left-[41px] flex h-5 w-5 rounded-full border-4 border-white bg-amber-400" aria-hidden="true" />
                  <div className="text-sm font-black text-amber-600">{h.year}</div>
                  <p className="mt-1 text-base font-medium text-slate-800">{h.text}</p>
                </li>
              ))}
            </ol>
          </div>
        </section>
      );
    }

    // ========================================
    // 📮 Contact — 문의 폼 (서버가 txt 파일로 저장)
    // ========================================
    const CATEGORIES = ['제휴·협업 문의', '서비스 이용 문의', '채용 문의', '언론·홍보 문의', '기타'];
    const EMPTY_FORM = { name: '', email: '', phone: '', category: CATEGORIES[0], message: '' };
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const PHONE_RE = /^[0-9+\-\s()]{7,20}$/;

    function Contact() {
      const [form, setForm] = useState(EMPTY_FORM);
      const [errors, setErrors] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [result, setResult] = useState(null); // { ok, message, savedTo, id }
      const mounted = useRef(true);

      useEffect(() => () => { mounted.current = false; }, []);

      const setField = useCallback((key) => (e) => {
        const { value } = e.target;
        setForm((prev) => ({ ...prev, [key]: value }));
        setErrors((prev) => (prev[key] ? { ...prev, [key]: undefined } : prev));
      }, []);

      const validate = () => {
        const next = {};
        if (!form.name.trim()) next.name = '이름을 입력해 주세요.';
        if (!form.email.trim()) next.email = '이메일을 입력해 주세요.';
        else if (!EMAIL_RE.test(form.email.trim())) next.email = '이메일 형식이 올바르지 않습니다.';
        if (form.phone.trim() && !PHONE_RE.test(form.phone.trim())) next.phone = '연락처 형식이 올바르지 않습니다.';
        if (!form.message.trim()) next.message = '문의 내용을 입력해 주세요.';
        else if (form.message.trim().length < 10) next.message = '문의 내용을 10자 이상 입력해 주세요.';
        return next;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setResult(null);

        const nextErrors = validate();
        setErrors(nextErrors);
        if (Object.keys(nextErrors).length > 0) return;

        setSubmitting(true);
        try {
          const res = await fetch(`${API_BASE_URL}/inquiries`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: form.name.trim(),
              email: form.email.trim(),
              phone: form.phone.trim(),
              category: form.category,
              message: form.message.trim(),
            }),
          });
          const body = await res.json().catch(() => ({}));
          if (!mounted.current) return;

          if (!res.ok || !body.success) {
            setResult({ ok: false, message: body.message || `문의 접수에 실패했습니다. (HTTP ${res.status})` });
            return;
          }

          setResult({
            ok: true,
            message: '문의가 정상적으로 접수되었습니다. 영업일 기준 2일 이내에 답변드리겠습니다.',
            savedTo: body.data && body.data.savedTo,
            id: body.data && body.data.id,
          });
          setForm(EMPTY_FORM);
        } catch (err) {
          if (mounted.current) {
            setResult({ ok: false, message: '서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해 주세요.' });
          }
        } finally {
          if (mounted.current) setSubmitting(false);
        }
      };

      return (
        <section id="contact" className="scroll-mt-24 bg-slate-50 py-24">
          <div className="mx-auto max-w-6xl px-5">
            <SectionTitle
              eyebrow="CONTACT"
              title="문의 남기기"
              description="남겨 주신 내용은 담당자에게 바로 전달되며, 접수 내역은 서버의 텍스트 파일로 보관됩니다."
            />

            <Card className="mx-auto mt-14 max-w-3xl p-7 sm:p-10">
              <form onSubmit={handleSubmit} noValidate>
                <div className="grid gap-5 sm:grid-cols-2">
                  <Input
                    id="name" label="이름" required
                    value={form.name} onChange={setField('name')}
                    placeholder="홍길동" error={errors.name} disabled={submitting}
                  />
                  <Input
                    id="email" label="이메일" type="email" required
                    value={form.email} onChange={setField('email')}
                    placeholder="trainer@example.com" error={errors.email} disabled={submitting}
                  />
                  <Input
                    id="phone" label="연락처" type="tel"
                    value={form.phone} onChange={setField('phone')}
                    placeholder="010-0000-0000 (선택)" error={errors.phone} disabled={submitting}
                  />
                  <Select
                    id="category" label="문의 유형" required
                    value={form.category} onChange={setField('category')}
                    options={CATEGORIES} disabled={submitting}
                  />
                  <Textarea
                    id="message" label="문의 내용" required className="sm:col-span-2"
                    value={form.message} onChange={setField('message')}
                    placeholder="문의하실 내용을 자세히 적어 주세요. (10자 이상)"
                    error={errors.message} disabled={submitting} rows={6}
                  />
                </div>

                <div className="mt-7 flex flex-col-reverse items-center gap-4 sm:flex-row sm:justify-between">
                  <p className="text-xs leading-relaxed text-slate-500">
                    입력하신 정보는 문의 답변 목적으로만 사용됩니다.
                  </p>
                  <Button type="submit" size="lg" disabled={submitting} className="w-full sm:w-auto">
                    {submitting ? (
                      <>
                        <svg className="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                          <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" className="opacity-25" />
                          <path d="M4 12a8 8 0 0 1 8-8" stroke="currentColor" strokeWidth="4" strokeLinecap="round" />
                        </svg>
                        접수 중...
                      </>
                    ) : '문의 보내기'}
                  </Button>
                </div>
              </form>

              {result && (
                <div
                  role="status"
                  aria-live="polite"
                  className={`mt-7 rounded-xl border p-5 text-sm animate-fade-up
                    ${result.ok ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-rose-200 bg-rose-50 text-rose-700'}`}
                >
                  <p className="font-bold">{result.ok ? '✅ 접수 완료' : '⚠️ 접수 실패'}</p>
                  <p className="mt-1.5 leading-relaxed">{result.message}</p>
                  {result.ok && result.savedTo && (
                    <p className="mt-2 font-mono text-xs text-emerald-700">
                      접수번호 #{result.id} · 저장 위치: {result.savedTo}
                    </p>
                  )}
                </div>
              )}
            </Card>
          </div>
        </section>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      return (
        <div className="min-h-screen">
          <Header />
          <main>
            <Hero />
            <Business />
            <Stats />
            <About />
            <History />
            <Contact />
          </main>
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
