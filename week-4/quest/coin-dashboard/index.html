<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코인 모의투자</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가능한 것만 커스텀 CSS 로 정의 */

    /* 직전 갱신 대비 가격이 바뀌면 가격 텍스트 배경을 잠깐 번쩍이게 */
    @keyframes flash-up   { from { background-color: rgba(52, 211, 153, .32); } to { background-color: transparent; } }
    @keyframes flash-down { from { background-color: rgba(251, 113, 133, .32); } to { background-color: transparent; } }
    .flash-up   { animation: flash-up 1.6s ease-out; }
    .flash-down { animation: flash-down 1.6s ease-out; }

    /* 로딩 스켈레톤 */
    @keyframes shimmer { to { transform: translateX(100%); } }
    .skeleton { position: relative; overflow: hidden; }
    .skeleton::after {
      content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
      animation: shimmer 1.4s infinite;
    }

    /* 체결 알림 토스트 */
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .toast-in { animation: toast-in .25s ease-out; }

    /* 추천 모달 */
    @keyframes modal-in { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-in { animation: modal-in .22s ease-out; }

    /* 넓고 충분히 높은 화면에서만 지갑·주문창을 고정 (낮은 화면에서 잘리지 않도록) */
    @media (min-width: 1280px) and (min-height: 960px) {
      .sticky-aside { position: sticky; top: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flash-up, .flash-down, .skeleton::after, .toast-in, .modal-in { animation: none; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useId, useMemo } = React;

    // ========================================
    // ⚙️ Config — CoinGecko & 가상지갑
    // ========================================

    // 지갑·주문은 같은 서버(server.js)의 API 로 주고받는다
    const API_BASE_URL = '/api';

    // 키가 필요 없는 공개 엔드포인트. 무료 한도는 분당 수 회 수준이라 30초 주기면 여유 있다.
    const COINGECKO_API_URL = 'https://api.coingecko.com/api/v3';
    const REFRESH_SECONDS = 30;
    const COIN_COUNT = 12;

    // 가상지갑이 원화 기준이라 시세도 KRW 로만 받는다.
    // sparkline=true 는 최근 7일 시간봉(약 168개)을 준다. 카드에서는 마지막 24개만 쓴다.
    const MARKETS_URL =
      `${COINGECKO_API_URL}/coins/markets?vs_currency=krw&order=market_cap_desc` +
      `&per_page=${COIN_COUNT}&page=1&sparkline=true&price_change_percentage=24h,7d,30d`;

    const INITIAL_CASH = 1000000;
    const MIN_ORDER_KRW = 5000;
    // 부동소수점 오차로 남는 먼지 수량은 전량으로 취급한다
    const QTY_EPSILON = 1e-8;
    const MEMO_MAX_LENGTH = 200;

    const PERCENT_PRESETS = [
      { label: '10%', value: 0.1 },
      { label: '25%', value: 0.25 },
      { label: '50%', value: 0.5 },
      { label: '최대', value: 1 },
    ];

    // ========================================
    // 🔢 Formatters & Trend
    // ========================================

    function priceDigits(abs) {
      if (abs >= 100) return 0;
      if (abs >= 1) return 2;
      if (abs >= 0.01) return 4;
      return 6;
    }

    function formatPrice(value) {
      if (value == null) return '—';
      const digits = priceDigits(Math.abs(value));
      return `${value.toLocaleString('ko-KR', { minimumFractionDigits: digits, maximumFractionDigits: digits })}원`;
    }

    function formatWon(value) {
      if (value == null) return '—';
      return `${Math.round(value).toLocaleString('ko-KR')}원`;
    }

    function signOf(value) {
      return value > 0 ? '+' : value < 0 ? '−' : '';
    }

    function formatSignedWon(value) {
      if (value == null) return '—';
      // 반올림 결과가 0원이면 부호를 붙이지 않는다
      return Math.round(Math.abs(value)) === 0 ? '0원' : signOf(value) + formatWon(Math.abs(value));
    }

    function formatSignedPrice(value) {
      if (value == null) return '—';
      return signOf(value) + formatPrice(Math.abs(value));
    }

    function formatCompact(value) {
      if (value == null) return '—';
      return `${new Intl.NumberFormat('ko-KR', { notation: 'compact', maximumFractionDigits: 1 }).format(value)}원`;
    }

    function formatQty(value) {
      if (value == null) return '—';
      return value.toLocaleString('ko-KR', { maximumFractionDigits: 8 });
    }

    function formatPercent(value) {
      return value == null ? '—' : `${Math.abs(value).toFixed(2)}%`;
    }

    function formatSignedPercent(value) {
      return value == null ? '—' : `${signOf(Number(value.toFixed(2)))}${formatPercent(value)}`;
    }

    const pad2 = (n) => String(n).padStart(2, '0');

    function formatTime(date) {
      return [date.getHours(), date.getMinutes(), date.getSeconds()].map(pad2).join(':');
    }

    function formatDate(timestamp) {
      const d = new Date(timestamp);
      return `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}`;
    }

    function trendOf(value) {
      if (value == null || Math.abs(value) < 0.005) return 'flat';
      return value > 0 ? 'up' : 'down';
    }

    // 원 단위 손익은 반올림 후 부호로 판단해야 '0원'이 초록/빨강으로 칠해지지 않는다
    const wonTrendOf = (value) => trendOf(value == null ? null : Math.round(value));

    const upper = (symbol) => symbol.toUpperCase();

    // Tailwind Play CDN 은 런타임 DOM 을 스캔하므로 완성된 클래스 문자열로 둔다.
    const TREND_STYLES = {
      up:   { text: 'text-emerald-400', bg: 'bg-emerald-500/15', ring: 'ring-emerald-500/30', bar: 'bg-emerald-400', glow: 'from-emerald-500/10', stroke: '#34d399', arrow: '▲', label: '상승' },
      down: { text: 'text-rose-400',    bg: 'bg-rose-500/15',    ring: 'ring-rose-500/30',    bar: 'bg-rose-400',    glow: 'from-rose-500/10',    stroke: '#fb7185', arrow: '▼', label: '하락' },
      flat: { text: 'text-slate-400',   bg: 'bg-slate-500/15',   ring: 'ring-slate-700',      bar: 'bg-slate-500',   glow: 'from-slate-500/5',    stroke: '#94a3b8', arrow: '■', label: '보합' },
    };

    const SIDE_STYLES = {
      buy:  { label: '매수', text: 'text-emerald-400', badge: 'bg-emerald-500/15 text-emerald-300', active: 'bg-emerald-500 text-slate-950 shadow' },
      sell: { label: '매도', text: 'text-rose-400',    badge: 'bg-rose-500/15 text-rose-300',       active: 'bg-rose-500 text-slate-950 shadow' },
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Card({ as: Tag = 'div', ringClass = 'ring-slate-800', className = '', children, ...props }) {
      return (
        <Tag className={`rounded-2xl bg-slate-900/70 p-5 ring-1 ${ringClass} ${className}`} {...props}>
          {children}
        </Tag>
      );
    }

    function Button({ variant = 'secondary', size = 'md', disabled = false, className = '', children, ...props }) {
      const variants = {
        primary: 'bg-sky-500 text-slate-950 hover:bg-sky-400',
        secondary: 'bg-slate-800 text-slate-100 ring-1 ring-slate-700 hover:bg-slate-700',
        ghost: 'text-slate-400 hover:bg-slate-800 hover:text-slate-100',
        buy: 'bg-emerald-500 text-slate-950 hover:bg-emerald-400',
        sell: 'bg-rose-500 text-slate-950 hover:bg-rose-400',
        buySoft: 'bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25',
        sellSoft: 'bg-rose-500/15 text-rose-300 hover:bg-rose-500/25',
      };
      const sizes = { xs: 'h-7 px-2.5 text-xs', sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-5 text-base' };
      return (
        <button
          type="button"
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 disabled:cursor-not-allowed disabled:opacity-40 ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        >
          {children}
        </button>
      );
    }

    function ChangeBadge({ value, className = '' }) {
      const t = TREND_STYLES[trendOf(value)];
      return (
        <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-sm font-semibold tabular-nums ${t.bg} ${t.text} ${className}`}>
          <span aria-hidden="true" className="text-[10px]">{t.arrow}</span>
          <span className="sr-only">{t.label}</span>
          {formatPercent(value)}
        </span>
      );
    }

    function Skeleton({ className = '' }) {
      return <div className={`skeleton rounded-md bg-slate-800/80 ${className}`} />;
    }

    function CoinAvatar({ src, size = 'h-9 w-9' }) {
      return <img src={src} alt="" loading="lazy" className={`${size} shrink-0 rounded-full bg-slate-800`} />;
    }

    function CountdownRing({ secondsLeft, total }) {
      const r = 9;
      const circumference = 2 * Math.PI * r;
      return (
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" className="-rotate-90">
          <circle cx="11" cy="11" r={r} fill="none" stroke="currentColor" strokeOpacity=".2" strokeWidth="2.5" />
          <circle
            cx="11" cy="11" r={r} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
            strokeDasharray={circumference}
            strokeDashoffset={circumference * (1 - secondsLeft / total)}
            style={{ transition: 'stroke-dashoffset 1s linear' }}
          />
        </svg>
      );
    }

    function Sparkline({ prices, color, height = 56 }) {
      // useId 값의 콜론은 url(#...) 참조를 깨뜨릴 수 있어 제거
      const gradientId = `spark-${useId().replace(/:/g, '')}`;
      if (!prices || prices.length < 2) return <div style={{ height }} />;

      const width = 260;
      const pad = 3;
      const min = Math.min(...prices);
      const span = Math.max(...prices) - min || 1;
      const line = prices
        .map((p, i) => {
          const x = (i / (prices.length - 1)) * width;
          const y = pad + (1 - (p - min) / span) * (height - pad * 2);
          return `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`;
        })
        .join(' ');

      return (
        <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full" style={{ height }} role="img" aria-label="최근 24시간 가격 추이">
          <defs>
            <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity=".3" />
              <stop offset="100%" stopColor={color} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${line} L${width},${height} L0,${height} Z`} fill={`url(#${gradientId})`} />
          <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
        </svg>
      );
    }

    function RangeBar({ low, high, current, color }) {
      const pct = high > low ? Math.min(100, Math.max(0, ((current - low) / (high - low)) * 100)) : 50;
      return (
        <div>
          <div className="relative h-1.5 rounded-full bg-slate-800" role="img" aria-label={`24시간 저가 대비 현재 위치 ${Math.round(pct)}%`}>
            <div className="absolute inset-y-0 left-0 rounded-full opacity-50" style={{ width: `${pct}%`, backgroundColor: color }} />
            <div className="absolute top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full ring-2 ring-slate-900" style={{ left: `${pct}%`, backgroundColor: color }} />
          </div>
          <div className="mt-1.5 flex justify-between gap-2 text-[11px] text-slate-500 tabular-nums">
            <span>저 {formatPrice(low)}</span>
            <span>고 {formatPrice(high)}</span>
          </div>
        </div>
      );
    }

    function SectionTitle({ title, meta, action }) {
      return (
        <div className="flex items-center justify-between gap-3">
          <h2 className="font-semibold text-slate-100">
            {title}
            {meta != null && <span className="ml-2 text-sm font-normal text-slate-500 tabular-nums">{meta}</span>}
          </h2>
          {action}
        </div>
      );
    }

    function Toast({ toast }) {
      const tone = toast?.tone === 'buy' ? 'ring-emerald-500/40' : toast?.tone === 'sell' ? 'ring-rose-500/40' : 'ring-slate-700';
      return (
        <div aria-live="polite" className="pointer-events-none fixed inset-x-0 bottom-5 z-50 flex justify-center px-4">
          {toast && (
            <p key={toast.id} className={`toast-in rounded-xl bg-slate-800 px-4 py-3 text-sm font-medium text-slate-100 shadow-2xl ring-1 ${tone}`}>
              {toast.message}
            </p>
          )}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, description, size = 'lg', children }) {
      const titleId = useId();
      const closeButtonRef = useRef(null);
      // 부모가 렌더링될 때마다 onClose 가 새로 만들어져도 포커스가 튀지 않도록 ref 로 보관
      const onCloseRef = useRef(onClose);
      onCloseRef.current = onClose;

      useEffect(() => {
        if (!isOpen) return;
        const previouslyFocused = document.activeElement;
        const previousOverflow = document.body.style.overflow;
        const handleKey = (e) => { if (e.key === 'Escape') onCloseRef.current(); };

        document.body.style.overflow = 'hidden';
        document.addEventListener('keydown', handleKey);
        closeButtonRef.current?.focus();

        return () => {
          document.body.style.overflow = previousOverflow;
          document.removeEventListener('keydown', handleKey);
          // 닫힌 뒤 주문창으로 스크롤하는 경우가 있어 포커스 복귀 때 스크롤은 막는다
          previouslyFocused?.focus?.({ preventScroll: true });
        };
      }, [isOpen]);

      if (!isOpen) return null;
      const sizes = { md: 'sm:max-w-lg', lg: 'sm:max-w-4xl' };

      return (
        <div className="fixed inset-0 z-40 flex items-end justify-center sm:items-center sm:p-6">
          <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onClick={onClose} aria-hidden="true" />
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby={titleId}
            className={`modal-in relative flex max-h-[92vh] w-full flex-col rounded-t-2xl bg-slate-900 shadow-2xl ring-1 ring-slate-700 sm:rounded-2xl ${sizes[size]}`}
          >
            <div className="flex items-start justify-between gap-4 border-b border-slate-800 px-5 py-4">
              <div className="min-w-0">
                <h2 id={titleId} className="text-lg font-semibold">{title}</h2>
                {description && <p className="mt-0.5 text-xs text-slate-500">{description}</p>}
              </div>
              <button
                ref={closeButtonRef}
                type="button"
                onClick={onClose}
                aria-label="닫기"
                className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-xl leading-none text-slate-400 transition hover:bg-slate-800 hover:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
              >
                ×
              </button>
            </div>
            <div className="overflow-y-auto px-5 py-5">{children}</div>
          </div>
        </div>
      );
    }

    // ========================================
    // 📡 Data Hook — 30초 자동 갱신
    // ========================================

    function useCoinMarkets() {
      const [coins, setCoins] = useState(null);
      const [error, setError] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [secondsLeft, setSecondsLeft] = useState(REFRESH_SECONDS);
      const [ticks, setTicks] = useState({ version: 0, byId: {} });

      const prevPricesRef = useRef({});
      const nextRefreshAtRef = useRef(0);
      const controllerRef = useRef(null);

      const refresh = useCallback(async () => {
        controllerRef.current?.abort();
        const controller = new AbortController();
        controllerRef.current = controller;

        // 수동 새로고침 시에도 카운트다운을 처음부터 다시 센다
        nextRefreshAtRef.current = Date.now() + REFRESH_SECONDS * 1000;
        setSecondsLeft(REFRESH_SECONDS);
        setRefreshing(true);

        try {
          const res = await fetch(MARKETS_URL, { signal: controller.signal });
          if (res.status === 429) throw new Error('CoinGecko 요청 한도를 잠시 초과했어요. 다음 주기에 다시 시도합니다.');
          if (!res.ok) throw new Error(`시세를 불러오지 못했어요. (HTTP ${res.status})`);
          const list = await res.json();
          if (!Array.isArray(list)) throw new Error('예상하지 못한 응답 형식이에요.');

          // 직전 갱신 대비 가격 방향
          const byId = {};
          list.forEach((coin) => {
            const prev = prevPricesRef.current[coin.id];
            if (prev != null && coin.current_price !== prev) {
              byId[coin.id] = coin.current_price > prev ? 'up' : 'down';
            }
            prevPricesRef.current[coin.id] = coin.current_price;
          });

          setCoins(list);
          setTicks((t) => ({ version: t.version + 1, byId }));
          setLastUpdated(new Date());
          setError(null);
        } catch (err) {
          if (err.name === 'AbortError') return;
          // 429 응답은 CORS 헤더 없이 와서 TypeError 로 떨어지는 경우가 많다
          setError(err instanceof TypeError
            ? '시세 서버에 연결하지 못했어요. 네트워크 상태나 요청 한도를 확인해 주세요.'
            : err.message);
        } finally {
          if (controllerRef.current === controller) setRefreshing(false);
        }
      }, []);

      useEffect(() => {
        refresh();
        const timer = setInterval(() => {
          const remaining = Math.ceil((nextRefreshAtRef.current - Date.now()) / 1000);
          if (remaining <= 0) refresh();
          else setSecondsLeft(remaining);
        }, 1000);
        return () => {
          clearInterval(timer);
          controllerRef.current?.abort();
        };
      }, [refresh]);

      return { coins, error, refreshing, lastUpdated, secondsLeft, ticks, refresh };
    }

    // ========================================
    // 👛 Wallet — 서버(server.js) + PostgreSQL 에 저장
    // ========================================

    // 서버 공통 응답 규약 { success, data, message? } 에서 data 만 꺼낸다
    async function apiRequest(endpoint, options = {}) {
      let res;
      try {
        res = await fetch(`${API_BASE_URL}${endpoint}`, {
          ...options,
          headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
        });
      } catch {
        throw new Error('주문 서버에 연결하지 못했어요. node server.js 로 서버를 실행했는지 확인해 주세요.');
      }
      const body = await res.json().catch(() => null);
      if (!res.ok || !body?.success) {
        throw new Error(body?.message || `서버 요청에 실패했어요. (HTTP ${res.status})`);
      }
      return body.data;
    }

    // wallet = { cash, holdings: { [coinId]: { coinId, symbol, name, image, qty, cost, lastPrice } }, orders(최신순) }
    // 지갑은 서버가 주문내역으로 계산해 돌려주므로 화면은 받은 값을 그대로 쓴다
    function useWallet() {
      const [wallet, setWallet] = useState(null);
      const [loadError, setLoadError] = useState(null);

      const reload = useCallback(async () => {
        setLoadError(null);
        try {
          setWallet(await apiRequest('/wallet'));
        } catch (err) {
          setLoadError(err.message);
        }
      }, []);

      useEffect(() => { reload(); }, [reload]);

      const placeOrder = useCallback(async (payload) => {
        const data = await apiRequest('/orders', { method: 'POST', body: JSON.stringify(payload) });
        setWallet(data.wallet);
        return data.order;
      }, []);

      const resetWallet = useCallback(async () => {
        setWallet(await apiRequest('/orders', { method: 'DELETE' }));
      }, []);

      return { wallet, loadError, reload, placeOrder, resetWallet };
    }

    // 입력값을 현재가로 계산해 체결 예상치와 오류를 돌려준다. 최종 검증은 서버가 다시 한다.
    function previewOrder({ side, price, input, cash, holding }) {
      if (!(price > 0)) return { amount: 0, qty: 0, error: '현재가를 불러오는 중이에요.' };

      if (side === 'buy') {
        const amount = Number(input) || 0;
        const qty = amount / price;
        if (!amount) return { amount: 0, qty: 0 };
        if (amount < MIN_ORDER_KRW) return { amount, qty, error: `최소 주문 금액은 ${formatWon(MIN_ORDER_KRW)}이에요.` };
        if (amount > cash) return { amount, qty, error: '보유 현금이 부족해요.' };
        return { amount, qty, ok: true };
      }

      const heldQty = holding?.qty ?? 0;
      const inputQty = Number(input) || 0;
      if (!heldQty) return { amount: 0, qty: 0, error: '보유한 수량이 없어요.' };
      if (!inputQty) return { amount: 0, qty: 0 };
      if (inputQty > heldQty + QTY_EPSILON) {
        return { amount: Math.round(inputQty * price), qty: inputQty, error: '보유 수량보다 많이 팔 수 없어요.' };
      }
      const isAll = heldQty - inputQty < QTY_EPSILON;
      const qty = isAll ? heldQty : inputQty;
      const amount = Math.round(qty * price);
      const costBasis = isAll ? holding.cost : holding.cost * (qty / heldQty);
      const profit = amount - costBasis;
      const profitRate = costBasis > 0 ? (profit / costBasis) * 100 : 0;
      // 전량 매도는 소액이어도 허용해야 잔량이 묶이지 않는다
      if (!isAll && amount < MIN_ORDER_KRW) return { amount, qty, profit, profitRate, error: `최소 주문 금액은 ${formatWon(MIN_ORDER_KRW)}이에요.` };
      return { amount, qty, profit, profitRate, ok: true };
    }

    // 소수 8자리까지 내림한 수량을 입력창용 문자열로
    function qtyToInput(qty) {
      return qty.toFixed(8).replace(/\.?0+$/, '');
    }

    // ========================================
    // 🧠 Recommendation — 시세 지표 점수로 매수 3개 · 매도 1개 추천
    // ========================================
    //
    // 점수 = 단기 추세(24시간 평균 vs 3일 평균) + 이번 주 상대 성과 + 30일 흐름(과열이면 감점)
    //      + 최근 3일 방향 + 상승 중 조정 가산점 − 큰 변동성 감점
    // 매도는 같은 점수를 뒤집고, 보유 손익(이익 실현·손실 관리)을 더해 가장 높은 코인을 고른다.

    // 달러에 가격이 묶인 코인은 사도 수익이 나지 않아 매수 후보에서 뺀다 (목록 밖 코인은 등락폭으로 판별)
    const PEGGED_COIN_IDS = new Set(['tether', 'usd-coin', 'dai', 'usds', 'ethena-usde', 'first-digital-usd']);

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const average = (list) => list.reduce((sum, v) => sum + v, 0) / list.length;
    const fmtPct = (value) => `${value > 0 ? '+' : ''}${value.toFixed(1)}%`;

    function median(list) {
      if (!list.length) return 0;
      const sorted = [...list].sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function analyzeCoin(coin) {
      const r7 = coin.price_change_percentage_7d_in_currency ?? 0;
      const r30 = coin.price_change_percentage_30d_in_currency ?? 0;
      const pegged = PEGGED_COIN_IDS.has(coin.id) || (Math.abs(r7) < 2 && Math.abs(r30) < 2);
      const series = (coin.sparkline_in_7d?.price ?? []).filter(Number.isFinite);
      if (series.length < 73) return { coin, r7, r30, pegged, enoughData: false };

      // 스파크라인은 현재가와 통화 단위가 다를 수 있어 서로 나눈 비율로만 쓴다
      const last = series[series.length - 1];
      const high = Math.max(...series);
      const low = Math.min(...series);
      const logReturns = series.slice(1).map((p, i) => Math.log(p / series[i]));
      const meanReturn = average(logReturns);

      return {
        coin, r7, r30, pegged, enoughData: true,
        trend: (average(series.slice(-24)) / average(series.slice(-72)) - 1) * 100,
        ret3d: (last / series[series.length - 72] - 1) * 100,
        fromHigh: (last / high - 1) * 100,
        rangePos: high > low ? ((last - low) / (high - low)) * 100 : 50,
        // 시간봉 로그수익률 표준편차를 하루 단위로 환산
        vol: Math.sqrt(average(logReturns.map((r) => (r - meanReturn) ** 2))) * Math.sqrt(24) * 100,
      };
    }

    function scoreBuy(m, medianR7) {
      const isPullback = m.r30 > 10 && m.fromHigh <= -3 && m.fromHigh >= -8 && m.trend > 0;
      const score =
        clamp(m.trend, -3, 3) * 10 +
        clamp(m.r7 - medianR7, -10, 10) * 2 +
        clamp(m.r30, -30, 40) * 0.3 - clamp(m.r30 - 60, 0, 70) * 0.3 +
        clamp(m.ret3d, -10, 5) * 2 +
        (isPullback ? 6 : 0) -
        Math.max(0, m.vol - 3) * 3;
      return { score, isPullback };
    }

    function buyReasons(m, medianR7, isPullback) {
      const good = [];
      if (m.trend > 0.3) good.push({ tag: '단기 상승전환', text: `최근 24시간 평균가가 3일 평균보다 ${fmtPct(m.trend)} 높아 단기 흐름이 위쪽이에요.` });
      if (m.r7 - medianR7 > 2) good.push({ tag: '상대강도', text: `이번 주 ${fmtPct(m.r7)}로 다른 코인(중간값 ${fmtPct(medianR7)})보다 잘 버텼어요.` });
      if (isPullback) good.push({ tag: '상승 중 조정', text: `한 달 ${fmtPct(m.r30)} 오른 뒤 이번 주 고점보다 ${fmtPct(m.fromHigh)} 내려와 쉬어가는 자리예요.` });
      else if (m.r30 > 10 && m.r30 <= 60) good.push({ tag: '월간 상승', text: `한 달 동안 ${fmtPct(m.r30)} 올라 큰 흐름이 좋아요.` });
      if (m.ret3d > 0.3) good.push({ tag: '반등', text: `최근 3일 ${fmtPct(m.ret3d)}로 오르고 있어요.` });
      if (m.vol < 2.2) good.push({ tag: '낮은 변동성', text: `하루 변동폭이 ${m.vol.toFixed(1)}%로 작아 비교적 안정적이에요.` });
      if (!good.length) good.push({ tag: '상대 점수', text: '뚜렷한 상승 신호는 없지만 남은 후보 중 지표 점수가 가장 높아요.' });

      const warnings = [];
      if (m.r30 > 60) warnings.push({ tag: '과열 주의', warn: true, text: `한 달 ${fmtPct(m.r30)} 급등해 과열 구간일 수 있어요.` });
      if (m.vol > 4) warnings.push({ tag: '고변동성', warn: true, text: `하루 변동폭이 ${m.vol.toFixed(1)}%로 커서 손실도 클 수 있어요.` });
      if (m.trend < -0.3) warnings.push({ tag: '단기 약세', warn: true, text: `24시간 평균가가 3일 평균보다 ${fmtPct(m.trend)} 낮아요.` });

      return [...good.slice(0, 3), ...warnings.slice(0, 1)];
    }

    function sellReasons(m, pnlRate) {
      const reasons = [];
      const overheated = m.r30 > 60 && m.ret3d < 0;
      if (overheated) reasons.push({ tag: '급등 후 꺾임', text: `한 달 ${fmtPct(m.r30)} 급등한 뒤 최근 3일 ${fmtPct(m.ret3d)}로 꺾이고 있어요.` });
      if (m.trend < -0.3) reasons.push({ tag: '단기 하락', text: `최근 24시간 평균가가 3일 평균보다 ${fmtPct(m.trend)} 낮아 단기 흐름이 아래쪽이에요.` });
      if (m.ret3d < -3 && !overheated) reasons.push({ tag: '연속 하락', text: `최근 3일 동안 ${fmtPct(m.ret3d)} 떨어졌어요.` });
      if (m.rangePos < 15) reasons.push({ tag: '주간 저점권', text: `가격이 이번 주 가격대의 맨 아래(하위 ${Math.round(m.rangePos)}%)에 있어요.` });
      if (m.vol > 4) reasons.push({ tag: '고변동성', text: `하루 변동폭이 ${m.vol.toFixed(1)}%로 커서 더 크게 떨어질 수 있어요.` });
      if (pnlRate > 20 && m.trend < 0) reasons.push({ tag: '이익 실현', text: `평가수익 ${fmtPct(pnlRate)}인 상태에서 흐름이 약해져 이익을 챙길 때일 수 있어요.` });
      if (pnlRate < -10 && m.trend < 0) reasons.push({ tag: '손실 관리', text: `평가손실 ${fmtPct(pnlRate)}에서 하락이 이어져 비중을 줄이는 걸 고려해 보세요.` });
      if (!reasons.length) reasons.push({ tag: '상대 약세', text: '뚜렷한 매도 신호는 없지만 보유 코인 중 지표 점수가 가장 낮아요.' });
      return reasons.slice(0, 4);
    }

    function buildRecommendations(coins, holdings) {
      const analyses = coins.map(analyzeCoin);
      const candidates = analyses.filter((m) => m.enoughData && !m.pegged);
      const medianR7 = median(candidates.map((m) => m.r7));

      const buys = candidates
        .map((m) => {
          const { score, isPullback } = scoreBuy(m, medianR7);
          return { ...m, score, reasons: buyReasons(m, medianR7, isPullback) };
        })
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);

      const analysisById = Object.fromEntries(analyses.map((m) => [m.coin.id, m]));
      const heldList = Object.values(holdings);
      const sells = heldList
        .map((h) => {
          const m = analysisById[h.coinId];
          if (!m) return null; // 상위 12개 시세 목록에서 빠진 코인은 분석할 수 없다
          const value = h.qty * m.coin.current_price;
          const base = { ...m, holding: h, avgPrice: h.cost / h.qty, pnl: value - h.cost, pnlRate: ((value - h.cost) / h.cost) * 100 };

          if (m.pegged || !m.enoughData) {
            return {
              ...base,
              score: m.pegged ? 0 : -100,
              reasons: [m.pegged
                ? { tag: '가격 고정 코인', text: '달러에 가격이 묶여 있어 들고 있어도 수익이 나지 않아요. 현금으로 바꿔 다른 코인에 쓰는 걸 고려해 보세요.' }
                : { tag: '데이터 부족', text: '최근 가격 데이터가 부족해 판단 근거가 약해요.' }],
            };
          }

          let score = -scoreBuy(m, medianR7).score;
          if (base.pnlRate > 20 && m.trend < 0) score += 10;
          if (base.pnlRate < -10 && m.trend < 0) score += 8;
          return { ...base, score, reasons: sellReasons(m, base.pnlRate) };
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score);

      return { at: new Date(), medianR7, buys, sell: sells[0] ?? null, heldCount: heldList.length };
    }

    function buySignal(score) {
      if (score >= 25) return { label: '매수 신호 강함', className: 'bg-emerald-500/15 text-emerald-300' };
      if (score >= 10) return { label: '매수 고려', className: 'bg-sky-500/15 text-sky-300' };
      return { label: '신호 약함', className: 'bg-amber-500/15 text-amber-300' };
    }

    function sellSignal(score) {
      if (score >= 15) return { label: '매도 신호 강함', className: 'bg-rose-500/15 text-rose-300' };
      if (score >= 0) return { label: '매도 고려', className: 'bg-amber-500/15 text-amber-300' };
      return { label: '급하지 않음', className: 'bg-slate-500/15 text-slate-300' };
    }

    const recommendationMemo = (side, reasons) =>
      `[추천 ${SIDE_STYLES[side].label}] ${reasons.map((r) => r.tag).join(' · ')}`.slice(0, MEMO_MAX_LENGTH);

    // ========================================
    // 🧩 Dashboard Components
    // ========================================

    function CoinCard({ coin, tick, tickVersion, selected, holdingQty, onTrade }) {

      const last24h = coin.sparkline_in_7d?.price?.slice(-24);
      // API 의 price_change_24h 는 등락률과 기준 시점이 달라 부호가 어긋날 때가 있다.

        ? null
        : coin.current_price - coin.current_price / (1 + pct / 100);

      return (
        <Card as="article" ringClass={t.ring} className={`relative overflow-hidden bg-gradient-to-br ${t.glow} to-transparent`}>
          <div className={`absolute inset-x-0 top-0 h-1 ${t.bar}`} aria-hidden="true" />
          {selected && <div className="pointer-events-none absolute inset-0 rounded-2xl ring-2 ring-inset ring-sky-400" aria-hidden="true" />}

          <header className="flex items-start justify-between gap-3">

            <ChangeBadge value={pct} />

          <div className="mt-4">
            {/* 가격이 바뀐 갱신마다 key 가 달라져 flash 애니메이션이 다시 재생된다 */}

              key={tick ? `${tick}-${tickVersion}` : 'static'}

          <dl className="mt-4 grid grid-cols-2 gap-2 border-t border-slate-800 pt-3 text-xs">

          <div className="mt-4 grid grid-cols-2 gap-2">

    }

    function CoinCardSkeleton() {
      return (
        <Card aria-hidden="true">
          <div className="flex items-center gap-3">

            <div className="flex-1 space-y-2">

    function MarketSummary({ coins, lastUpdated }) {
      const up = coins.filter((c) => c.price_change_percentage_24h > 0).length;
      const down = coins.filter((c) => c.price_change_percentage_24h < 0).length;
      const flat = coins.length - up - down;
      const avg = coins.reduce((sum, c) => sum + (c.price_change_percentage_24h ?? 0), 0) / coins.length;
      const share = (n) => `${(n / coins.length) * 100}%`;

      return (
        <Card className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

    function WalletCard({ wallet, coinValue, loadError, onRetry, onReset, resetting }) {
      if (!wallet) {
        return (
          <Card as="section" aria-labelledby="wallet-title" aria-busy={!loadError}>
            <h2 id="wallet-title" className="font-semibold">👛 내 지갑</h2>
            {loadError ? (
              <div role="alert" className="mt-3">
                <p className="text-sm text-amber-300">{loadError}</p>
                <Button variant="primary" size="sm" className="mt-3" onClick={onRetry}>다시 불러오기</Button>
              </div>
            ) : (
              <div aria-hidden="true">
                <Skeleton className="mt-4 h-3 w-12" />
                <Skeleton className="mt-2 h-9 w-48" />
                <Skeleton className="mt-2 h-5 w-24" />
                <Skeleton className="mt-4 h-2 w-full" />
                <Skeleton className="mt-4 h-10 w-full" />
              </div>
            )}
          </Card>
        );
      }

      const { cash } = wallet;
      const total = cash + coinValue;
      const profit = total - INITIAL_CASH;
      const rate = (profit / INITIAL_CASH) * 100;
      const t = TREND_STYLES[trendOf(rate)];
      const cashShare = total > 0 ? (cash / total) * 100 : 100;

      return (
        <Card as="section" aria-labelledby="wallet-title">
          <div className="flex items-center justify-between gap-3">
            <h2 id="wallet-title" className="font-semibold">👛 내 지갑</h2>
            <Button variant="ghost" size="xs" onClick={onReset} disabled={resetting}>{resetting ? '초기화 중…' : '초기화'}</Button>
          </div>

          <p className="mt-3 text-xs text-slate-500">총 자산</p>
          <p className="text-3xl font-bold tracking-tight tabular-nums">{formatWon(total)}</p>
          <p className={`mt-1 flex items-center gap-2 text-sm font-medium tabular-nums ${t.text}`}>
            {formatSignedWon(profit)}
            <ChangeBadge value={rate} className="!py-0.5 !text-xs" />
          </p>

          <div className="mt-4 flex h-2 overflow-hidden rounded-full bg-slate-800" role="img" aria-label={`현금 ${Math.round(cashShare)}%, 코인 ${Math.round(100 - cashShare)}%`}>
            <div className="bg-sky-400" style={{ width: `${cashShare}%` }} />
            <div className="bg-violet-400" style={{ width: `${100 - cashShare}%` }} />
          </div>

          <dl className="mt-4 grid grid-cols-3 gap-3 text-xs">
            <div>
              <dt className="flex items-center gap-1.5 text-slate-500"><span className="h-2 w-2 rounded-full bg-sky-400" aria-hidden="true" />현금</dt>
              <dd className="mt-1 text-sm font-semibold tabular-nums">{formatWon(cash)}</dd>
            </div>
            <div>
              <dt className="flex items-center gap-1.5 text-slate-500"><span className="h-2 w-2 rounded-full bg-violet-400" aria-hidden="true" />평가금액</dt>
              <dd className="mt-1 text-sm font-semibold tabular-nums">{formatWon(coinValue)}</dd>
            </div>
            <div>
              <dt className="text-slate-500">수익률</dt>
              <dd className={`mt-1 text-sm font-semibold tabular-nums ${t.text}`}>{formatSignedPercent(rate)}</dd>
            </div>
          </dl>
          <p className="mt-3 text-[11px] text-slate-600">시작 자금 {formatWon(INITIAL_CASH)} 기준 · 주문내역은 데이터베이스에 저장돼요</p>
        </Card>
      );
    }

    function OrderPanel({ coins, coin, side, onSelectCoin, onSideChange, walletReady, cash, holding, tick, tickVersion, memoPreset, onOrder }) {
      const [input, setInput] = useState('');
      const [memo, setMemo] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [submitError, setSubmitError] = useState(null);
      const inputId = useId();
      const errorId = useId();

      // 코인이나 주문 종류를 바꾸면 수량 입력과 서버 오류를 비운다 (메모는 유지)
      useEffect(() => {
        setInput('');
        setSubmitError(null);
      }, [coin.id, side]);

      // 추천 모달에서 매수·매도하기를 누르면 추천 이유를 메모에 채운다
      useEffect(() => {
        if (memoPreset) setMemo(memoPreset.text);
      }, [memoPreset]);

      const price = coin.current_price;
      const symbol = upper(coin.symbol);
      const preview = previewOrder({ side, price, input, cash, holding });
      const s = SIDE_STYLES[side];
      const canSubmit = walletReady && preview.ok && !submitting;

      const handleInput = (e) => {
        setSubmitError(null);
        if (side === 'buy') {
          setInput(e.target.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 12));
          return;
        }
        const [int, ...fraction] = e.target.value.replace(/[^\d.]/g, '').split('.');
        setInput(fraction.length ? `${int || '0'}.${fraction.join('').slice(0, 8)}` : int);
      };

      const applyPreset = (ratio) => {
        setSubmitError(null);
        if (side === 'buy') {
          setInput(String(Math.floor(cash * ratio)));
        } else if (holding) {
          setInput(qtyToInput(ratio === 1 ? holding.qty : Math.floor(holding.qty * ratio * 1e8) / 1e8));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!canSubmit) return;
        setSubmitting(true);
        setSubmitError(null);
        try {
          await onOrder({ side, coin, price, amount: preview.amount, qty: preview.qty, memo: memo.trim() });
          setInput('');
          setMemo('');
        } catch (err) {
          setSubmitError(err.message);
        } finally {
          setSubmitting(false);
        }
      };

      const displayValue = side === 'buy' && input ? Number(input).toLocaleString('ko-KR') : input;
      const message = !walletReady
        ? '지갑을 불러온 뒤 주문할 수 있어요.'
        : submitError || (input || side === 'sell' ? preview.error : '');

      return (
        <Card as="section" aria-labelledby="order-title">
          <h2 id="order-title" className="font-semibold">주문하기</h2>

          {/* 종목 선택 + 현재가 */}
          <div className="mt-3 flex items-center gap-3">
            <CoinAvatar src={coin.image} size="h-10 w-10" />
            <div className="min-w-0 flex-1">
              <label htmlFor={`${inputId}-coin`} className="sr-only">주문할 코인</label>
              <select
                id={`${inputId}-coin`}
                value={coin.id}
                onChange={(e) => onSelectCoin(e.target.value)}
                className="w-full rounded-lg bg-slate-950 px-2 py-1.5 text-sm font-semibold ring-1 ring-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
              >
                {coins.map((c) => (
                  <option key={c.id} value={c.id}>{c.name} ({upper(c.symbol)})</option>
                ))}
              </select>
            </div>
          </div>

          <div className="mt-3 flex items-end justify-between gap-3 rounded-xl bg-slate-950/60 px-4 py-3 ring-1 ring-slate-800">
            <div className="min-w-0">
              <p className="text-xs text-slate-500">현재가</p>
              <p
                key={tick ? `${tick}-${tickVersion}` : 'static'}
                className={`-mx-1 inline-block rounded-md px-1 text-2xl font-bold tracking-tight tabular-nums ${tick ? `flash-${tick}` : ''}`}
                aria-live="polite"
              >
                {formatPrice(price)}
              </p>
            </div>
            <ChangeBadge value={coin.price_change_percentage_24h} className="shrink-0" />
          </div>

          {/* 매수 / 매도 선택 */}
          <div role="radiogroup" aria-label="주문 종류" className="mt-4 grid grid-cols-2 rounded-xl bg-slate-950 p-1 ring-1 ring-slate-800">
            {['buy', 'sell'].map((key) => (
              <button
                key={key}
                type="button"
                role="radio"
                aria-checked={side === key}
                onClick={() => onSideChange(key)}
                className={`h-9 rounded-lg text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ${side === key ? SIDE_STYLES[key].active : 'text-slate-400 hover:text-slate-200'}`}
              >
                {SIDE_STYLES[key].label}
              </button>
            ))}
          </div>

          <form onSubmit={handleSubmit} className="mt-4" noValidate>
            <div className="flex items-baseline justify-between gap-2 text-xs">
              <label htmlFor={inputId} className="text-slate-400">{side === 'buy' ? '주문 금액' : '주문 수량'}</label>
              <span className="truncate text-slate-500 tabular-nums">
                {side === 'buy'
                  ? <>주문 가능 <span className="text-slate-300">{formatWon(cash)}</span></>
                  : <>보유 <span className="text-slate-300">{formatQty(holding?.qty ?? 0)} {symbol}</span></>}
              </span>
            </div>

            <div className="mt-1.5 flex h-12 items-center rounded-xl bg-slate-950 px-3 ring-1 ring-slate-700 focus-within:ring-2 focus-within:ring-sky-400">
              <input
                id={inputId}
                type="text"
                inputMode={side === 'buy' ? 'numeric' : 'decimal'}
                autoComplete="off"
                placeholder="0"
                value={displayValue}
                onChange={handleInput}
                aria-invalid={Boolean(preview.error && input)}
                aria-describedby={errorId}
                className="min-w-0 flex-1 bg-transparent text-right text-lg font-semibold tabular-nums outline-none placeholder:text-slate-600"
              />
              <span className="ml-2 text-sm text-slate-400">{side === 'buy' ? '원' : symbol}</span>
            </div>

            <div className="mt-2 grid grid-cols-4 gap-1.5">
              {PERCENT_PRESETS.map((p) => (
                <Button key={p.label} size="xs" onClick={() => applyPreset(p.value)} disabled={!walletReady || (side === 'sell' && !holding)}>
                  {p.label}
                </Button>
              ))}
            </div>

            <div className="mt-4">
              <div className="flex items-baseline justify-between gap-2 text-xs">
                <label htmlFor={`${inputId}-memo`} className="text-slate-400">주문 메모 <span className="text-slate-600">(선택)</span></label>
                <span className="text-slate-600 tabular-nums">{memo.length}/{MEMO_MAX_LENGTH}</span>
              </div>
              <textarea
                id={`${inputId}-memo`}
                rows={2}
                maxLength={MEMO_MAX_LENGTH}
                value={memo}
                onChange={(e) => setMemo(e.target.value)}
                placeholder={side === 'buy' ? '예: 조정 받아서 분할 매수 1차' : '예: 목표가 도달해서 절반 익절'}
                className="mt-1.5 w-full resize-none rounded-xl bg-slate-950 px-3 py-2 text-sm ring-1 ring-slate-700 placeholder:text-slate-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
              />
            </div>

            <dl className="mt-3 space-y-1.5 text-sm">
              <div className="flex justify-between gap-3">
                <dt className="text-slate-500">체결 가격</dt>
                <dd className="tabular-nums text-slate-300">{formatPrice(price)} <span className="text-xs text-slate-500">(시장가)</span></dd>
              </div>
              {side === 'buy' ? (
                <>
                  <div className="flex justify-between gap-3">
                    <dt className="text-slate-500">예상 수량</dt>
                    <dd className="tabular-nums text-slate-300">{formatQty(preview.qty)} {symbol}</dd>
                  </div>
                  <div className="flex justify-between gap-3">
                    <dt className="text-slate-500">주문 후 현금</dt>
                    <dd className="tabular-nums text-slate-300">{formatWon(Math.max(0, cash - preview.amount))}</dd>
                  </div>
                </>
              ) : (
                <>
                  <div className="flex justify-between gap-3">
                    <dt className="text-slate-500">예상 수령액</dt>
                    <dd className="tabular-nums text-slate-300">{formatWon(preview.amount)}</dd>
                  </div>
                  <div className="flex justify-between gap-3">
                    <dt className="text-slate-500">예상 실현손익</dt>
                    <dd className={`tabular-nums ${preview.profit == null ? 'text-slate-300' : TREND_STYLES[wonTrendOf(preview.profit)].text}`}>
                      {preview.profit == null ? '—' : `${formatSignedWon(preview.profit)} (${formatSignedPercent(preview.profitRate)})`}
                    </dd>
                  </div>
                </>
              )}
            </dl>

            <p id={errorId} className="mt-3 min-h-[1.25rem] text-xs text-amber-300" aria-live="polite">{message}</p>

            <Button type="submit" variant={side} size="lg" className="mt-2 w-full" disabled={!canSubmit} aria-busy={submitting}>
              {submitting ? '주문 전송 중…' : `${coin.name} ${s.label}`}
            </Button>
            <p className="mt-2 text-center text-[11px] text-slate-600">
              현재가로 즉시 체결 · 수수료 없음 · 최소 {formatWon(MIN_ORDER_KRW)}
            </p>
          </form>
        </Card>
      );
    }

    function OrderPanelPlaceholder({ error }) {
      return (
        <Card aria-busy={!error}>
          <h2 className="font-semibold">주문하기</h2>
          {error ? (
            <p className="mt-3 text-sm text-slate-400">시세를 받아오면 주문할 수 있어요.</p>
          ) : (
            <div aria-hidden="true">
              <Skeleton className="mt-4 h-10 w-full" />
              <Skeleton className="mt-3 h-16 w-full" />
              <Skeleton className="mt-4 h-10 w-full" />
              <Skeleton className="mt-4 h-12 w-full" />
              <Skeleton className="mt-6 h-12 w-full" />
            </div>
          )}
        </Card>
      );
    }

    function TablePlaceholder({ loading, children }) {
      return (
        <p className="mt-4 rounded-xl bg-slate-950/50 py-8 text-center text-sm text-slate-500" aria-busy={loading}>
          {loading ? '데이터베이스에서 불러오는 중…' : children}
        </p>
      );
    }

    function HoldingsCard({ rows, loading, onSell }) {
      return (
        <Card as="section" aria-labelledby="holdings-title">
          <SectionTitle title={<span id="holdings-title">보유 코인</span>} meta={loading ? null : `${rows.length}종`} />

          {rows.length === 0 ? (
            <TablePlaceholder loading={loading}>
              아직 보유한 코인이 없어요. 코인 카드의 <span className="text-emerald-400">매수</span> 버튼으로 시작해 보세요.
            </TablePlaceholder>
          ) : (
            <div className="relative -mx-5 mt-3 overflow-x-auto px-5">
              <table className="w-full min-w-[680px] text-sm">
                <thead>
                  <tr className="border-b border-slate-800 text-left text-xs text-slate-500">
                    <th scope="col" className="py-2 font-medium">코인</th>
                    <th scope="col" className="py-2 text-right font-medium">보유 수량</th>
                    <th scope="col" className="py-2 text-right font-medium">평균 매수가</th>
                    <th scope="col" className="py-2 text-right font-medium">현재가</th>
                    <th scope="col" className="py-2 text-right font-medium">평가금액</th>
                    <th scope="col" className="py-2 text-right font-medium">평가손익</th>
                    <th scope="col" className="py-2"><span className="sr-only">주문</span></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/70 tabular-nums">
                  {rows.map((r) => {
                    const t = TREND_STYLES[trendOf(r.rate)];
                    return (
                      <tr key={r.coinId}>
                        <td className="py-3">
                          <div className="flex items-center gap-2">
                            <CoinAvatar src={r.image} size="h-6 w-6" />
                            <span className="font-medium">{r.name}</span>
                            <span className="text-xs uppercase text-slate-500">{r.symbol}</span>
                          </div>
                        </td>
                        <td className="py-3 text-right">{formatQty(r.qty)}</td>
                        <td className="py-3 text-right text-slate-400">{formatPrice(r.avgPrice)}</td>
                        <td className="py-3 text-right">
                          {formatPrice(r.price)}
                          {!r.live && <span className="block text-[10px] text-amber-400">마지막 체결가</span>}
                        </td>
                        <td className="py-3 text-right font-semibold">{formatWon(r.value)}</td>
                        <td className={`py-3 text-right ${t.text}`}>
                          {formatSignedWon(r.profit)}
                          <span className="block text-xs">{formatSignedPercent(r.rate)}</span>
                        </td>
                        <td className="py-3 pl-3 text-right">
                          <Button variant="sellSoft" size="xs" onClick={() => onSell(r.coinId)} disabled={!r.live} aria-label={`${r.name} 매도`}>
                            매도
                          </Button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      );
    }

    function OrderHistory({ orders, loading }) {
      return (
        <Card as="section" aria-labelledby="history-title">
          <SectionTitle title={<span id="history-title">주문내역</span>} meta={loading ? null : `${orders.length}건`} />

          {orders.length === 0 ? (
            <TablePlaceholder loading={loading}>체결된 주문이 아직 없어요.</TablePlaceholder>
          ) : (
            <div className="relative -mx-5 mt-3 max-h-[28rem] overflow-auto px-5">
              <table className="w-full min-w-[940px] text-sm">
                <thead className="sticky top-0 z-10 bg-slate-900">
                  <tr className="border-b border-slate-800 text-left text-xs text-slate-500">
                    <th scope="col" className="py-2 pr-3 font-medium">주문일자</th>
                    <th scope="col" className="py-2 pr-3 font-medium">구분</th>
                    <th scope="col" className="py-2 pr-3 font-medium">코인</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">체결가</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">수량</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">체결금액</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">실현손익</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">수익률</th>
                    <th scope="col" className="py-2 pl-5 font-medium">주문메모</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/70 tabular-nums">
                  {orders.map((o) => {
                    const profitClass = o.profit == null ? 'text-slate-600' : TREND_STYLES[wonTrendOf(o.profit)].text;
                    return (
                      <tr key={o.id} className="align-top">
                        <td className="whitespace-nowrap py-2.5 pr-3">
                          <span className="block text-slate-300">{formatDate(o.at)}</span>
                          <span className="block text-xs text-slate-500">{formatTime(new Date(o.at))}</span>
                        </td>
                        <td className="py-2.5 pr-3">
                          <span className={`whitespace-nowrap rounded-md px-2 py-0.5 text-xs font-semibold ${SIDE_STYLES[o.side].badge}`}>{SIDE_STYLES[o.side].label}</span>
                        </td>
                        <td className="whitespace-nowrap py-2.5 pr-3">
                          <span className="font-medium">{o.name}</span>
                          <span className="ml-1.5 text-xs uppercase text-slate-500">{o.symbol}</span>
                        </td>
                        <td className="py-2.5 pl-3 text-right">{formatPrice(o.price)}</td>
                        <td className="py-2.5 pl-3 text-right">{formatQty(o.qty)}</td>
                        <td className="py-2.5 pl-3 text-right font-semibold">{formatWon(o.amount)}</td>
                        <td className={`py-2.5 pl-3 text-right ${profitClass}`}>{o.profit == null ? '—' : formatSignedWon(o.profit)}</td>
                        <td className={`py-2.5 pl-3 text-right ${profitClass}`}>{o.profitRate == null ? '—' : formatSignedPercent(o.profitRate)}</td>
                        <td className="max-w-[16rem] break-words py-2.5 pl-5 text-slate-300">
                          {o.memo ? o.memo : <span className="text-slate-600">—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      );
    }

    function PercentChips({ items }) {
      return (
        <dl className="grid grid-cols-3 gap-1.5 text-center text-[11px]">
          {items.map(({ label, value }) => (
            <div key={label} className="rounded-lg bg-slate-900 px-1 py-1.5">
              <dt className="text-slate-500">{label}</dt>
              <dd className={`mt-0.5 font-semibold tabular-nums ${TREND_STYLES[trendOf(value)].text}`}>{formatSignedPercent(value)}</dd>
            </div>
          ))}
        </dl>
      );
    }

    function ReasonList({ reasons }) {
      return (
        <ul className="space-y-1.5 text-xs leading-relaxed text-slate-300">
          {reasons.map((r) => (
            <li key={r.tag} className="flex gap-2">
              <span aria-hidden="true" className={r.warn ? 'text-amber-400' : 'text-sky-400'}>{r.warn ? '⚠' : '✓'}</span>
              <span><span className={`font-semibold ${r.warn ? 'text-amber-300' : 'text-slate-100'}`}>{r.tag}</span> · {r.text}</span>
            </li>
          ))}
        </ul>
      );
    }

    function RecommendationModal({ data, walletReady, onClose, onTrade }) {
      if (!data) return null;
      const { buys, sell, heldCount } = data;

      return (
        <Modal
          isOpen
          onClose={onClose}
          title="✨ 코인 추천"
          description={`${formatTime(data.at)} 시세 기준 · 24시간·7일·30일 등락률과 7일 시간봉 추세로 계산한 점수예요`}
        >
          <section aria-labelledby="rec-buy-title">
            <h3 id="rec-buy-title" className="flex items-center gap-2 font-semibold">
              <span className="rounded-md bg-emerald-500/15 px-2 py-0.5 text-xs text-emerald-300">매수</span>
              추천 TOP {buys.length}
            </h3>

            {buys.length === 0 ? (
              <p className="mt-3 rounded-xl bg-slate-950/50 py-6 text-center text-sm text-slate-500">분석할 수 있는 코인이 없어요.</p>
            ) : (
              <ol className="mt-3 grid gap-3 md:grid-cols-3">
                {buys.map((rec, i) => {
                  const signal = buySignal(rec.score);
                  return (
                    <li key={rec.coin.id} className="flex flex-col rounded-xl bg-slate-950/60 p-4 ring-1 ring-slate-800">
                      <div className="flex items-center gap-2.5">
                        <span className="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-emerald-500/15 text-xs font-bold text-emerald-300">{i + 1}</span>
                        <CoinAvatar src={rec.coin.image} size="h-8 w-8" />
                        <div className="min-w-0">
                          <p className="truncate font-semibold">{rec.coin.name}</p>
                          <p className="text-xs text-slate-500 tabular-nums">{upper(rec.coin.symbol)} · {formatPrice(rec.coin.current_price)}</p>
                        </div>
                      </div>
                      <p className="mt-3 flex items-center justify-between gap-2 text-xs">
                        <span className={`rounded-full px-2 py-0.5 font-semibold ${signal.className}`}>{signal.label}</span>
                        <span className="text-slate-500 tabular-nums">점수 {Math.round(rec.score)}</span>
                      </p>
                      <div className="mt-3">
                        <PercentChips items={[
                          { label: '24시간', value: rec.coin.price_change_percentage_24h },
                          { label: '7일', value: rec.r7 },
                          { label: '30일', value: rec.r30 },
                        ]} />
                      </div>
                      <div className="mt-3 flex-1"><ReasonList reasons={rec.reasons} /></div>
                      <Button
                        variant="buySoft"
                        size="sm"
                        className="mt-4 w-full"
                        onClick={() => onTrade(rec.coin.id, 'buy', recommendationMemo('buy', rec.reasons))}
                      >
                        {rec.coin.name} 매수하기
                      </Button>
                    </li>
                  );
                })}
              </ol>
            )}
          </section>

          <section aria-labelledby="rec-sell-title" className="mt-6">
            <h3 id="rec-sell-title" className="flex items-center gap-2 font-semibold">
              <span className="rounded-md bg-rose-500/15 px-2 py-0.5 text-xs text-rose-300">매도</span>
              보유 코인 중 1개
            </h3>

            {!walletReady ? (
              <p className="mt-3 rounded-xl bg-slate-950/50 py-6 text-center text-sm text-slate-500">지갑을 불러오지 못해 매도 추천을 할 수 없어요.</p>
            ) : heldCount === 0 ? (
              <p className="mt-3 rounded-xl bg-slate-950/50 py-6 text-center text-sm text-slate-500">
                보유한 코인이 없어서 매도 추천을 드릴 수 없어요. 위 추천 코인을 먼저 매수해 보세요.
              </p>
            ) : !sell ? (
              <p className="mt-3 rounded-xl bg-slate-950/50 py-6 text-center text-sm text-slate-500">
                보유 코인이 지금 시세 목록(시가총액 상위 {COIN_COUNT}개)에 없어 분석할 수 없어요.
              </p>
            ) : (
              (() => {
                const signal = sellSignal(sell.score);
                const pnlStyle = TREND_STYLES[wonTrendOf(sell.pnl)].text;
                return (
                  <div className="mt-3 rounded-xl bg-slate-950/60 p-4 ring-1 ring-rose-500/20">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                      <div className="flex min-w-0 items-center gap-2.5">
                        <CoinAvatar src={sell.coin.image} size="h-9 w-9" />
                        <div className="min-w-0">
                          <p className="truncate font-semibold">{sell.coin.name}</p>
                          <p className="text-xs text-slate-500 tabular-nums">{upper(sell.coin.symbol)} · {formatPrice(sell.coin.current_price)}</p>
                        </div>
                      </div>
                      <span className={`rounded-full px-2 py-0.5 text-xs font-semibold ${signal.className}`}>{signal.label}</span>
                    </div>

                    <dl className="mt-3 grid grid-cols-3 gap-3 border-y border-slate-800 py-3 text-xs">
                      <div>
                        <dt className="text-slate-500">보유 수량</dt>
                        <dd className="mt-0.5 truncate font-semibold tabular-nums">{formatQty(sell.holding.qty)}</dd>
                      </div>
                      <div>
                        <dt className="text-slate-500">평균 매수가</dt>
                        <dd className="mt-0.5 truncate font-semibold tabular-nums">{formatPrice(sell.avgPrice)}</dd>
                      </div>
                      <div>
                        <dt className="text-slate-500">평가손익</dt>
                        <dd className={`mt-0.5 truncate font-semibold tabular-nums ${pnlStyle}`}>
                          {formatSignedWon(sell.pnl)} <span className="text-[11px]">({formatSignedPercent(sell.pnlRate)})</span>
                        </dd>
                      </div>
                    </dl>

                    <div className="mt-3 grid gap-4 md:grid-cols-[minmax(0,1fr)_16rem] md:items-start">
                      <ReasonList reasons={sell.reasons} />
                      <div className="space-y-3">
                        <PercentChips items={[
                          { label: '24시간', value: sell.coin.price_change_percentage_24h },
                          { label: '7일', value: sell.r7 },
                          { label: '30일', value: sell.r30 },
                        ]} />
                        <Button
                          variant="sellSoft"
                          size="sm"
                          className="w-full"
                          onClick={() => onTrade(sell.coin.id, 'sell', recommendationMemo('sell', sell.reasons))}
                        >
                          {sell.coin.name} 매도하기
                        </Button>
                      </div>
                    </div>
                    {sell.score < 0 && (
                      <p className="mt-3 text-xs text-slate-500">보유 코인 모두 뚜렷한 매도 신호가 없어요. 그중 가장 약한 코인을 보여드렸어요.</p>
                    )}
                  </div>
                );
              })()
            )}
          </section>

          <p className="mt-6 rounded-lg bg-slate-950/50 px-3 py-2 text-[11px] leading-relaxed text-slate-500">
            달러에 가격이 묶인 코인(USDT·USDC 등)과 7일·30일 등락이 ±2% 안쪽인 코인은 매수 후보에서 뺐어요.
            과거 가격 지표만 본 참고용 추천이라 뉴스·수급은 반영하지 않고, 수익을 보장하지 않아요.
            매수·매도하기를 누르면 주문창에 코인과 추천 이유 메모가 채워져요.
          </p>
        </Modal>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <Card ringClass="ring-rose-500/30" className="py-12 text-center" role="alert">
          <p className="text-3xl" aria-hidden="true">⚠️</p>
          <h2 className="mt-3 font-semibold">시세를 불러오지 못했어요</h2>
          <p className="mt-1 text-sm text-slate-400">{message}</p>
          <Button variant="primary" className="mt-5" onClick={onRetry}>다시 시도</Button>
        </Card>
      );
    }

    function EmptyState() {
      return (
        <Card className="py-12 text-center">
          <p className="text-3xl" aria-hidden="true">🪙</p>
          <p className="mt-3 text-sm text-slate-400">표시할 코인 데이터가 없어요.</p>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function useToast() {
      const [toast, setToast] = useState(null);
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(timer);
      }, [toast]);
      const show = useCallback((message, tone) => setToast({ id: Date.now(), message, tone }), []);
      return [toast, show];
    }

    const EMPTY_HOLDINGS = {};
    const EMPTY_ORDERS = [];

    function App() {
      const { coins, error, refreshing, lastUpdated, secondsLeft, ticks, refresh } = useCoinMarkets();
      const { wallet, loadError, reload, placeOrder, resetWallet } = useWallet();
      const [toast, showToast] = useToast();
      const [selectedId, setSelectedId] = useState(null);
      const [side, setSide] = useState('buy');
      const [resetting, setResetting] = useState(false);
      const [recommendation, setRecommendation] = useState(null);
      const [memoPreset, setMemoPreset] = useState(null);
      const orderPanelRef = useRef(null);

      const coinList = coins ?? [];
      const selectedCoin = coinList.find((c) => c.id === selectedId) ?? coinList[0];
      const holdings = wallet?.holdings ?? EMPTY_HOLDINGS;
      const walletLoading = !wallet && !loadError;

      const prices = useMemo(
        () => Object.fromEntries(coinList.map((c) => [c.id, c.current_price])),
        [coins]
      );

      // 시세 목록에서 빠진 코인은 마지막 체결가로 평가한다
      const holdingRows = useMemo(() => (
        Object.values(holdings)
          .map((h) => {
            const live = prices[h.coinId] != null;
            const price = live ? prices[h.coinId] : h.lastPrice;
            const value = h.qty * price;
            return { ...h, live, price, value, avgPrice: h.cost / h.qty, profit: value - h.cost, rate: ((value - h.cost) / h.cost) * 100 };
          })
          .sort((a, b) => b.value - a.value)
      ), [holdings, prices]);

      const coinValue = holdingRows.reduce((sum, r) => sum + r.value, 0);

      const startTrade = (coinId, nextSide) => {
        setSelectedId(coinId);
        setSide(nextSide);
        // 좁은 화면에서는 주문창이 카드 위쪽에 있으므로 보이도록 스크롤
        const panel = orderPanelRef.current;
        if (!panel) return;
        const rect = panel.getBoundingClientRect();
        if (rect.top < 0 || rect.top > window.innerHeight * 0.6) {
          const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          panel.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        }
      };

      // 버튼을 누른 순간의 시세·보유 코인으로 계산해 고정한다 (모달이 열린 동안 순위가 바뀌지 않도록)
      const openRecommendations = () => {
        if (coinList.length) setRecommendation(buildRecommendations(coinList, holdings));
      };

      const closeRecommendations = () => setRecommendation(null);

      const tradeFromRecommendation = (coinId, nextSide, memo) => {
        setRecommendation(null);
        setMemoPreset({ text: memo, key: Date.now() });
        // 모달이 닫혀 스크롤 잠금이 풀린 다음 주문창으로 이동
        requestAnimationFrame(() => startTrade(coinId, nextSide));
      };

      // 실패하면 throw 해서 주문창이 오류 메시지를 보여주게 한다
      const handleOrder = async ({ side: orderSide, coin, price, amount, qty, memo }) => {
        const order = await placeOrder({
          side: orderSide,
          coin: { id: coin.id, symbol: coin.symbol, name: coin.name, image: coin.image },
          price,
          ...(orderSide === 'buy' ? { amount } : { quantity: qty }),
          memo,
        });
        showToast(
          `${order.name} ${formatQty(order.qty)} ${upper(order.symbol)} ${SIDE_STYLES[orderSide].label} 체결 · ${formatWon(order.amount)}`,
          orderSide
        );
      };

      const handleReset = async () => {
        if (!window.confirm(`지갑을 초기화할까요?\n현금 ${formatWon(INITIAL_CASH)}으로 돌아가고 데이터베이스의 주문내역이 모두 삭제돼요.`)) return;
        setResetting(true);
        try {
          await resetWallet();
          showToast('지갑을 초기화했어요.');
        } catch (err) {
          showToast(`초기화하지 못했어요. ${err.message}`);
        } finally {
          setResetting(false);
        }
      };

      return (
        <div className="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
          <header className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p className="flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-sky-400">
                <span className="relative flex h-2 w-2" aria-hidden="true">
                  <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-400 opacity-60 motion-reduce:animate-none" />
                  <span className="relative inline-flex h-2 w-2 rounded-full bg-sky-400" />
                </span>
                Paper Trading
              </p>
              <h1 className="mt-1 text-2xl font-bold sm:text-3xl">코인 모의투자</h1>
              <p className="mt-1 text-sm text-slate-400">
                가상지갑 {formatWon(INITIAL_CASH)}으로 CoinGecko 시가총액 상위 {COIN_COUNT}개를 사고팔아 보세요 · {REFRESH_SECONDS}초마다 시세 갱신
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <Button variant="primary" onClick={openRecommendations} disabled={!coinList.length} aria-haspopup="dialog">
                <span aria-hidden="true">✨</span> 매수·매도 추천 받기
              </Button>
              <Button onClick={refresh} disabled={refreshing} aria-label={`지금 새로고침 (${secondsLeft}초 후 자동 갱신)`}>
                <span className="text-sky-400"><CountdownRing secondsLeft={secondsLeft} total={REFRESH_SECONDS} /></span>
                <span className="w-[4.5ch] text-left tabular-nums">{refreshing ? '갱신중' : `${secondsLeft}초`}</span>
              </Button>
            </div>
          </header>

          <main className="mt-6 space-y-5">
            {coins && error && (
              <div role="status" className="rounded-xl bg-amber-500/10 px-4 py-3 text-sm text-amber-300 ring-1 ring-amber-500/30">
                ⚠️ {error} 마지막으로 받은 시세를 표시하고, 주문도 그 가격으로 체결돼요.
              </div>
            )}

            {coinList.length > 0 && <MarketSummary coins={coinList} lastUpdated={lastUpdated} />}

            <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_380px]">
              {/* 좁은 화면: 지갑·주문창이 먼저 / 넓은 화면: 오른쪽에 고정 */}
              <aside className="sticky-aside space-y-5 xl:col-start-2 xl:row-start-1 xl:self-start">
                <WalletCard
                  wallet={wallet}
                  coinValue={coinValue}
                  loadError={loadError}
                  onRetry={reload}
                  onReset={handleReset}
                  resetting={resetting}
                />
                <div ref={orderPanelRef} className="scroll-mt-4">
                  {selectedCoin ? (
                    <OrderPanel
                      coins={coinList}
                      coin={selectedCoin}
                      side={side}
                      onSelectCoin={setSelectedId}
                      onSideChange={setSide}
                      walletReady={Boolean(wallet)}
                      cash={wallet?.cash ?? 0}
                      holding={holdings[selectedCoin.id]}
                      tick={ticks.byId[selectedCoin.id]}
                      tickVersion={ticks.version}
                      memoPreset={memoPreset}
                      onOrder={handleOrder}
                    />
                  ) : (
                    <OrderPanelPlaceholder error={error} />
                  )}
                </div>
              </aside>

              <section aria-label="코인 시세" className="min-w-0 xl:col-start-1 xl:row-start-1">
                {!coins && error && <ErrorState message={error} onRetry={refresh} />}

                {!coins && !error && (
                  <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3" aria-busy="true" aria-label="시세 불러오는 중">
                    {Array.from({ length: 6 }, (_, i) => <CoinCardSkeleton key={i} />)}
                  </div>
                )}

                {coins && coins.length === 0 && <EmptyState />}

                {coinList.length > 0 && (
                  <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                    {coinList.map((coin) => (
                      <CoinCard
                        key={coin.id}
                        coin={coin}
                        tick={ticks.byId[coin.id]}
                        tickVersion={ticks.version}
                        selected={coin.id === selectedCoin?.id}
                        holdingQty={holdings[coin.id]?.qty}
                        onTrade={(nextSide) => startTrade(coin.id, nextSide)}
                      />
                    ))}
                  </div>
                )}
              </section>
            </div>

            <HoldingsCard rows={holdingRows} loading={walletLoading} onSell={(coinId) => startTrade(coinId, 'sell')} />
            <OrderHistory orders={wallet?.orders ?? EMPTY_ORDERS} loading={walletLoading} />
          </main>

          <footer className="mt-10 text-center text-xs text-slate-600">
            데이터 제공: CoinGecko · 가상 자금으로 하는 모의투자이며 실제 거래가 아닙니다 · 무료 API는 1~2분 단위로 캐시되어 30초마다 값이 바뀌지 않을 수 있습니다
          </footer>

          <RecommendationModal
            data={recommendation}
            walletReady={Boolean(wallet)}
            onClose={closeRecommendations}
            onTrade={tradeFromRecommendation}
          />
          <Toast toast={toast} />
        </div>
      );
    }

    // ========================================
    // 🖥️ Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
