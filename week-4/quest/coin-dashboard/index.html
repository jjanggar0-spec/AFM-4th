<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코인 모의투자</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가능한 것만 커스텀 CSS 로 정의 */

    /* 직전 갱신 대비 가격이 바뀌면 가격 텍스트 배경을 잠깐 번쩍이게 */
    @keyframes flash-up   { from { background-color: rgba(52, 211, 153, .32); } to { background-color: transparent; } }
    @keyframes flash-down { from { background-color: rgba(251, 113, 133, .32); } to { background-color: transparent; } }
    .flash-up   { animation: flash-up 1.6s ease-out; }
    .flash-down { animation: flash-down 1.6s ease-out; }

    /* 로딩 스켈레톤 */
    @keyframes shimmer { to { transform: translateX(100%); } }
    .skeleton { position: relative; overflow: hidden; }
    .skeleton::after {
      content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
      animation: shimmer 1.4s infinite;
    }

    /* 체결 알림 토스트 */
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .toast-in { animation: toast-in .25s ease-out; }

    /* 추천 모달 */
    @keyframes modal-in { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-in { animation: modal-in .22s ease-out; }

    /* 넓고 충분히 높은 화면에서만 지갑·주문창을 고정 (낮은 화면에서 잘리지 않도록) */
    @media (min-width: 1280px) and (min-height: 960px) {
      .sticky-aside { position: sticky; top: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flash-up, .flash-down, .skeleton::after, .toast-in, .modal-in { animation: none; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useId, useMemo } = React;

    // ========================================
    // ⚙️ Config — CoinGecko & 가상지갑
    // ========================================

    // 지갑·주문은 같은 서버(server.js)의 API 로 주고받는다
    const API_BASE_URL = '/api';

    // 키가 필요 없는 공개 엔드포인트. 무료 한도는 분당 수 회 수준이라 30초 주기면 여유 있다.
    const COINGECKO_API_URL = 'https://api.coingecko.com/api/v3';
    const REFRESH_SECONDS = 30;
    const COIN_COUNT = 12;

    // 가상지갑이 원화 기준이라 시세도 KRW 로만 받는다.
    // sparkline=true 는 최근 7일 시간봉(약 168개)을 준다. 카드에서는 마지막 24개만 쓴다.
    const MARKETS_URL =
      `${COINGECKO_API_URL}/coins/markets?vs_currency=krw&order=market_cap_desc` +
      `&per_page=${COIN_COUNT}&page=1&sparkline=true&price_change_percentage=24h,7d,30d`;

    const INITIAL_CASH = 1000000;
    const MIN_ORDER_KRW = 5000;
    // 부동소수점 오차로 남는 먼지 수량은 전량으로 취급한다
    const QTY_EPSILON = 1e-8;
    const MEMO_MAX_LENGTH = 200;

    const PERCENT_PRESETS = [
      { label: '10%', value: 0.1 },
      { label: '25%', value: 0.25 },
      { label: '50%', value: 0.5 },
      { label: '최대', value: 1 },
    ];

    // ========================================
    // 🔢 Formatters & Trend
    // ========================================

    function priceDigits(abs) {
      if (abs >= 100) return 0;
      if (abs >= 1) return 2;
      if (abs >= 0.01) return 4;
      return 6;
    }

    function formatPrice(value) {
      if (value == null) return '—';
      const digits = priceDigits(Math.abs(value));
      return `${value.toLocaleString('ko-KR', { minimumFractionDigits: digits, maximumFractionDigits: digits })}원`;
    }

    function formatWon(value) {
      if (value == null) return '—';
      return `${Math.round(value).toLocaleString('ko-KR')}원`;
    }

    function signOf(value) {
      return value > 0 ? '+' : value < 0 ? '−' : '';
    }

    function formatSignedWon(value) {
      if (value == null) return '—';
      // 반올림 결과가 0원이면 부호를 붙이지 않는다
      return Math.round(Math.abs(value)) === 0 ? '0원' : signOf(value) + formatWon(Math.abs(value));
    }

    function formatSignedPrice(value) {
      if (value == null) return '—';
      return signOf(value) + formatPrice(Math.abs(value));
    }

    function formatCompact(value) {
      if (value == null) return '—';
      return `${new Intl.NumberFormat('ko-KR', { notation: 'compact', maximumFractionDigits: 1 }).format(value)}원`;
    }

    function formatQty(value) {
      if (value == null) return '—';
      return value.toLocaleString('ko-KR', { maximumFractionDigits: 8 });
    }

    function formatPercent(value) {
      return value == null ? '—' : `${Math.abs(value).toFixed(2)}%`;
    }

    function formatSignedPercent(value) {
      return value == null ? '—' : `${signOf(Number(value.toFixed(2)))}${formatPercent(value)}`;
    }

    const pad2 = (n) => String(n).padStart(2, '0');

    function formatTime(date) {
      return [date.getHours(), date.getMinutes(), date.getSeconds()].map(pad2).join(':');
    }

    function formatDate(timestamp) {
      const d = new Date(timestamp);
      return `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())}`;
    }

    function trendOf(value) {
      if (value == null || Math.abs(value) < 0.005) return 'flat';
      return value > 0 ? 'up' : 'down';
    }

    // 원 단위 손익은 반올림 후 부호로 판단해야 '0원'이 초록/빨강으로 칠해지지 않는다
    const wonTrendOf = (value) => trendOf(value == null ? null : Math.round(value));

    const upper = (symbol) => symbol.toUpperCase();

    // Tailwind Play CDN 은 런타임 DOM 을 스캔하므로 완성된 클래스 문자열로 둔다.
    const TREND_STYLES = {
      up:   { text: 'text-emerald-400', bg: 'bg-emerald-500/15', ring: 'ring-emerald-500/30', bar: 'bg-emerald-400', glow: 'from-emerald-500/10', stroke: '#34d399', arrow: '▲', label: '상승' },
      down: { text: 'text-rose-400',    bg: 'bg-rose-500/15',    ring: 'ring-rose-500/30',    bar: 'bg-rose-400',    glow: 'from-rose-500/10',    stroke: '#fb7185', arrow: '▼', label: '하락' },
      flat: { text: 'text-slate-400',   bg: 'bg-slate-500/15',   ring: 'ring-slate-700',      bar: 'bg-slate-500',   glow: 'from-slate-500/5',    stroke: '#94a3b8', arrow: '■', label: '보합' },
    };

    const SIDE_STYLES = {
      buy:  { label: '매수', text: 'text-emerald-400', badge: 'bg-emerald-500/15 text-emerald-300', active: 'bg-emerald-500 text-slate-950 shadow' },
      sell: { label: '매도', text: 'text-rose-400',    badge: 'bg-rose-500/15 text-rose-300',       active: 'bg-rose-500 text-slate-950 shadow' },
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Card({ as: Tag = 'div', ringClass = 'ring-slate-800', className = '', children, ...props }) {
      return (
        <Tag className={`rounded-2xl bg-slate-900/70 p-5 ring-1 ${ringClass} ${className}`} {...props}>
          {children}
        </Tag>
      );
    }

    function Button({ variant = 'secondary', size = 'md', disabled = false, className = '', children, ...props }) {
      const variants = {
        primary: 'bg-sky-500 text-slate-950 hover:bg-sky-400',
        secondary: 'bg-slate-800 text-slate-100 ring-1 ring-slate-700 hover:bg-slate-700',
        ghost: 'text-slate-400 hover:bg-slate-800 hover:text-slate-100',
        buy: 'bg-emerald-500 text-slate-950 hover:bg-emerald-400',
        sell: 'bg-rose-500 text-slate-950 hover:bg-rose-400',
        buySoft: 'bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25',
        sellSoft: 'bg-rose-500/15 text-rose-300 hover:bg-rose-500/25',
      };
      const sizes = { xs: 'h-7 px-2.5 text-xs', sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-5 text-base' };
      return (
        <button
          type="button"
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 disabled:cursor-not-allowed disabled:opacity-40 ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        >
          {children}
        </button>
      );
    }

    function ChangeBadge({ value, className = '' }) {
      const t = TREND_STYLES[trendOf(value)];
      return (
        <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-sm font-semibold tabular-nums ${t.bg} ${t.text} ${className}`}>
          <span aria-hidden="true" className="text-[10px]">{t.arrow}</span>
          <span className="sr-only">{t.label}</span>
          {formatPercent(value)}
        </span>
      );
    }

    function Skeleton({ className = '' }) {
      return <div className={`skeleton rounded-md bg-slate-800/80 ${className}`} />;
    }

    function CoinAvatar({ src, size = 'h-9 w-9' }) {
      return <img src={src} alt="" loading="lazy" className={`${size} shrink-0 rounded-full bg-slate-800`} />;
    }

    function CountdownRing({ secondsLeft, total }) {
      const r = 9;
      const circumference = 2 * Math.PI * r;
      return (
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" className="-rotate-90">
          <circle cx="11" cy="11" r={r} fill="none" stroke="currentColor" strokeOpacity=".2" strokeWidth="2.5" />
          <circle
            cx="11" cy="11" r={r} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"
            strokeDasharray={circumference}
            strokeDashoffset={circumference * (1 - secondsLeft / total)}
            style={{ transition: 'stroke-dashoffset 1s linear' }}
          />
        </svg>
      );
    }

    function Sparkline({ prices, color, height = 56 }) {
      // useId 값의 콜론은 url(#...) 참조를 깨뜨릴 수 있어 제거
      const gradientId = `spark-${useId().replace(/:/g, '')}`;
      if (!prices || prices.length < 2) return <div style={{ height }} />;

      const width = 260;
      const pad = 3;
      const min = Math.min(...prices);
      const span = Math.max(...prices) - min || 1;
      const line = prices
        .map((p, i) => {
          const x = (i / (prices.length - 1)) * width;
          const y = pad + (1 - (p - min) / span) * (height - pad * 2);
          return `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`;
        })
        .join(' ');

      return (
        <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full" style={{ height }} role="img" aria-label="최근 24시간 가격 추이">
          <defs>
            <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity=".3" />
              <stop offset="100%" stopColor={color} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={`${line} L${width},${height} L0,${height} Z`} fill={`url(#${gradientId})`} />
          <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
        </svg>
      );
    }

    function RangeBar({ low, high, current, color }) {
      const pct = high > low ? Math.min(100, Math.max(0, ((current - low) / (high - low)) * 100)) : 50;
      return (
        <div>
          <div className="relative h-1.5 rounded-full bg-slate-800" role="img" aria-label={`24시간 저가 대비 현재 위치 ${Math.round(pct)}%`}>
            <div className="absolute inset-y-0 left-0 rounded-full opacity-50" style={{ width: `${pct}%`, backgroundColor: color }} />
            <div className="absolute top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full ring-2 ring-slate-900" style={{ left: `${pct}%`, backgroundColor: color }} />
          </div>
          <div className="mt-1.5 flex justify-between gap-2 text-[11px] text-slate-500 tabular-nums">
            <span>저 {formatPrice(low)}</span>
            <span>고 {formatPrice(high)}</span>
          </div>
        </div>
      );
    }

    function SectionTitle({ title, meta, action }) {
      return (
        <div className="flex items-center justify-between gap-3">
          <h2 className="font-semibold text-slate-100">
            {title}
            {meta != null && <span className="ml-2 text-sm font-normal text-slate-500 tabular-nums">{meta}</span>}
          </h2>
          {action}
        </div>
      );
    }

    function Toast({ toast }) {
      const tone = toast?.tone === 'buy' ? 'ring-emerald-500/40' : toast?.tone === 'sell' ? 'ring-rose-500/40' : 'ring-slate-700';
      return (
        <div aria-live="polite" className="pointer-events-none fixed inset-x-0 bottom-5 z-50 flex justify-center px-4">
          {toast && (
            <p key={toast.id} className={`toast-in rounded-xl bg-slate-800 px-4 py-3 text-sm font-medium text-slate-100 shadow-2xl ring-1 ${tone}`}>
              {toast.message}
            </p>
          )}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, description, size = 'lg', children }) {
      const titleId = useId();
      const closeButtonRef = useRef(null);
      // 부모가 렌더링될 때마다 onClose 가 새로 만들어져도 포커스가 튀지 않도록 ref 로 보관
      const onCloseRef = useRef(onClose);
      onCloseRef.current = onClose;

      useEffect(() => {
        if (!isOpen) return;
        const previouslyFocused = document.activeElement;
        const previousOverflow = document.body.style.overflow;
        const handleKey = (e) => { if (e.key === 'Escape') onCloseRef.current(); };

        document.body.style.overflow = 'hidden';
        document.addEventListener('keydown', handleKey);
        closeButtonRef.current?.focus();

        return () => {
          document.body.style.overflow = previousOverflow;
          document.removeEventListener('keydown', handleKey);
          // 닫힌 뒤 주문창으로 스크롤하는 경우가 있어 포커스 복귀 때 스크롤은 막는다
          previouslyFocused?.focus?.({ preventScroll: true });
        };
      }, [isOpen]);

      if (!isOpen) return null;
      const sizes = { md: 'sm:max-w-lg', lg: 'sm:max-w-4xl' };

      return (
        <div className="fixed inset-0 z-40 flex items-end justify-center sm:items-center sm:p-6">
          <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" onClick={onClose} aria-hidden="true" />
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby={titleId}
            className={`modal-in relative flex max-h-[92vh] w-full flex-col rounded-t-2xl bg-slate-900 shadow-2xl ring-1 ring-slate-700 sm:rounded-2xl ${sizes[size]}`}
          >
            <div className="flex items-start justify-between gap-4 border-b border-slate-800 px-5 py-4">
              <div className="min-w-0">
                <h2 id={titleId} className="text-lg font-semibold">{title}</h2>
                {description && <p className="mt-0.5 text-xs text-slate-500">{description}</p>}
              </div>
              <button
                ref={closeButtonRef}
                type="button"
                onClick={onClose}
                aria-label="닫기"
                className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-xl leading-none text-slate-400 transition hover:bg-slate-800 hover:text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
              >
                ×
              </button>
            </div>
            <div className="overflow-y-auto px-5 py-5">{children}</div>
          </div>
        </div>
      );
    }

    // ========================================
    // 📡 Data Hook — 30초 자동 갱신
    // ========================================

    function useCoinMarkets() {
      const [coins, setCoins] = useState(null);
      const [error, setError] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [secondsLeft, setSecondsLeft] = useState(REFRESH_SECONDS);
      const [ticks, setTicks] = useState({ version: 0, byId: {} });

      const prevPricesRef = useRef({});
      const nextRefreshAtRef = useRef(0);
      const controllerRef = useRef(null);

      const refresh = useCallback(async () => {
        controllerRef.current?.abort();
        const controller = new AbortController();
        controllerRef.current = controller;

        // 수동 새로고침 시에도 카운트다운을 처음부터 다시 센다
        nextRefreshAtRef.current = Date.now() + REFRESH_SECONDS * 1000;
        setSecondsLeft(REFRESH_SECONDS);
        setRefreshing(true);

        try {
          const res = await fetch(MARKETS_URL, { signal: controller.signal });
          if (res.status === 429) throw new Error('CoinGecko 요청 한도를 잠시 초과했어요. 다음 주기에 다시 시도합니다.');
          if (!res.ok) throw new Error(`시세를 불러오지 못했어요. (HTTP ${res.status})`);
          const list = await res.json();
          if (!Array.isArray(list)) throw new Error('예상하지 못한 응답 형식이에요.');

          // 직전 갱신 대비 가격 방향
          const byId = {};
          list.forEach((coin) => {
            const prev = prevPricesRef.current[coin.id];
            if (prev != null && coin.current_price !== prev) {
              byId[coin.id] = coin.current_price > prev ? 'up' : 'down';
            }
            prevPricesRef.current[coin.id] = coin.current_price;
          });

          setCoins(list);
          setTicks((t) => ({ version: t.version + 1, byId }));
          setLastUpdated(new Date());
          setError(null);
        } catch (err) {
          if (err.name === 'AbortError') return;
          // 429 응답은 CORS 헤더 없이 와서 TypeError 로 떨어지는 경우가 많다
          setError(err instanceof TypeError
            ? '시세 서버에 연결하지 못했어요. 네트워크 상태나 요청 한도를 확인해 주세요.'
            : err.message);
        } finally {
          if (controllerRef.current === controller) setRefreshing(false);
        }
      }, []);

      useEffect(() => {
        refresh();
        const timer = setInterval(() => {
          const remaining = Math.ceil((nextRefreshAtRef.current - Date.now()) / 1000);
          if (remaining <= 0) refresh();
          else setSecondsLeft(remaining);
        }, 1000);
        return () => {
          clearInterval(timer);
          controllerRef.current?.abort();
        };
      }, [refresh]);

      return { coins, error, refreshing, lastUpdated, secondsLeft, ticks, refresh };
    }

    // ========================================
    // 👛 Wallet — 서버(server.js) + PostgreSQL 에 저장
    // ========================================

    // 서버 공통 응답 규약 { success, data, message? } 에서 data 만 꺼낸다
    async function apiRequest(endpoint, options = {}) {
      let res;
      try {
        res = await fetch(`${API_BASE_URL}${endpoint}`, {
          ...options,
          headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
        });
      } catch {
        throw new Error('주문 서버에 연결하지 못했어요. node server.js 로 서버를 실행했는지 확인해 주세요.');
      }
      const body = await res.json().catch(() => null);
      if (!res.ok || !body?.success) {
        throw new Error(body?.message || `서버 요청에 실패했어요. (HTTP ${res.status})`);
      }
      return body.data;
    }

    // wallet = { cash, holdings: { [coinId]: { coinId, symbol, name, image, qty, cost, lastPrice } }, orders(최신순) }
    // 지갑은 서버가 주문내역으로 계산해 돌려주므로 화면은 받은 값을 그대로 쓴다
    function useWallet() {
      const [wallet, setWallet] = useState(null);
      const [loadError, setLoadError] = useState(null);

      const reload = useCallback(async () => {
        setLoadError(null);
        try {
          setWallet(await apiRequest('/wallet'));
        } catch (err) {
          setLoadError(err.message);
        }
      }, []);

      useEffect(() => { reload(); }, [reload]);

      const placeOrder = useCallback(async (payload) => {
        const data = await apiRequest('/orders', { method: 'POST', body: JSON.stringify(payload) });
        setWallet(data.wallet);
        return data.order;
      }, []);

      const resetWallet = useCallback(async () => {
        setWallet(await apiRequest('/orders', { method: 'DELETE' }));
      }, []);

      return { wallet, loadError, reload, placeOrder, resetWallet };
    }

    // 입력값을 현재가로 계산해 체결 예상치와 오류를 돌려준다. 최종 검증은 서버가 다시 한다.
    function previewOrder({ side, price, input, cash, holding }) {
      if (!(price > 0)) return { amount: 0, qty: 0, error: '현재가를 불러오는 중이에요.' };

      if (side === 'buy') {
        const amount = Number(input) || 0;
        const qty = amount / price;
        if (!amount) return { amount: 0, qty: 0 };
        if (amount < MIN_ORDER_KRW) return { amount, qty, error: `최소 주문 금액은 ${formatWon(MIN_ORDER_KRW)}이에요.` };
        if (amount > cash) return { amount, qty, error: '보유 현금이 부족해요.' };
        return { amount, qty, ok: true };
      }

      const heldQty = holding?.qty ?? 0;
      const inputQty = Number(input) || 0;
      if (!heldQty) return { amount: 0, qty: 0, error: '보유한 수량이 없어요.' };
      if (!inputQty) return { amount: 0, qty: 0 };
      if (inputQty > heldQty + QTY_EPSILON) {
        return { amount: Math.round(inputQty * price), qty: inputQty, error: '보유 수량보다 많이 팔 수 없어요.' };
      }
      const isAll = heldQty - inputQty < QTY_EPSILON;
      const qty = isAll ? heldQty : inputQty;
      const amount = Math.round(qty * price);
      const costBasis = isAll ? holding.cost : holding.cost * (qty / heldQty);
      const profit = amount - costBasis;
      const profitRate = costBasis > 0 ? (profit / costBasis) * 100 : 0;
      // 전량 매도는 소액이어도 허용해야 잔량이 묶이지 않는다
      if (!isAll && amount < MIN_ORDER_KRW) return { amount, qty, profit, profitRate, error: `최소 주문 금액은 ${formatWon(MIN_ORDER_KRW)}이에요.` };
      return { amount, qty, profit, profitRate, ok: true };
    }

    // 소수 8자리까지 내림한 수량을 입력창용 문자열로
    function qtyToInput(qty) {
      return qty.toFixed(8).replace(/\.?0+$/, '');
    }

    // ========================================
    // 🧠 Strategy — research/my-strategy.md 규칙으로 매수·매도 추천
    // ========================================
    //
    // 점수를 매기지 않고 규칙을 하나씩 대입한다. 규칙 하나라도 "아니오"면 매수하지 않고,
    // "아니오"는 없는데 확인할 수 없는 값이 있으면 "판단 불가"로 둔다.

    const STRATEGY = {
      // 원칙 1 — CoinGecko id 와 업비트 마켓 코드
      coins: [
        { id: 'bitcoin', market: 'KRW-BTC', symbol: 'BTC', name: '비트코인' },
        { id: 'ethereum', market: 'KRW-ETH', symbol: 'ETH', name: '이더리움' },
        { id: 'ripple', market: 'KRW-XRP', symbol: 'XRP', name: '엑스알피' },
      ],
      weeklyDropPct: -3,      // 원칙 2 — 주간 등락률이 이 값 이하일 때만 매수
      stopLossPct: -10,       // 원칙 3 ① 손절
      takeProfitPct: 20,      // 원칙 3 ③ 익절
      takeProfitRatio: 0.5,
      breakEvenPct: 0,        // 원칙 3 ② 익절 후 본전 이탈
      maxBuyKrw: 300000,      // 상한 — 1회 매수
      maxCostPerCoinKrw: 400000, // 상한 — 코인당 매수 원가 합계
    };

    // 금지 조건 — 매주 공식 일정을 확인해 갱신한다.
    //   kst: 발표·표결 시각(한국 시각) / 시각을 모르면 usDate 만 / 날짜를 모르면 unconfirmedUntil(그날까지 매수 금지)
    const BLOCKING_EVENTS = [
      { name: '美 상원 클래리티법 절차 표결', kst: '2026-09-16T03:15:00+09:00' },
      { name: 'FOMC 금리 결정 발표', kst: '2026-09-17T03:00:00+09:00' },
    ];

    const DAY_MS = 24 * 60 * 60 * 1000;
    // 규칙은 소수 둘째 자리(%)로 판단한다. 90/100−1 이 −9.9999…% 로 계산돼 −10% 손절을 놓치지 않도록 반올림 후 비교한다
    const roundPct = (value) => Math.round(value * 100) / 100 + 0; // + 0: −0 을 0 으로
    const fmtPct = (value) => { const v = roundPct(value); return `${v > 0 ? '+' : ''}${v.toFixed(2)}%`; };

    // YYYY-MM-DD (한국 날짜)
    const kstDateOf = (date) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(date);
    const addDays = (ymd, n) => kstDateOf(new Date(new Date(`${ymd}T12:00:00+09:00`).getTime() + n * DAY_MS));
    const kstHourOf = (date) => Number(new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', hour: 'numeric', hourCycle: 'h23' }).format(date));
    const shortDate = (ymd) => { const [, m, d] = ymd.split('-'); return `${Number(m)}/${Number(d)}`; };
    const formatKstDateTime = (iso) =>
      new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });

    // 원칙 2 — 판단일 09:00 시가 vs 7일 전 09:00 시가 (업비트 일봉은 매일 09:00 KST 에 시작)
    // 브라우저에서 업비트를 직접 부르면 초당 1회 제한(429)에 걸려 서버(server.js)가 대신 받아 온다
    async function fetchWeeklyChanges(markets, todayKst) {
      let data;
      try {
        data = await apiRequest(`/strategy/candles?date=${todayKst}`);
      } catch (err) {
        return markets.map((market) => ({ market, error: err.message }));
      }
      const weekAgoKst = addDays(todayKst, -7);
      return markets.map((market) => {
        const entry = data[market];
        if (!entry || entry.error) return { market, error: `업비트 시세를 불러오지 못했어요. (${entry?.error ?? '응답 없음'})` };
        const openOn = (ymd) => entry.candles.find((c) => c.date === ymd)?.open;
        const todayOpen = openOn(todayKst);
        const weekAgoOpen = openOn(weekAgoKst);
        if (!todayOpen || !weekAgoOpen) return { market, error: '업비트 일봉에 필요한 날짜가 없어요.' };
        return { market, todayKst, weekAgoKst, todayOpen, weekAgoOpen, changePct: roundPct((todayOpen / weekAgoOpen - 1) * 100) };
      });
    }

    // 금지 조건 — 이벤트마다 금지 날짜 목록을 만든다
    function eventWindows(events) {
      return events.map((ev) => {
        if (ev.kst) {
          const day = kstDateOf(new Date(ev.kst));
          return { ...ev, when: formatKstDateTime(ev.kst), blockedDays: [addDays(day, -1), day] };
        }
        if (ev.usDate) {
          // 시각을 모르면 미국 날짜와 다음 날을 모두 당일로 본다
          return { ...ev, when: `미국 ${shortDate(ev.usDate)} (시각 미정)`, blockedDays: [addDays(ev.usDate, -1), ev.usDate, addDays(ev.usDate, 1)] };
        }
        return { ...ev, when: '날짜 미확인', unconfirmed: true, blockedDays: [] };
      });
    }

    function blockingToday(windows, todayKst) {
      return windows
        .filter((w) => (w.unconfirmed ? todayKst <= w.unconfirmedUntil : w.blockedDays.includes(todayKst)))
        .map((w) => ({ ...w, reason: w.unconfirmed ? '날짜 미확인' : w.blockedDays[0] === todayKst ? '전날' : '당일' }));
    }

    // 원칙 3 — 지금 포지션(보유 0에서 산 뒤 전량 매도 전까지)에서 매도한 적이 있는지
    function soldInCurrentPosition(ordersNewestFirst, coinId) {
      let qty = 0;
      let sold = false;
      for (const o of [...ordersNewestFirst].reverse()) {
        if (o.coinId !== coinId) continue;
        if (o.side === 'buy') {
          if (qty < QTY_EPSILON) sold = false;
          qty += o.qty;
        } else {
          qty -= o.qty;
          if (qty < QTY_EPSILON) { qty = 0; sold = false; } else sold = true;
        }
      }
      return sold;
    }

    // check.ok: true(통과) · false(탈락) · null(확인 불가)
    function verdictOf(checks) {
      if (checks.some((c) => c.ok === false)) return 'skip';
      if (checks.some((c) => c.ok == null)) return 'unknown';
      return 'go';
    }

    function evaluateBuy({ rule, coin, weekly, blocks, wallet, now }) {
      const todayKst = kstDateOf(now);
      const checks = [];

      checks.push({ label: '원칙 1 · 종목', ok: true, text: `${rule.symbol}는 매수 대상 3종목(BTC·ETH·XRP)이에요.` });

      if (kstHourOf(now) < 9) {
        checks.push({ label: '원칙 2 · 주간 -3% 이하', ok: false, text: '09:00 전이라 오늘 일봉이 없어요. 09:00 이후에 판단해요.' });
      } else if (weekly?.error || weekly?.changePct == null) {
        checks.push({ label: '원칙 2 · 주간 -3% 이하', ok: false, text: `${weekly?.error ?? '주간 등락률을 구하지 못했어요.'} 데이터가 없으면 매수하지 않아요.` });
      } else {
        const hit = weekly.changePct <= STRATEGY.weeklyDropPct;
        checks.push({
          label: '원칙 2 · 주간 -3% 이하',
          ok: hit,
          text: `${shortDate(weekly.weekAgoKst)} 09:00 ${formatPrice(weekly.weekAgoOpen)} → ${shortDate(weekly.todayKst)} 09:00 ${formatPrice(weekly.todayOpen)} = ${fmtPct(weekly.changePct)}`,
        });
      }

      checks.push(blocks.length
        ? { label: '금지 조건 · 이벤트', ok: false, text: blocks.map((b) => `${b.name} ${b.reason}`).join(', ') }
        : { label: '금지 조건 · 이벤트', ok: true, text: '오늘은 금지 이벤트의 전날·당일이 아니에요.' });

      let amount = 0;
      if (!wallet) {
        checks.push({ label: '상한 · 하루 1회', ok: null, text: '지갑을 불러오지 못해 확인할 수 없어요.' });
        checks.push({ label: '상한 · 매수 금액', ok: null, text: '지갑을 불러오지 못해 계산할 수 없어요.' });
      } else {
        const boughtToday = wallet.orders.some((o) => o.side === 'buy' && o.coinId === rule.id && kstDateOf(new Date(o.at)) === todayKst);
        checks.push({ label: '상한 · 하루 1회', ok: !boughtToday, text: boughtToday ? `오늘 이미 ${rule.symbol}를 샀어요.` : `오늘 ${rule.symbol} 매수 기록이 없어요.` });

        const cost = wallet.holdings[rule.id]?.cost ?? 0;
        const room = Math.max(0, STRATEGY.maxCostPerCoinKrw - cost);
        amount = Math.floor(Math.min(STRATEGY.maxBuyKrw, room, wallet.cash));
        checks.push({
          label: '상한 · 매수 금액',
          ok: amount >= MIN_ORDER_KRW,
          text: `min(30만 원, 40만 원 − 보유 원가 ${formatWon(cost)}, 현금 ${formatWon(wallet.cash)}) = ${formatWon(amount)}`
            + (amount < MIN_ORDER_KRW ? ` · 최소 주문 ${formatWon(MIN_ORDER_KRW)} 미만` : ''),
        });
      }

      if (!coin) checks.push({ label: '주문 가능', ok: false, text: `${rule.symbol}가 지금 시세 목록(시가총액 상위 ${COIN_COUNT}개)에 없어 주문할 수 없어요.` });

      const verdict = verdictOf(checks);
      return { rule, coin, weekly, checks, verdict, amount: verdict === 'go' ? amount : 0 };
    }

    function evaluateSell({ holding, coin, orders }) {
      const avgPrice = holding.cost / holding.qty;
      if (!coin) {
        return { holding, coin, avgPrice, verdict: 'unknown', action: '판단 불가', text: `시세 목록(상위 ${COIN_COUNT}개)에 없어 현재가를 알 수 없어요.` };
      }
      const price = coin.current_price;
      const rate = roundPct((price / avgPrice - 1) * 100);
      const sold = soldInCurrentPosition(orders, holding.coinId);
      const base = { holding, coin, avgPrice, price, rate, sold, pnl: holding.qty * price - holding.cost };

      if (rate <= STRATEGY.stopLossPct) {
        return { ...base, verdict: 'go', action: '손절 · 전량 매도', rule: '원칙 3 ①', qty: holding.qty, text: `수익률 ${fmtPct(rate)} ≤ ${STRATEGY.stopLossPct}%` };
      }
      if (sold && rate <= STRATEGY.breakEvenPct) {
        return { ...base, verdict: 'go', action: '본전 이탈 · 전량 매도', rule: '원칙 3 ②', qty: holding.qty, text: `이번 포지션에서 이미 익절했고 수익률 ${fmtPct(rate)} ≤ 0%` };
      }
      if (!sold && rate >= STRATEGY.takeProfitPct) {
        const qty = Math.floor(holding.qty * STRATEGY.takeProfitRatio * 1e8) / 1e8;
        return { ...base, verdict: 'go', action: '익절 · 50% 매도', rule: '원칙 3 ③', qty, text: `수익률 ${fmtPct(rate)} ≥ +${STRATEGY.takeProfitPct}%, 이번 포지션 첫 매도` };
      }
      return {
        ...base, verdict: 'skip', action: '보유 유지', text: sold
          ? `이미 익절한 포지션 · 수익률 ${fmtPct(rate)} (0% 이하면 전량 매도)`
          : `수익률 ${fmtPct(rate)} · 손절 ${STRATEGY.stopLossPct}% / 익절 +${STRATEGY.takeProfitPct}% 사이`,
      };
    }

    async function buildStrategyRecommendations(coins, wallet) {
      const now = new Date();
      const todayKst = kstDateOf(now);
      const weekly = await fetchWeeklyChanges(STRATEGY.coins.map((rule) => rule.market), todayKst);
      const windows = eventWindows(BLOCKING_EVENTS);
      const blocks = blockingToday(windows, todayKst);
      const coinById = Object.fromEntries(coins.map((c) => [c.id, c]));

      const buys = STRATEGY.coins.map((rule, i) =>
        evaluateBuy({ rule, coin: coinById[rule.id], weekly: weekly[i], blocks, wallet, now })
      );
      const sells = wallet
        ? Object.values(wallet.holdings).map((h) => evaluateSell({ holding: h, coin: coinById[h.coinId], orders: wallet.orders }))
        : null;

      return { at: now, todayKst, windows, blocks, buys, sells };
    }

    const strategyMemo = (text) => `[전략] ${text}`.slice(0, MEMO_MAX_LENGTH);

    // ========================================
    // 🧩 Dashboard Components
    // ========================================

      // API 의 price_change_24h 는 등락률과 기준 시점이 달라 부호가 어긋날 때가 있다.
      // 배지와 색이 항상 일치하도록 등락률에서 금액을 역산한다.
      const changeAmount = pct == null || coin.current_price == null
        ? null

      return (

          <div className={`absolute inset-x-0 top-0 h-1 ${t.bar}`} aria-hidden="true" />
          {selected && <div className="pointer-events-none absolute inset-0 rounded-2xl ring-2 ring-inset ring-sky-400" aria-hidden="true" />}

          <header className="flex items-start justify-between gap-3">

          <div className="mt-4">

          <div className="mt-4 grid grid-cols-2 gap-2">

    }

    function CoinCardSkeleton() {
      return (
        <Card aria-hidden="true">

    function MarketSummary({ coins, lastUpdated }) {
      const up = coins.filter((c) => c.price_change_percentage_24h > 0).length;
      const down = coins.filter((c) => c.price_change_percentage_24h < 0).length;
      const flat = coins.length - up - down;
      const avg = coins.reduce((sum, c) => sum + (c.price_change_percentage_24h ?? 0), 0) / coins.length;

    function WalletCard({ wallet, coinValue, loadError, onRetry, onReset, resetting }) {

          <Card as="section" aria-labelledby="wallet-title" aria-busy={!loadError}>

            {loadError ? (
              <div role="alert" className="mt-3">
                <p className="text-sm text-amber-300">{loadError}</p>
                <Button variant="primary" size="sm" className="mt-3" onClick={onRetry}>다시 불러오기</Button>
              </div>
            ) : (
              <div aria-hidden="true">

      const { cash } = wallet;

    // ========================================
    // 📈 Daily Profit — 보유 코인 일자별 수익현황 (server.js /api/portfolio/daily)
    // ========================================

    // 코인 색은 처음 산 순서로 고정 (순위가 바뀌어도 색이 바뀌지 않게). dataviz 검증 팔레트 다크 1~8번
    // — 어두운 배경(#0f172a)에서 색각이상·대비 검사를 모두 통과한 순서라 섞지 않는다
    const SERIES_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
    const TOTAL_COLOR = '#e2e8f0';
    const CHART_HEIGHT = 280;
    const CHART_MARGIN = { top: 16, right: 16, bottom: 28, left: 64 };

    // 0·1·2·2.5·5 단위로 떨어지는 눈금
    function niceTicks(min, max, count = 5) {
      if (min === max) { min -= 1; max += 1; }
      const raw = (max - min) / count;
      const mag = 10 ** Math.floor(Math.log10(raw));
      const n = raw / mag;
      const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
      const ticks = [];
      for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
      return ticks;
    }

    const compactWon = new Intl.NumberFormat('ko-KR', { notation: 'compact', maximumFractionDigits: 1 });
    function formatAxis(value, unit) {
      if (unit === 'rate') return `${value}%`;
      return value === 0 ? '0' : `${value < 0 ? '−' : ''}${compactWon.format(Math.abs(value))}`;
    }

    function pointLabel(point, long = false) {
      if (point.isNow) return '지금';
      const [, m, d] = point.date.split('-').map(Number);
      return long ? `${m}월 ${d}일 오전 9시` : `${m}/${d}`;
    }

    function usePortfolioDaily(ordersKey) {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          setData(await apiRequest('/portfolio/daily'));
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, []);

      // 주문이 체결·초기화되면 보유 내역이 바뀌므로 다시 받는다
      useEffect(() => { if (ordersKey != null) load(); }, [ordersKey, load]);

      return { data, error, loading, reload: load };
    }

    function useElementWidth() {
      const ref = useRef(null);
      const [width, setWidth] = useState(0);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const ro = new ResizeObserver(([entry]) => setWidth(Math.floor(entry.contentRect.width)));
        ro.observe(el);
        return () => ro.disconnect();
      }, []);
      return [ref, width];
    }

    // 값이 없는 날(아직 안 샀던 날)은 선을 끊는다
    function linePath(values, x, y) {
      let d = '';
      let pen = false;
      values.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
        pen = true;
      });
      return d;
    }

    function ProfitChart({ points, lines, unit }) {
      const [wrapRef, width] = useElementWidth();
      const [hover, setHover] = useState(null);
      const fmt = unit === 'rate' ? formatSignedPercent : formatSignedWon;

      const innerW = Math.max(0, width - CHART_MARGIN.left - CHART_MARGIN.right);
      const innerH = CHART_HEIGHT - CHART_MARGIN.top - CHART_MARGIN.bottom;
      const all = lines.flatMap((l) => l.values).filter((v) => v != null);
      const ticks = niceTicks(Math.min(0, ...all), Math.max(0, ...all));
      const yMin = ticks[0];
      const yMax = ticks[ticks.length - 1];
      const n = points.length;
      const x = (i) => CHART_MARGIN.left + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
      const y = (v) => CHART_MARGIN.top + ((yMax - v) / (yMax - yMin || 1)) * innerH;

      // 날짜 라벨은 겹치지 않을 만큼만 (마지막 '지금'은 항상)
      const labelEvery = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(innerW / 52))));
      const showLabel = (i) => i === n - 1 || (i % labelEvery === 0 && n - 1 - i >= labelEvery / 2);

      const handleMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const i = n <= 1 ? 0 : Math.round(((px - CHART_MARGIN.left) / innerW) * (n - 1));
        setHover(Math.min(n - 1, Math.max(0, i)));
      };

      const hoverRows = hover == null ? [] : lines.filter((l) => l.values[hover] != null);
      const tipLeft = hover == null ? 0 : x(hover);
      const tipOnLeft = tipLeft > width / 2;

      return (
        <div ref={wrapRef} className="relative mt-4 select-none">
          {width > 0 && (
            <svg width={width} height={CHART_HEIGHT} role="img" aria-label="보유 코인 일자별 수익 선 그래프 (자세한 값은 아래 표로 보기)">
              {/* 눈금선 — 0 선만 진하게 */}
              {ticks.map((t) => (
                <g key={t}>
                  <line x1={CHART_MARGIN.left} x2={width - CHART_MARGIN.right} y1={y(t)} y2={y(t)}
                    stroke={t === 0 ? '#64748b' : '#1e293b'} strokeWidth="1" shapeRendering="crispEdges" />
                  <text x={CHART_MARGIN.left - 8} y={y(t)} dy="0.32em" textAnchor="end" className="fill-slate-500 text-[11px] tabular-nums">
                    {formatAxis(t, unit)}
                  </text>
                </g>
              ))}
              {points.map((p, i) => showLabel(i) && (
                <text key={p.at} x={x(i)} y={CHART_HEIGHT - 8} textAnchor={i === n - 1 ? 'end' : 'middle'}
                  className={`text-[11px] tabular-nums ${p.isNow ? 'fill-slate-300' : 'fill-slate-500'}`}>
                  {pointLabel(p)}
                </text>
              ))}

              {/* 선 — 합계는 굵게 맨 위에 */}
              {[...lines].reverse().map((l) => (
                <path key={l.key} d={linePath(l.values, x, y)} fill="none" stroke={l.color}
                  strokeWidth={l.isTotal ? 3 : 2} strokeLinejoin="round" strokeLinecap="round" />
              ))}
              {/* 끝점 */}
              {lines.map((l) => l.values[n - 1] != null && (
                <circle key={l.key} cx={x(n - 1)} cy={y(l.values[n - 1])} r="4" fill={l.color} stroke="#0f172a" strokeWidth="2" />
              ))}

              {hover != null && (
                <g pointerEvents="none">
                  <line x1={x(hover)} x2={x(hover)} y1={CHART_MARGIN.top} y2={CHART_MARGIN.top + innerH} stroke="#475569" strokeWidth="1" />
                  {hoverRows.map((l) => (
                    <circle key={l.key} cx={x(hover)} cy={y(l.values[hover])} r="4.5" fill={l.color} stroke="#0f172a" strokeWidth="2" />
                  ))}
                </g>
              )}

              <rect x={CHART_MARGIN.left - 8} y={0} width={innerW + 16} height={CHART_HEIGHT} fill="transparent"
                onPointerMove={handleMove} onPointerDown={handleMove} onPointerLeave={() => setHover(null)} style={{ touchAction: 'pan-y' }} />
            </svg>
          )}

          {hover != null && (
            <div
              className="pointer-events-none absolute top-2 z-10 min-w-[12rem] rounded-xl bg-slate-950/95 px-3 py-2.5 text-xs shadow-xl ring-1 ring-slate-700"
              style={tipOnLeft ? { right: width - tipLeft + 12 } : { left: tipLeft + 12 }}
            >
              <p className="mb-1.5 font-semibold text-slate-200">{pointLabel(points[hover], true)}</p>
              <ul className="space-y-1">
                {hoverRows.map((l) => (
                  <li key={l.key} className="flex items-center justify-between gap-4">
                    <span className="flex items-center gap-1.5 text-slate-400">
                      <span className="inline-block h-0.5 w-3 rounded-full" style={{ backgroundColor: l.color, height: l.isTotal ? 3 : 2 }} />
                      <span className={l.isTotal ? 'font-semibold text-slate-200' : ''}>{l.label}</span>
                    </span>
                    <span className={`tabular-nums ${l.isTotal ? 'font-semibold text-slate-100' : 'text-slate-200'}`}>{fmt(l.values[hover])}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    function DailyProfitCard({ ordersKey }) {
      const { data, error, loading, reload } = usePortfolioDaily(ordersKey);
      const [unit, setUnit] = useState('profit'); // 'profit' | 'rate'
      const [hidden, setHidden] = useState({});    // { [key]: true } — 범례로 끈 선
      const [showTable, setShowTable] = useState(false);

      const points = data?.points ?? [];
      const allLines = useMemo(() => {
        if (!data?.series?.length) return [];
        const pick = (v) => (v == null ? null : v[unit]);
        return [
          { key: 'total', label: '합계', color: TOTAL_COLOR, isTotal: true, values: data.total.map(pick) },
          ...data.series.slice(0, SERIES_COLORS.length).map((s, i) => ({
            key: s.coinId, label: s.name, symbol: s.symbol, color: SERIES_COLORS[i], values: s.values.map(pick),
          })),
        ];
      }, [data, unit]);
      const lines = allLines.filter((l) => !hidden[l.key]);

      const last = data?.total?.[data.total.length - 1];
      const t = TREND_STYLES[wonTrendOf(last?.profit)];
      const failed = Object.keys(data?.errors ?? {});
      const extra = (data?.series?.length ?? 0) - SERIES_COLORS.length;
      const fmt = unit === 'rate' ? formatSignedPercent : formatSignedWon;

      return (
        <Card as="section" aria-labelledby="daily-title">
          <SectionTitle
            title={<span id="daily-title">일자별 수익현황</span>}
            meta={points.length ? `${pointLabel(points[0])} ~ 지금 · 매일 오전 9시 시세 기준` : null}
            action={
              <Button variant="ghost" size="xs" className="shrink-0 whitespace-nowrap" onClick={reload} disabled={loading} aria-label="일자별 수익 다시 불러오기">
                {loading ? '불러오는 중…' : '↻ 새로고침'}
              </Button>
            }
          />

          {error && !data && (
            <div className="mt-4 flex flex-wrap items-center justify-between gap-2 rounded-xl bg-rose-500/10 px-4 py-3 text-sm text-rose-300 ring-1 ring-rose-500/30">
              <span>⚠️ {error}</span>
              <Button size="xs" onClick={reload}>다시 시도</Button>
            </div>
          )}

          {!data && loading && <Skeleton className="mt-4 h-[280px] w-full" />}

          {data && !data.series.length && (
            <TablePlaceholder loading={false}>보유한 코인이 생기면 날마다 얼마나 벌었는지 그래프로 보여드려요.</TablePlaceholder>
          )}

          {data && data.series.length > 0 && (
            <>
              <div className="mt-4 flex flex-wrap items-end justify-between gap-3">
                <div>
                  <p className="text-xs text-slate-500">지금 보유 코인 평가손익</p>
                  <p className={`mt-0.5 text-2xl font-bold tabular-nums ${t.text}`}>
                    {formatSignedWon(last?.profit)}
                    <span className="ml-2 text-base font-semibold">{formatSignedPercent(last?.rate)}</span>
                  </p>
                </div>
                <div role="tablist" aria-label="그래프 단위" className="inline-flex rounded-xl bg-slate-800 p-1 text-xs font-semibold">
                  {[{ v: 'profit', l: '평가손익(원)' }, { v: 'rate', l: '수익률(%)' }].map((o) => (
                    <button key={o.v} type="button" role="tab" aria-selected={unit === o.v} onClick={() => setUnit(o.v)}
                      className={`rounded-lg px-3 py-1.5 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ${unit === o.v ? 'bg-slate-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>
                      {o.l}
                    </button>
                  ))}
                </div>
              </div>

              {/* 범례 — 눌러서 선 켜고 끄기 */}
              <ul className="mt-3 flex flex-wrap gap-1.5" aria-label="범례 (눌러서 선 숨기기)">
                {allLines.map((l) => {
                  const off = !!hidden[l.key];
                  return (
                    <li key={l.key}>
                      <button type="button" aria-pressed={!off} onClick={() => setHidden((h) => ({ ...h, [l.key]: !h[l.key] }))}
                        className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs ring-1 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400
                          ${off ? 'text-slate-600 ring-slate-800 line-through' : 'text-slate-300 ring-slate-700 hover:bg-slate-800'}`}>
                        <span className="inline-block w-3.5 rounded-full" style={{ backgroundColor: off ? '#334155' : l.color, height: l.isTotal ? 3 : 2 }} />
                        <span className={l.isTotal ? 'font-semibold' : ''}>{l.label}</span>
                        {l.symbol && <span className="uppercase text-slate-500">{l.symbol}</span>}
                      </button>
                    </li>
                  );
                })}
              </ul>

              {failed.length > 0 && (
                <p role="status" className="mt-3 rounded-lg bg-amber-500/10 px-3 py-2 text-xs text-amber-300 ring-1 ring-amber-500/30">
                  ⚠️ {failed.join(', ')} 시세 기록을 받지 못해 그래프와 합계에서 빠졌어요. 잠시 뒤 새로고침해 주세요.
                </p>
              )}
              {extra > 0 && <p className="mt-2 text-xs text-slate-500">그 외 {extra}개 코인은 합계에만 들어가 있어요.</p>}

              {lines.length > 0
                ? <ProfitChart points={points} lines={lines} unit={unit} />
                : <TablePlaceholder loading={false}>범례에서 볼 항목을 하나 이상 켜 주세요.</TablePlaceholder>}

              <div className="mt-2 flex items-center justify-between gap-3">
                <p className="text-[11px] text-slate-600">CoinGecko 일별 시세(매일 오전 9시 KST)로 그날까지의 주문을 다시 계산했어요 · 마지막 점은 현재가</p>
                <Button variant="ghost" size="xs" className="shrink-0 whitespace-nowrap" onClick={() => setShowTable((v) => !v)} aria-expanded={showTable}>
                  {showTable ? '표 닫기' : '표로 보기'}
                </Button>
              </div>

              {showTable && (
                <div className="relative -mx-5 mt-2 max-h-[22rem] overflow-auto px-5">
                  <table className="w-full min-w-[640px] text-sm">
                    <thead className="sticky top-0 z-10 bg-slate-900">
                      <tr className="border-b border-slate-800 text-left text-xs text-slate-500">
                        <th scope="col" className="py-2 pr-3 font-medium">날짜</th>
                        {allLines.map((l) => (
                          <th key={l.key} scope="col" className="py-2 pl-3 text-right font-medium">{l.isTotal ? '합계' : upper(l.symbol)}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/70 tabular-nums">
                      {[...points].map((p, i) => ({ p, i })).reverse().map(({ p, i }) => (
                        <tr key={p.at}>
                          <th scope="row" className="whitespace-nowrap py-2 pr-3 text-left font-normal text-slate-300">{p.isNow ? '지금' : formatDate(Date.parse(p.at))}</th>
                          {allLines.map((l) => {
                            const v = l.values[i];
                            return (
                              <td key={l.key} className={`whitespace-nowrap py-2 pl-3 text-right ${v == null ? 'text-slate-600' : TREND_STYLES[unit === 'rate' ? trendOf(v) : wonTrendOf(v)].text} ${l.isTotal ? 'font-semibold' : ''}`}>
                                {v == null ? '—' : fmt(v)}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </>
          )}
        </Card>
      );
    }

    function OrderHistory({ orders, loading }) {
      return (
        <Card as="section" aria-labelledby="history-title">
          <SectionTitle title={<span id="history-title">주문내역</span>} meta={loading ? null : `${orders.length}건`} />

          {orders.length === 0 ? (
            <TablePlaceholder loading={loading}>체결된 주문이 아직 없어요.</TablePlaceholder>
          ) : (
            <div className="relative -mx-5 mt-3 max-h-[28rem] overflow-auto px-5">
              <table className="w-full min-w-[940px] text-sm">
                <thead className="sticky top-0 z-10 bg-slate-900">
                  <tr className="border-b border-slate-800 text-left text-xs text-slate-500">
                    <th scope="col" className="py-2 pr-3 font-medium">주문일자</th>
                    <th scope="col" className="py-2 pr-3 font-medium">구분</th>
                    <th scope="col" className="py-2 pr-3 font-medium">코인</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">체결가</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">수량</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">체결금액</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">실현손익</th>
                    <th scope="col" className="py-2 pl-3 text-right font-medium">수익률</th>
                    <th scope="col" className="py-2 pl-5 font-medium">주문메모</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/70 tabular-nums">
                  {orders.map((o) => {
                    const profitClass = o.profit == null ? 'text-slate-600' : TREND_STYLES[wonTrendOf(o.profit)].text;
                    return (
                      <tr key={o.id} className="align-top">
                        <td className="whitespace-nowrap py-2.5 pr-3">
                          <span className="block text-slate-300">{formatDate(o.at)}</span>
                          <span className="block text-xs text-slate-500">{formatTime(new Date(o.at))}</span>
                        </td>
                        <td className="py-2.5 pr-3">
                          <span className={`whitespace-nowrap rounded-md px-2 py-0.5 text-xs font-semibold ${SIDE_STYLES[o.side].badge}`}>{SIDE_STYLES[o.side].label}</span>
                        </td>
                        <td className="whitespace-nowrap py-2.5 pr-3">
                          <span className="font-medium">{o.name}</span>
                          <span className="ml-1.5 text-xs uppercase text-slate-500">{o.symbol}</span>
                        </td>
                        <td className="py-2.5 pl-3 text-right">{formatPrice(o.price)}</td>
                        <td className="py-2.5 pl-3 text-right">{formatQty(o.qty)}</td>
                        <td className="py-2.5 pl-3 text-right font-semibold">{formatWon(o.amount)}</td>
                        <td className={`py-2.5 pl-3 text-right ${profitClass}`}>{o.profit == null ? '—' : formatSignedWon(o.profit)}</td>
                        <td className={`py-2.5 pl-3 text-right ${profitClass}`}>{o.profitRate == null ? '—' : formatSignedPercent(o.profitRate)}</td>
                        <td className="max-w-[16rem] break-words py-2.5 pl-5 text-slate-300">
                          {o.memo ? o.memo : <span className="text-slate-600">—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      );
    }

    const VERDICT_STYLES = {
      go:      { buy: 'bg-emerald-500/15 text-emerald-300', sell: 'bg-rose-500/15 text-rose-300', ring: 'ring-emerald-500/30' },
      skip:    { buy: 'bg-slate-500/15 text-slate-300',     sell: 'bg-slate-500/15 text-slate-300', ring: 'ring-slate-800' },
      unknown: { buy: 'bg-amber-500/15 text-amber-300',     sell: 'bg-amber-500/15 text-amber-300', ring: 'ring-amber-500/30' },
    };

    const CHECK_ICONS = {
      true:  { icon: '✓', className: 'text-emerald-400', label: '통과' },
      false: { icon: '✕', className: 'text-rose-400', label: '탈락' },
      null:  { icon: '?', className: 'text-amber-400', label: '확인 불가' },
    };

    function CheckList({ checks }) {
      return (
        <ul className="space-y-2 text-xs leading-relaxed">
          {checks.map((c) => {
            const s = CHECK_ICONS[String(c.ok)];
            return (
              <li key={c.label} className="flex gap-2">
                <span aria-hidden="true" className={`w-3 shrink-0 text-center font-bold ${s.className}`}>{s.icon}</span>
                <span className="min-w-0">
                  <span className="font-semibold text-slate-200">{c.label}</span>
                  <span className="sr-only"> {s.label}</span>
                  <span className="block break-words text-slate-400">{c.text}</span>
                </span>
              </li>
            );
          })}
        </ul>
      );
    }

    function EventBanner({ data }) {
      const blocked = data.blocks.length > 0;
      return (
        <div className={`rounded-xl p-4 ring-1 ${blocked ? 'bg-rose-500/10 ring-rose-500/30' : 'bg-emerald-500/10 ring-emerald-500/20'}`}>
          <p className={`font-semibold ${blocked ? 'text-rose-300' : 'text-emerald-300'}`}>
            {blocked
              ? `⛔ 오늘(${shortDate(data.todayKst)})은 매수 금지 — ${data.blocks.map((b) => `${b.name} ${b.reason}`).join(', ')}`
              : `✅ 오늘(${shortDate(data.todayKst)})은 금지 이벤트의 전날·당일이 아니에요`}
          </p>
          {data.windows.length > 0 && (
            <ul className="mt-2 space-y-1 text-xs text-slate-400">
              {data.windows.map((w) => (
                <li key={w.name} className="flex flex-wrap gap-x-2">
                  <span className="text-slate-300">{w.name}</span>
                  <span className="tabular-nums">{w.when} (KST)</span>
                  <span className="text-slate-500">
                    → {w.unconfirmed ? `${shortDate(w.unconfirmedUntil)}까지 매수 금지` : `${w.blockedDays.map(shortDate).join(', ')} 매수 금지`}
                  </span>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    function BuyVerdictCard({ rec, onTrade }) {
      const { rule, coin, weekly, verdict, amount } = rec;
      const style = VERDICT_STYLES[verdict];
      const label = verdict === 'go' ? `매수 ${formatWon(amount)}` : verdict === 'unknown' ? '판단 불가' : '매수 안 함';
      const change = weekly?.changePct;

      return (
        <li className={`flex flex-col rounded-xl bg-slate-950/60 p-4 ring-1 ${style.ring}`}>
          <div className="flex items-center justify-between gap-2">
            <div className="flex min-w-0 items-center gap-2.5">
              {coin ? <CoinAvatar src={coin.image} size="h-8 w-8" /> : <span className="h-8 w-8 shrink-0 rounded-full bg-slate-800" aria-hidden="true" />}
              <div className="min-w-0">
                <p className="truncate font-semibold">{coin?.name ?? rule.name}</p>
                <p className="text-xs text-slate-500 tabular-nums">{rule.symbol} · {coin ? formatPrice(coin.current_price) : '시세 없음'}</p>
              </div>
            </div>
            <span className={`shrink-0 rounded-full px-2 py-0.5 text-xs font-semibold ${style.buy}`}>{label}</span>
          </div>

          <div className="mt-3 rounded-lg bg-slate-900 px-3 py-2">
            <p className="text-[11px] text-slate-500">주간 등락률 (업비트 09:00 시가)</p>
            <p className={`text-xl font-bold tabular-nums ${change == null ? 'text-slate-500' : change <= STRATEGY.weeklyDropPct ? 'text-rose-400' : 'text-slate-200'}`}>
              {change == null ? '—' : fmtPct(change)}
              <span className="ml-1.5 text-xs font-medium text-slate-500">기준 {STRATEGY.weeklyDropPct}% 이하</span>
            </p>
          </div>

          <div className="mt-3 flex-1"><CheckList checks={rec.checks} /></div>

          {verdict === 'go' && (
            <Button
              variant="buySoft"
              size="sm"
              className="mt-4 w-full"
              onClick={() => onTrade(coin.id, 'buy', {
                input: String(amount),
                memo: strategyMemo(`매수 · 주간 ${fmtPct(change)} · 금지 이벤트 없음 · ${formatWon(amount)}`),
              })}
            >
              {coin.name} {formatWon(amount)} 매수하기
            </Button>
          )}
        </li>
      );
    }

    function SellVerdictRow({ rec, onTrade }) {
      const { holding, coin, verdict } = rec;
      const style = VERDICT_STYLES[verdict];
      return (
        <li className={`rounded-xl bg-slate-950/60 p-4 ring-1 ${verdict === 'go' ? 'ring-rose-500/30' : style.ring}`}>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex min-w-0 items-center gap-2.5">
              <CoinAvatar src={holding.image} size="h-8 w-8" />
              <div className="min-w-0">
                <p className="truncate font-semibold">{holding.name}</p>
                <p className="text-xs text-slate-500 tabular-nums">{upper(holding.symbol)} · 평균 {formatPrice(rec.avgPrice)}</p>
              </div>
            </div>
            <span className={`rounded-full px-2 py-0.5 text-xs font-semibold ${style.sell}`}>{rec.action}</span>
          </div>

          <dl className="mt-3 grid grid-cols-3 gap-3 border-y border-slate-800 py-2.5 text-xs">
            <div>
              <dt className="text-slate-500">보유 수량</dt>
              <dd className="mt-0.5 truncate font-semibold tabular-nums">{formatQty(holding.qty)}</dd>
            </div>
            <div>
              <dt className="text-slate-500">현재가</dt>
              <dd className="mt-0.5 truncate font-semibold tabular-nums">{rec.price != null ? formatPrice(rec.price) : '—'}</dd>
            </div>
            <div>
              <dt className="text-slate-500">수익률</dt>
              <dd className={`mt-0.5 truncate font-semibold tabular-nums ${rec.rate != null ? TREND_STYLES[trendOf(rec.rate)].text : 'text-slate-500'}`}>
                {rec.rate != null ? formatSignedPercent(rec.rate) : '—'}
              </dd>
            </div>
          </dl>

          <div className="mt-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <p className="text-xs text-slate-400">{rec.rule && <span className="font-semibold text-slate-200">{rec.rule} · </span>}{rec.text}</p>
            {verdict === 'go' && (
              <Button
                variant="sellSoft"
                size="sm"
                className="shrink-0"
                onClick={() => onTrade(coin.id, 'sell', {
                  input: qtyToInput(rec.qty),
                  memo: strategyMemo(`${rec.action} · ${rec.rule} · 수익률 ${fmtPct(rec.rate)}`),
                })}
              >
                {formatQty(rec.qty)} {upper(holding.symbol)} 매도하기
              </Button>
            )}
          </div>
        </li>
      );
    }

    function RecommendationModal({ data, onClose, onTrade }) {
      if (!data) return null;

      if (data.loading) {
        return (
          <Modal isOpen onClose={onClose} title="📋 내 전략 추천" description="업비트 일봉과 지갑을 확인하는 중이에요" size="md">
            <div className="flex items-center justify-center gap-2 py-12 text-sm text-slate-400" aria-busy="true">
              <span className="h-4 w-4 animate-spin rounded-full border-2 border-sky-400 border-r-transparent" aria-hidden="true" />
              규칙 대입 중…
            </div>
          </Modal>
        );
      }

      const goBuys = data.buys.filter((b) => b.verdict === 'go');

      return (
        <Modal
          isOpen
          onClose={onClose}
          title="📋 내 전략 추천"
          description={`판단일 ${data.todayKst} (KST) · ${formatTime(data.at)} 기준 · research/my-strategy.md 규칙을 그대로 대입했어요`}
        >
          <EventBanner data={data} />

          <section aria-labelledby="rec-buy-title" className="mt-6">
            <h3 id="rec-buy-title" className="flex flex-wrap items-center gap-2 font-semibold">
              <span className="rounded-md bg-emerald-500/15 px-2 py-0.5 text-xs text-emerald-300">매수</span>
              {goBuys.length ? `오늘 살 코인 ${goBuys.length}개` : '오늘은 매수하지 않아요'}
              <span className="text-xs font-normal text-slate-500">원칙 1·2 · 상한 · 금지 조건</span>
            </h3>
            <ol className="mt-3 grid gap-3 md:grid-cols-3">
              {data.buys.map((rec) => <BuyVerdictCard key={rec.rule.id} rec={rec} onTrade={onTrade} />)}
            </ol>
            {goBuys.length > 1 && (
              <p className="mt-2 text-xs text-slate-500">
                여러 코인을 사면 앞 주문만큼 현금이 줄어요. 다음 코인은 추천을 다시 받아 금액을 확인하세요.
              </p>
            )}
          </section>

          <section aria-labelledby="rec-sell-title" className="mt-6">
            <h3 id="rec-sell-title" className="flex flex-wrap items-center gap-2 font-semibold">
              <span className="rounded-md bg-rose-500/15 px-2 py-0.5 text-xs text-rose-300">매도</span>
              보유 코인 점검
              <span className="text-xs font-normal text-slate-500">원칙 3 · 금지 조건과 무관</span>
            </h3>
            {data.sells == null ? (
              <p className="mt-3 rounded-xl bg-slate-950/50 py-6 text-center text-sm text-slate-500">지갑을 불러오지 못해 매도 조건을 확인할 수 없어요.</p>
            ) : data.sells.length === 0 ? (
              <p className="mt-3 rounded-xl bg-slate-950/50 py-6 text-center text-sm text-slate-500">보유한 코인이 없어 매도할 것이 없어요.</p>
            ) : (
              <ul className="mt-3 space-y-3">
                {data.sells.map((rec) => <SellVerdictRow key={rec.holding.coinId} rec={rec} onTrade={onTrade} />)}
              </ul>
            )}
          </section>

          <p className="mt-6 rounded-lg bg-slate-950/50 px-3 py-2 text-[11px] leading-relaxed text-slate-500">
            매수: 주간 등락률 −3% 이하 · 금지 이벤트 전날·당일 제외 · 1회 30만 원 · 코인당 원가 40만 원 · 코인별 하루 1회.
            매도: −10% 전량 손절 · +20% 50% 익절(포지션당 1회) · 익절 후 0% 이하면 전량.
            금지 이벤트 일정은 코드의 BLOCKING_EVENTS 를 매주 갱신해야 해요. 모의투자용 규칙이며 수익을 보장하지 않아요.
          </p>
        </Modal>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <Card ringClass="ring-rose-500/30" className="py-12 text-center" role="alert">
          <p className="text-3xl" aria-hidden="true">⚠️</p>
          <h2 className="mt-3 font-semibold">시세를 불러오지 못했어요</h2>
          <p className="mt-1 text-sm text-slate-400">{message}</p>
          <Button variant="primary" className="mt-5" onClick={onRetry}>다시 시도</Button>
        </Card>
      );
    }

    function EmptyState() {
      return (
        <Card className="py-12 text-center">
          <p className="text-3xl" aria-hidden="true">🪙</p>
          <p className="mt-3 text-sm text-slate-400">표시할 코인 데이터가 없어요.</p>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function useToast() {
      const [toast, setToast] = useState(null);
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(timer);
      }, [toast]);
      const show = useCallback((message, tone) => setToast({ id: Date.now(), message, tone }), []);
      return [toast, show];
    }

    const EMPTY_HOLDINGS = {};
    const EMPTY_ORDERS = [];

    function App() {
      const { coins, error, refreshing, lastUpdated, secondsLeft, ticks, refresh } = useCoinMarkets();
      const { wallet, loadError, reload, placeOrder, resetWallet } = useWallet();
      const [toast, showToast] = useToast();
      const [selectedId, setSelectedId] = useState(null);
      const [side, setSide] = useState('buy');
      const [resetting, setResetting] = useState(false);
      const [recommendation, setRecommendation] = useState(null);
      const [orderPreset, setOrderPreset] = useState(null);
      const orderPanelRef = useRef(null);

      const coinList = coins ?? [];
      const selectedCoin = coinList.find((c) => c.id === selectedId) ?? coinList[0];
      const holdings = wallet?.holdings ?? EMPTY_HOLDINGS;
      const walletLoading = !wallet && !loadError;

      const prices = useMemo(
        () => Object.fromEntries(coinList.map((c) => [c.id, c.current_price])),
        [coins]
      );

      // 시세 목록에서 빠진 코인은 마지막 체결가로 평가한다
      const holdingRows = useMemo(() => (
        Object.values(holdings)
          .map((h) => {
            const live = prices[h.coinId] != null;
            const price = live ? prices[h.coinId] : h.lastPrice;
            const value = h.qty * price;
            return { ...h, live, price, value, avgPrice: h.cost / h.qty, profit: value - h.cost, rate: ((value - h.cost) / h.cost) * 100 };
          })
          .sort((a, b) => b.value - a.value)
      ), [holdings, prices]);

      const coinValue = holdingRows.reduce((sum, r) => sum + r.value, 0);

      // 좁은 화면에서는 주문창이 카드 위쪽에 있으므로 보이도록 스크롤
      const scrollToOrderPanel = () => {
        const panel = orderPanelRef.current;
        if (!panel) return;
        const rect = panel.getBoundingClientRect();
        if (rect.top < 0 || rect.top > window.innerHeight * 0.6) {
          const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          panel.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        }
      };

      const startTrade = (coinId, nextSide) => {
        setSelectedId(coinId);
        setSide(nextSide);
        scrollToOrderPanel();
      };

      // 버튼을 누른 순간의 시세·지갑으로 규칙을 대입해 고정한다. 계산 중에 닫으면 결과를 버린다.
      const recommendationRequestRef = useRef(0);
      const openRecommendations = async () => {
        if (!coinList.length) return;
        const requestId = ++recommendationRequestRef.current;
        setRecommendation({ loading: true });
        const result = await buildStrategyRecommendations(coinList, wallet);
        if (recommendationRequestRef.current === requestId) setRecommendation(result);
      };

      const closeRecommendations = () => {
        recommendationRequestRef.current += 1;
        setRecommendation(null);
      };

      // 코인·주문 종류·금액을 한 번에 바꿔야 주문창이 입력을 지우고 다시 채우는 순서가 꼬이지 않는다
      const tradeFromRecommendation = (coinId, nextSide, preset) => {
        closeRecommendations();
        setSelectedId(coinId);
        setSide(nextSide);
        setOrderPreset({ ...preset, key: Date.now() });
        // 모달이 닫혀 스크롤 잠금이 풀린 다음 주문창으로 이동
        requestAnimationFrame(scrollToOrderPanel);
      };

      // 실패하면 throw 해서 주문창이 오류 메시지를 보여주게 한다
      const handleOrder = async ({ side: orderSide, coin, price, amount, qty, memo }) => {
        const order = await placeOrder({
          side: orderSide,
          coin: { id: coin.id, symbol: coin.symbol, name: coin.name, image: coin.image },
          price,
          ...(orderSide === 'buy' ? { amount } : { quantity: qty }),
          memo,
        });
        showToast(
          `${order.name} ${formatQty(order.qty)} ${upper(order.symbol)} ${SIDE_STYLES[orderSide].label} 체결 · ${formatWon(order.amount)}`,
          orderSide
        );
      };

      const handleReset = async () => {
        if (!window.confirm(`지갑을 초기화할까요?\n현금 ${formatWon(INITIAL_CASH)}으로 돌아가고 데이터베이스의 주문내역이 모두 삭제돼요.`)) return;
        setResetting(true);
        try {
          await resetWallet();
          showToast('지갑을 초기화했어요.');
        } catch (err) {
          showToast(`초기화하지 못했어요. ${err.message}`);
        } finally {
          setResetting(false);
        }
      };

      return (
        <div className="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
          <header className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p className="flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.2em] text-sky-400">
                <span className="relative flex h-2 w-2" aria-hidden="true">
                  <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-400 opacity-60 motion-reduce:animate-none" />
                  <span className="relative inline-flex h-2 w-2 rounded-full bg-sky-400" />
                </span>
                Paper Trading
              </p>
              <h1 className="mt-1 text-2xl font-bold sm:text-3xl">코인 모의투자</h1>
              <p className="mt-1 text-sm text-slate-400">
                가상지갑 {formatWon(INITIAL_CASH)}으로 CoinGecko 시가총액 상위 {COIN_COUNT}개를 사고팔아 보세요 · {REFRESH_SECONDS}초마다 시세 갱신
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {/* 지갑이 오기 전에 누르면 상한·하루 1회를 확인할 수 없어 "판단 불가"가 되므로 기다린다 */}
              <Button variant="primary" onClick={openRecommendations} disabled={!coinList.length || walletLoading} aria-haspopup="dialog">
                <span aria-hidden="true">📋</span> {walletLoading ? '지갑 불러오는 중…' : '내 전략 추천'}
              </Button>
              <Button onClick={refresh} disabled={refreshing} aria-label={`지금 새로고침 (${secondsLeft}초 후 자동 갱신)`}>
                <span className="text-sky-400"><CountdownRing secondsLeft={secondsLeft} total={REFRESH_SECONDS} /></span>
                <span className="w-[4.5ch] text-left tabular-nums">{refreshing ? '갱신중' : `${secondsLeft}초`}</span>
              </Button>
            </div>
          </header>

          <main className="mt-6 space-y-5">
            {coins && error && (
              <div role="status" className="rounded-xl bg-amber-500/10 px-4 py-3 text-sm text-amber-300 ring-1 ring-amber-500/30">
                ⚠️ {error} 마지막으로 받은 시세를 표시하고, 주문도 그 가격으로 체결돼요.
              </div>
            )}

            {coinList.length > 0 && <MarketSummary coins={coinList} lastUpdated={lastUpdated} />}

            <div className="grid gap-5 xl:grid-cols-[minmax(0,1fr)_380px]">
              {/* 좁은 화면: 지갑·주문창이 먼저 / 넓은 화면: 오른쪽에 고정 */}
              <aside className="sticky-aside space-y-5 xl:col-start-2 xl:row-start-1 xl:self-start">
                <WalletCard
                  wallet={wallet}
                  coinValue={coinValue}
                  loadError={loadError}
                  onRetry={reload}
                  onReset={handleReset}
                  resetting={resetting}
                />
                <div ref={orderPanelRef} className="scroll-mt-4">
                  {selectedCoin ? (
                    <OrderPanel
                      coins={coinList}
                      coin={selectedCoin}
                      side={side}
                      onSelectCoin={setSelectedId}
                      onSideChange={setSide}
                      walletReady={Boolean(wallet)}
                      cash={wallet?.cash ?? 0}
                      holding={holdings[selectedCoin.id]}
                      tick={ticks.byId[selectedCoin.id]}
                      tickVersion={ticks.version}
                      orderPreset={orderPreset}
                      onOrder={handleOrder}
                    />
                  ) : (
                    <OrderPanelPlaceholder error={error} />
                  )}
                </div>
              </aside>

              <section aria-label="코인 시세" className="min-w-0 xl:col-start-1 xl:row-start-1">
                {!coins && error && <ErrorState message={error} onRetry={refresh} />}

                {!coins && !error && (
                  <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3" aria-busy="true" aria-label="시세 불러오는 중">
                    {Array.from({ length: 6 }, (_, i) => <CoinCardSkeleton key={i} />)}
                  </div>
                )}

                {coins && coins.length === 0 && <EmptyState />}

                {coinList.length > 0 && (
                  <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                    {coinList.map((coin) => (
                      <CoinCard
                        key={coin.id}
                        coin={coin}
                        tick={ticks.byId[coin.id]}
                        tickVersion={ticks.version}
                        selected={coin.id === selectedCoin?.id}
                        holdingQty={holdings[coin.id]?.qty}
                        onTrade={(nextSide) => startTrade(coin.id, nextSide)}
                      />
                    ))}
                  </div>
                )}
              </section>
            </div>

            <HoldingsCard rows={holdingRows} loading={walletLoading} onSell={(coinId) => startTrade(coinId, 'sell')} />
            {/* 주문이 체결·초기화될 때마다(최신 주문 ID·건수가 바뀌면) 다시 계산 */}
            <DailyProfitCard ordersKey={wallet ? `${wallet.orders.length}:${wallet.orders[0]?.id ?? 0}` : null} />
            <OrderHistory orders={wallet?.orders ?? EMPTY_ORDERS} loading={walletLoading} />
          </main>

          <footer className="mt-10 text-center text-xs text-slate-600">
            데이터 제공: CoinGecko · 가상 자금으로 하는 모의투자이며 실제 거래가 아닙니다 · 무료 API는 1~2분 단위로 캐시되어 30초마다 값이 바뀌지 않을 수 있습니다
          </footer>

          <RecommendationModal
            data={recommendation}
            onClose={closeRecommendations}
            onTrade={tradeFromRecommendation}
          />
          <Toast toast={toast} />
        </div>
      );
    }

    // ========================================
    // 🖥️ Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
