<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월급 비교소</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💰</text></svg>">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-pop { animation: pop-in .2s ease-out both; }
    /* 숫자 입력 스피너 숨김 — 금액은 직접 타이핑하는 게 빠르다 */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

    // ========================================
    // 🔧 Config & helpers
    // ========================================
    const API_BASE_URL = '/api';
    const MAN = 10000; // 만원
    const MONEY_MAX_MAN = 10000; // 항목당 1억 원 (server.js MONEY_MAX 와 같게)
    const YEARS_MAX = 40;
    const LAST_REPORT_KEY = 'salary-compare:last-report-id';
    const SMALL_SAMPLE = 10; // 응답이 이보다 적으면 "참고용" 안내

    // server.js 의 JOB_GROUPS 와 같은 목록이어야 한다
    const JOB_GROUPS = [
      '개발', '데이터·AI', '디자인', '기획·PM', '마케팅', '영업',
      '경영지원', '금융', '생산·제조', '의료·보건', '교육', '공공·공무원', '서비스', '기타',
    ];

    const SPEND_ITEMS = [
      { key: 'food', label: '식비', hint: '장보기·외식·배달·커피' },
      { key: 'housing', label: '주거', hint: '월세·관리비·대출이자' },
      { key: 'transport', label: '교통', hint: '대중교통·유류비·주차' },
      { key: 'culture', label: '문화생활', hint: '여가·구독·취미·여행' },
    ];

    // 결과 화면에서 보여줄 지표. higher = "상위" 가 무엇을 뜻하는지
    const METRICS = [
      { key: 'salary', label: '월급', higher: '많이 받는 순' },
      { key: 'totalSpend', label: '월 지출 합계', higher: '많이 쓰는 순' },
      { key: 'savings', label: '남는 돈', higher: '많이 남는 순' },
      ...SPEND_ITEMS.map((i) => ({ key: i.key, label: i.label, higher: '많이 쓰는 순' })),
    ];

    async function api(endpoint, options = {}) {
      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
        ...options,
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.success) {
        throw new Error(body.message || `요청에 실패했어요. (HTTP ${res.status})`);
      }
      return body.data;
    }

    function useFetch(endpoint) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [nonce, setNonce] = useState(0);

      useEffect(() => {
        let ignore = false; // 라우트가 바뀌어 늦게 온 응답은 버린다
        setLoading(true);
        setError(null);
        api(endpoint)
          .then((d) => { if (!ignore) setData(d); })
          .catch((e) => { if (!ignore) setError(e); })
          .finally(() => { if (!ignore) setLoading(false); });
        return () => { ignore = true; };
      }, [endpoint, nonce]);

      const reload = useCallback(() => setNonce((n) => n + 1), []);
      return { data, loading, error, reload };
    }

    const readLastReportId = () => {
      try { return localStorage.getItem(LAST_REPORT_KEY); } catch { return null; }
    };
    const saveLastReportId = (id) => {
      try { localStorage.setItem(LAST_REPORT_KEY, id); } catch {}
    };

    const fmtNum = (v, digits = 1) => v.toLocaleString('ko-KR', { maximumFractionDigits: digits });

    // 3250000 → "325만원", 8000 → "8,000원"
    function formatWon(won, { sign = false } = {}) {
      const abs = Math.abs(won);
      const body = abs >= MAN ? `${fmtNum(abs / MAN)}만원` : `${fmtNum(abs, 0)}원`;
      const prefix = won < 0 ? '−' : sign && won > 0 ? '+' : '';
      return prefix + body;
    }

    function bucketLabel({ min, max }) {
      if (max === null) return `${min / MAN}만원 이상`;
      if (min === 0) return `${max / MAN}만원 미만`;
      return `${min / MAN}~${max / MAN}만원`;
    }

    function bucketShortLabel({ min, max }) {
      if (max === null) return `${min / MAN}+`;
      if (min === 0) return `~${max / MAN}`;
      return `${min / MAN}`;
    }

    const findBucket = (buckets, value) =>
      buckets.findIndex((b) => value >= b.min && (b.max === null || value < b.max));

    const yearsLabel = (y) => (y === 0 ? '1년 미만' : `${y}년`);

    // 화면의 만원 문자열 → 원 정수. 비었거나 숫자가 아니면 NaN
    function manToWon(text) {
      const cleaned = String(text).replace(/,/g, '').trim();
      if (cleaned === '') return NaN;
      const n = Number(cleaned);
      return Number.isFinite(n) ? Math.round(n * MAN) : NaN;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, type = 'button', onClick, className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus-visible:ring-indigo-500',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus-visible:ring-slate-400',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 focus-visible:ring-rose-500',
        ghost: 'text-slate-600 hover:bg-slate-100 focus-visible:ring-slate-400',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-5 py-3 text-base' };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`inline-flex items-center justify-center gap-2 rounded-lg font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ id, type = 'text', label, hint, value, onChange, placeholder, error, disabled = false, suffix, className = '', ...rest }) {
      return (
        <div className={className}>
          {label && (
            <label htmlFor={id} className="mb-1 flex items-baseline justify-between gap-2 text-sm font-medium text-slate-700">
              <span>{label}</span>
              {hint && <span className="text-xs font-normal text-slate-400">{hint}</span>}
            </label>
          )}
          <div className="relative">
            <input
              id={id}
              type={type}
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              disabled={disabled}
              aria-invalid={!!error}
              aria-describedby={error ? `${id}-error` : undefined}
              className={`w-full rounded-lg border bg-white px-3 py-2.5 text-right text-base tabular-nums shadow-sm transition placeholder:text-slate-300 focus:outline-none focus:ring-2 disabled:bg-slate-100 ${suffix ? 'pr-14' : ''} ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-indigo-500 focus:ring-indigo-100'}`}
              {...rest}
            />
            {suffix && <span className="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm text-slate-400">{suffix}</span>}
          </div>
          {error && <p id={`${id}-error`} className="mt-1 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Select({ id, label, value, onChange, options, placeholder, error, disabled = false, className = '' }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="mb-1 block text-sm font-medium text-slate-700">{label}</label>}
          <select
            id={id}
            value={value}
            onChange={onChange}
            disabled={disabled}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-lg border bg-white px-3 py-2.5 text-base shadow-sm focus:outline-none focus:ring-2 ${value === '' ? 'text-slate-400' : 'text-slate-900'} ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-indigo-500 focus:ring-indigo-100'}`}
          >
            {placeholder && <option value="" disabled>{placeholder}</option>}
            {options.map((o) => <option key={o.value} value={o.value} className="text-slate-900">{o.label}</option>)}
          </select>
          {error && <p id={`${id}-error`} className="mt-1 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Card({ as: Tag = 'section', className = '', children, ...rest }) {
      return (
        <Tag className={`rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6 ${className}`} {...rest}>
          {children}
        </Tag>
      );
    }

    function CardTitle({ title, desc, right }) {
      return (
        <div className="mb-4 flex flex-wrap items-start justify-between gap-2">
          <div>
            <h2 className="text-lg font-bold text-slate-900">{title}</h2>
            {desc && <p className="mt-0.5 text-sm text-slate-500">{desc}</p>}
          </div>
          {right}
        </div>
      );
    }

    function Badge({ tone = 'slate', className = '', children }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-600',
        indigo: 'bg-indigo-50 text-indigo-700',
        amber: 'bg-amber-50 text-amber-700',
      };
      return <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ${tones[tone]} ${className}`}>{children}</span>;
    }

    function Spinner({ className = '' }) {
      return <span className={`inline-block h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent ${className}`} aria-hidden="true" />;
    }

    function Alert({ children, className = '' }) {
      return (
        <div role="alert" className={`rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700 ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext({ path: '/', params: {}, navigate: () => {} });

    const getHashPath = () => window.location.hash.replace(/^#/, '') || '/';

    // '/result/:id' 와 '/result/abc' → { id: 'abc' }, 안 맞으면 null
    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('?')[0].split('/').filter(Boolean);
      if (pattern === '*') return {};
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getHashPath);
      useEffect(() => {
        const onChange = () => { setPath(getHashPath()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, params: {}, navigate }}>{children}</RouterContext.Provider>;
    }

    function Routes({ children }) {
      const router = useContext(RouterContext);
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) {
          return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
        }
      }
      return null;
    }

    function Route() { return null; } // Routes 가 path·element props 만 읽는다

    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header() {
      const { path } = useRouter();
      const lastId = readLastReportId();
      const items = [
        { to: '/', label: '입력하기', active: path === '/' },
        { to: '/stats', label: '전체 통계', active: path === '/stats' },
        ...(lastId ? [{ to: `/result/${lastId}`, label: '내 결과', active: path.startsWith('/result/') }] : []),
      ];
      return (
        <header className="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
          <div className="mx-auto flex max-w-5xl items-center justify-between gap-2 px-4 py-3">
            <Link to="/" className="flex shrink-0 items-center gap-1.5 whitespace-nowrap font-extrabold tracking-tight text-slate-900 sm:gap-2">
              <span aria-hidden="true" className="text-xl">💰</span>
              <span>월급 비교소</span>
            </Link>
            <nav aria-label="주요 메뉴" className="flex gap-0.5 sm:gap-1">
              {items.map((item) => (
                <Link
                  key={item.to}
                  to={item.to}
                  aria-current={item.active ? 'page' : undefined}
                  className={`whitespace-nowrap rounded-lg px-2 py-1.5 text-sm font-medium transition sm:px-3 ${item.active ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:bg-slate-100'}`}
                >
                  {item.label}
                </Link>
              ))}
            </nav>
          </div>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="mx-auto max-w-5xl px-4 pb-10 pt-6 text-center text-xs text-slate-400">
          응답은 이름·연락처 없이 익명으로 저장되며, 통계는 지금까지 모인 응답만으로 계산해요.
        </footer>
      );
    }

    function PageLoader({ label = '불러오는 중…' }) {
      return (
        <div className="flex flex-col items-center justify-center gap-3 py-24 text-slate-500" role="status">
          <Spinner className="h-6 w-6 text-indigo-600" />
          <span className="text-sm">{label}</span>
        </div>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <Card className="mx-auto max-w-md text-center">
          <p className="text-3xl" aria-hidden="true">😵</p>
          <p className="mt-2 font-semibold text-slate-800">데이터를 불러오지 못했어요</p>
          <p className="mt-1 text-sm text-slate-500">{message}</p>
          <div className="mt-4 flex justify-center gap-2">
            {onRetry && <Button onClick={onRetry}>다시 시도</Button>}
            <Link to="/" className="inline-flex items-center rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">처음으로</Link>
          </div>
        </Card>
      );
    }

    function EmptyStats() {
      return (
        <Card className="mx-auto max-w-md text-center">
          <p className="text-3xl" aria-hidden="true">🌱</p>
          <p className="mt-2 font-semibold text-slate-800">아직 모인 응답이 없어요</p>
          <p className="mt-1 text-sm text-slate-500">첫 번째로 입력하고 통계를 열어 주세요.</p>
          <Link to="/" className="mt-4 inline-flex rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">입력하러 가기</Link>
        </Card>
      );
    }

    function StatTile({ label, value, sub }) {
      return (
        <div className="rounded-xl bg-slate-50 px-4 py-3">
          <p className="text-xs font-medium text-slate-500">{label}</p>
          <p className="mt-1 text-xl font-bold tabular-nums text-slate-900">{value}</p>
          {sub && <p className="mt-0.5 text-xs text-slate-500">{sub}</p>}
        </div>
      );
    }

    // ========================================
    // 📊 Chart Components (프레젠테이셔널)
    // ========================================

    // 세로 막대 히스토그램. highlightIndex 구간(내 구간)만 진한 색 + "나" 라벨
    function Histogram({ title, buckets, highlightIndex = -1, unitNote }) {
      const [hover, setHover] = useState(-1);
      const total = buckets.reduce((s, b) => s + b.count, 0);
      const maxCount = Math.max(1, ...buckets.map((b) => b.count));

      return (
        <figure>
          <figcaption className="mb-3 flex items-baseline justify-between gap-2">
            <span className="font-semibold text-slate-800">{title}</span>
            <span className="text-xs text-slate-400">{unitNote} · 총 {total}명</span>
          </figcaption>

          <div className="relative flex h-44 items-end gap-0.5 border-b border-slate-200 pt-6" role="list">
            {buckets.map((b, i) => {
              const mine = i === highlightIndex;
              const pct = total ? (b.count / total) * 100 : 0;
              const h = b.count ? Math.max(3, (b.count / maxCount) * 100) : 0;
              return (
                <div
                  key={i}
                  role="listitem"
                  tabIndex={0}
                  aria-label={`${bucketLabel(b)}: ${b.count}명 (${fmtNum(pct)}%)${mine ? ', 내 구간' : ''}`}
                  onMouseEnter={() => setHover(i)}
                  onMouseLeave={() => setHover(-1)}
                  onFocus={() => setHover(i)}
                  onBlur={() => setHover(-1)}
                  className="group relative flex h-full flex-1 cursor-default items-end focus:outline-none"
                >
                  {hover === i && (
                    <div className="pointer-events-none absolute bottom-full left-1/2 z-10 mb-1 -translate-x-1/2 whitespace-nowrap rounded-md bg-slate-900 px-2 py-1 text-xs text-white shadow-lg">
                      <div className="font-semibold">{bucketLabel(b)}</div>
                      <div className="tabular-nums text-slate-300">{b.count}명 · {fmtNum(pct)}%</div>
                    </div>
                  )}
                  <div
                    className={`relative w-full rounded-t transition-colors group-focus-visible:ring-2 group-focus-visible:ring-indigo-400 ${mine ? 'bg-indigo-600' : hover === i ? 'bg-indigo-300' : 'bg-indigo-200'}`}
                    style={{ height: `${h}%` }}
                  >
                    {mine && hover !== i && (
                      <span className="absolute bottom-full left-1/2 mb-1 -translate-x-1/2 whitespace-nowrap rounded bg-indigo-600 px-1.5 py-0.5 text-[10px] font-bold text-white">나</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-1 flex gap-0.5" aria-hidden="true">
            {buckets.map((b, i) => (
              <span key={i} className={`flex-1 truncate text-center text-[10px] tabular-nums text-slate-500 ${i % 2 ? 'invisible sm:visible' : ''}`}>
                {bucketShortLabel(b)}
              </span>
            ))}
          </div>

          <details className="mt-3 text-sm">
            <summary className="cursor-pointer text-xs text-slate-500 hover:text-slate-700">표로 보기</summary>
            <table className="mt-2 w-full text-left text-xs">
              <thead className="text-slate-500"><tr><th className="py-1 font-medium">구간</th><th className="py-1 text-right font-medium">인원</th><th className="py-1 text-right font-medium">비율</th></tr></thead>
              <tbody className="tabular-nums text-slate-700">
                {buckets.map((b, i) => (
                  <tr key={i} className={`border-t border-slate-100 ${i === highlightIndex ? 'font-semibold text-indigo-700' : ''}`}>
                    <td className="py-1">{bucketLabel(b)}{i === highlightIndex && ' (나)'}</td>
                    <td className="py-1 text-right">{b.count}명</td>
                    <td className="py-1 text-right">{total ? fmtNum((b.count / total) * 100) : 0}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </details>
        </figure>
      );
    }

    // 직군별 평균 월급 가로 막대. highlight 직군만 진한 색
    function JobGroupBars({ rows, highlight }) {
      const max = Math.max(1, ...rows.map((r) => r.avgSalary));
      return (
        <figure>
          <figcaption className="mb-3 flex items-baseline justify-between gap-2">
            <span className="font-semibold text-slate-800">직군별 평균 월급</span>
            <span className="text-xs text-slate-400">평균 월급 높은 순</span>
          </figcaption>
          <ul className="space-y-2">
            {rows.map((r) => {
              const mine = r.jobGroup === highlight;
              return (
                <li key={r.jobGroup} className="grid grid-cols-[5.5rem_1fr] items-center gap-3 sm:grid-cols-[7rem_1fr]">
                  <span className={`truncate text-sm ${mine ? 'font-bold text-indigo-700' : 'text-slate-600'}`}>
                    {r.jobGroup}{mine && <span className="sr-only"> (내 직군)</span>}
                  </span>
                  <div className="flex items-center gap-2" title={`${r.jobGroup}: 평균 월급 ${formatWon(r.avgSalary)} · 평균 지출 ${formatWon(r.avgTotalSpend)} · ${r.n}명`}>
                    <div className="h-5 flex-1">
                      <div className={`h-full rounded-r ${mine ? 'bg-indigo-600' : 'bg-indigo-200'}`} style={{ width: `${Math.max(2, (r.avgSalary / max) * 100)}%` }} />
                    </div>
                    <span className="w-28 shrink-0 text-right text-xs tabular-nums text-slate-600">
                      <span className="font-semibold text-slate-800">{formatWon(r.avgSalary)}</span> · {r.n}명
                    </span>
                  </div>
                </li>
              );
            })}
          </ul>
        </figure>
      );
    }

    // 0(적음) ~ 100(많음) 트랙 위에 내 위치 점을 찍는다
    function PercentileTrack({ percent, label }) {
      const left = Math.min(100, Math.max(0, percent));
      return (
        <div className="mt-3" role="img" aria-label={label}>
          <div className="relative h-2 rounded-full bg-gradient-to-r from-slate-100 via-indigo-100 to-indigo-300">
            <span
              className="absolute top-1/2 h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white bg-indigo-600 shadow"
              style={{ left: `${left}%` }}
            />
          </div>
          <div className="mt-1 flex justify-between text-[10px] text-slate-400"><span>적음</span><span>많음</span></div>
        </div>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    const EMPTY_FORM = { jobGroup: '', years: '', salary: '', food: '', housing: '', transport: '', culture: '' };

    function validateForm(form) {
      const errors = {};
      if (!form.jobGroup) errors.jobGroup = '직군을 골라 주세요.';
      if (form.years === '') errors.years = '연차를 골라 주세요.';

      for (const key of ['salary', ...SPEND_ITEMS.map((i) => i.key)]) {
        const won = manToWon(form[key]);
        if (form[key] === '') errors[key] = key === 'salary' ? '월급을 입력해 주세요.' : '없으면 0 을 입력해 주세요.';
        else if (Number.isNaN(won) || won < 0) errors[key] = '0 이상의 숫자로 입력해 주세요.';
        else if (won > MONEY_MAX_MAN * MAN) errors[key] = '1억 원(10000만원) 이하로 입력해 주세요.';
        else if (key === 'salary' && won < 1) errors[key] = '월급은 0보다 커야 해요.';
      }
      return errors;
    }

    function HomePage() {
      const { navigate } = useRouter();
      const [form, setForm] = useState(EMPTY_FORM);
      const [errors, setErrors] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [submitError, setSubmitError] = useState('');
      const summary = useFetch('/stats');
      const lastId = readLastReportId();

      const setField = (key) => (e) => {
        setForm((f) => ({ ...f, [key]: e.target.value }));
        if (errors[key]) setErrors((er) => ({ ...er, [key]: undefined }));
      };

      // 입력하는 동안 합계를 바로 보여준다 (비었거나 잘못된 칸은 0 으로 셈)
      const preview = useMemo(() => {
        const val = (k) => { const w = manToWon(form[k]); return Number.isNaN(w) || w < 0 ? 0 : w; };
        const salary = val('salary');
        const items = SPEND_ITEMS.map((i) => ({ ...i, won: val(i.key) }));
        const total = items.reduce((s, i) => s + i.won, 0);
        return { salary, items, total, savings: salary - total };
      }, [form]);

      async function handleSubmit(e) {
        e.preventDefault();
        const found = validateForm(form);
        setErrors(found);
        if (Object.keys(found).length) {
          document.getElementById(`f-${Object.keys(found)[0]}`)?.focus();
          return;
        }
        setSubmitting(true);
        setSubmitError('');
        try {
          const report = await api('/reports', {
            method: 'POST',
            body: JSON.stringify({
              jobGroup: form.jobGroup,
              years: Number(form.years),
              salary: manToWon(form.salary),
              ...Object.fromEntries(SPEND_ITEMS.map((i) => [i.key, manToWon(form[i.key])])),
            }),
          });
          saveLastReportId(report.id);
          navigate(`/result/${report.id}`);
        } catch (err) {
          setSubmitError(err.message);
          setSubmitting(false);
        }
      }

      const overall = summary.data?.overall;

      return (
        <div className="grid gap-6 lg:grid-cols-5">
          <Card className="anim-pop lg:col-span-3">
            <CardTitle title="내 월급·지출 입력" desc="금액은 만원 단위로 적어 주세요. (예: 325.5 → 325만 5천원)" />
            <form onSubmit={handleSubmit} noValidate className="space-y-6">
              <fieldset className="grid gap-4 sm:grid-cols-2">
                <legend className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">직업 정보</legend>
                <Select
                  id="f-jobGroup" label="직군" value={form.jobGroup} onChange={setField('jobGroup')}
                  placeholder="직군 선택" error={errors.jobGroup}
                  options={JOB_GROUPS.map((g) => ({ value: g, label: g }))}
                />
                <Select
                  id="f-years" label="연차 (경력)" value={form.years} onChange={setField('years')}
                  placeholder="연차 선택" error={errors.years}
                  options={Array.from({ length: YEARS_MAX + 1 }, (_, y) => ({ value: String(y), label: yearsLabel(y) }))}
                />
              </fieldset>

              <fieldset>
                <legend className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">월 수입</legend>
                <Input
                  id="f-salary" type="number" inputMode="decimal" min="0" step="0.1"
                  label="월급" hint="세후 실수령액" suffix="만원" placeholder="0"
                  value={form.salary} onChange={setField('salary')} error={errors.salary}
                />
              </fieldset>

              <fieldset className="grid gap-4 sm:grid-cols-2">
                <legend className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">월 지출</legend>
                {SPEND_ITEMS.map((item) => (
                  <Input
                    key={item.key} id={`f-${item.key}`} type="number" inputMode="decimal" min="0" step="0.1"
                    label={item.label} hint={item.hint} suffix="만원" placeholder="0"
                    value={form[item.key]} onChange={setField(item.key)} error={errors[item.key]}
                  />
                ))}
              </fieldset>

              <div className="rounded-xl bg-slate-50 p-4">
                <div className="flex flex-wrap justify-between gap-2 text-sm">
                  <span className="text-slate-500">월 지출 합계 <b className="ml-1 tabular-nums text-slate-900">{formatWon(preview.total)}</b></span>
                  <span className="text-slate-500">남는 돈 <b className={`ml-1 tabular-nums ${preview.savings < 0 ? 'text-rose-600' : 'text-slate-900'}`}>{formatWon(preview.savings)}</b></span>
                </div>
                {preview.salary > 0 && (
                  <ul className="mt-3 space-y-1.5" aria-label="월급 대비 항목별 지출 비율">
                    {preview.items.map((i) => {
                      const ratio = (i.won / preview.salary) * 100;
                      return (
                        <li key={i.key} className="grid grid-cols-[4.5rem_1fr_3rem] items-center gap-2 text-xs">
                          <span className="text-slate-600">{i.label}</span>
                          <div className="h-2 rounded-full bg-slate-200">
                            <div className="h-full rounded-full bg-indigo-400" style={{ width: `${Math.min(100, ratio)}%` }} />
                          </div>
                          <span className="text-right tabular-nums text-slate-600">{fmtNum(ratio, 0)}%</span>
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>

              {submitError && <Alert>{submitError}</Alert>}

              <Button type="submit" size="lg" className="w-full" disabled={submitting}>
                {submitting ? <><Spinner /> 저장하고 비교하는 중…</> : '제출하고 내 위치 보기'}
              </Button>
            </form>
          </Card>

          <aside className="space-y-4 lg:col-span-2">
            <Card className="anim-pop">
              <h2 className="font-bold text-slate-900">지금까지 모인 응답</h2>
              {summary.loading && <div className="py-6 text-center text-slate-400"><Spinner /></div>}
              {summary.error && <p className="mt-2 text-sm text-rose-600">{summary.error.message}</p>}
              {overall && (overall.n === 0 ? (
                <p className="mt-2 text-sm text-slate-500">아직 응답이 없어요. 첫 번째 응답자가 되어 주세요! 🙌</p>
              ) : (
                <div className="mt-3 grid grid-cols-2 gap-2">
                  <StatTile label="참여 인원" value={`${overall.n.toLocaleString('ko-KR')}명`} />
                  <StatTile label="평균 월급" value={formatWon(overall.avg.salary)} />
                  <StatTile label="평균 월 지출" value={formatWon(overall.avg.totalSpend)} />
                  <StatTile label="평균 남는 돈" value={formatWon(overall.avg.savings)} />
                </div>
              ))}
              <Link to="/stats" className="mt-4 inline-block text-sm font-semibold text-indigo-600 hover:underline">전체 통계 자세히 보기 →</Link>
            </Card>

            {lastId && (
              <Card className="anim-pop">
                <h2 className="font-bold text-slate-900">이전에 제출한 결과</h2>
                <p className="mt-1 text-sm text-slate-500">응답이 더 모였을 테니, 내 위치가 바뀌었을 수 있어요.</p>
                <Link to={`/result/${lastId}`} className="mt-3 inline-block text-sm font-semibold text-indigo-600 hover:underline">내 결과 다시 보기 →</Link>
              </Card>
            )}

            <Card className="anim-pop text-sm text-slate-600">
              <h2 className="font-bold text-slate-900">이렇게 계산해요</h2>
              <ul className="mt-2 list-disc space-y-1 pl-5">
                <li><b>상위 X%</b> = 나보다 금액이 큰 사람 수 + 1 을 전체 인원으로 나눈 값</li>
                <li>지출 항목의 상위 %는 <b>많이 쓰는 순</b>이에요</li>
                <li>같은 직군, 같은 경력대(2년 이하·3~5년·6~9년·10~14년·15년 이상) 평균과도 비교해요</li>
              </ul>
            </Card>
          </aside>
        </div>
      );
    }

    function DistributionSection({ distribution, me }) {
      const salaryIdx = me ? findBucket(distribution.salary, me.salary) : -1;
      const spendIdx = me ? findBucket(distribution.totalSpend, me.totalSpend) : -1;
      return (
        <Card>
          <CardTitle title="분포" desc={me ? '진한 막대가 내가 속한 구간이에요. 막대에 마우스를 올리면 인원이 보여요.' : '막대에 마우스를 올리면 구간별 인원이 보여요.'} />
          <div className="grid gap-8 md:grid-cols-2">
            <Histogram title="월급 분포" buckets={distribution.salary} highlightIndex={salaryIdx} unitNote="단위 만원" />
            <Histogram title="월 지출 합계 분포" buckets={distribution.totalSpend} highlightIndex={spendIdx} unitNote="단위 만원" />
          </div>
          {distribution.jobGroups.length > 0 && (
            <div className="mt-8 border-t border-slate-100 pt-6">
              <JobGroupBars rows={distribution.jobGroups} highlight={me?.jobGroup} />
            </div>
          )}
        </Card>
      );
    }

    function PositionCard({ metric, me, avg, rankInfo, n }) {
      const value = me[metric.key];
      const diff = value - avg;
      const { rank, topPercent } = rankInfo;
      // 동점·1명일 때도 가운데에 오도록 순위의 중간값으로 위치를 잡는다
      const position = ((n - rank + 0.5) / n) * 100;
      return (
        <div className="rounded-xl border border-slate-200 p-4">
          <div className="flex items-start justify-between gap-2">
            <p className="text-sm font-medium text-slate-500">{metric.label}</p>
            <Badge tone="indigo">상위 {fmtNum(topPercent)}%</Badge>
          </div>
          <p className="mt-1 text-2xl font-bold tabular-nums text-slate-900">{formatWon(value)}</p>
          <p className="mt-0.5 text-xs text-slate-500">
            평균 {formatWon(avg)} ·{' '}
            <span className={`font-semibold ${diff === 0 ? 'text-slate-500' : 'text-slate-700'}`}>
              {diff === 0 ? '평균과 같음' : `평균보다 ${formatWon(Math.abs(diff))} ${diff > 0 ? '많음' : '적음'}`}
            </span>
          </p>
          <PercentileTrack percent={position} label={`${metric.label}: ${n}명 중 ${rank}위, ${metric.higher} 상위 ${topPercent}%`} />
          <p className="mt-1 text-[11px] text-slate-400">{n}명 중 {rank}위 · {metric.higher}</p>
        </div>
      );
    }

    function ResultPage() {
      const { id } = useParams();
      const { data, loading, error, reload } = useFetch(`/reports/${encodeURIComponent(id)}/stats`);
      const [copied, setCopied] = useState(false);

      async function copyLink() {
        try {
          await navigator.clipboard.writeText(window.location.href);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {
          window.prompt('아래 주소를 복사해 주세요.', window.location.href);
        }
      }

      if (loading && !data) return <PageLoader label="내 위치를 계산하는 중…" />;
      if (error) return <ErrorState message={error.message} onRetry={reload} />;

      const { me, overall, jobGroup, yearBand, position, distribution } = data;
      const salaryTop = position.overall.rank.salary;
      const jobTop = position.jobGroup.rank.salary;

      const compareCols = [
        { key: 'me', label: '나', values: me },
        { key: 'overall', label: '전체 평균', n: overall.n, values: overall.avg },
        { key: 'job', label: `${jobGroup.label} 평균`, n: jobGroup.n, values: jobGroup.avg },
        { key: 'band', label: `${yearBand.label} 평균`, n: yearBand.n, values: yearBand.avg },
      ];

      return (
        <div className="space-y-6">
          {/* 히어로: 월급 상위 % */}
          <section className="anim-pop overflow-hidden rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 p-6 text-white shadow-lg sm:p-8">
            <div className="flex flex-wrap items-center gap-2 text-sm text-indigo-100">
              <span>{me.jobGroup}</span><span aria-hidden="true">·</span><span>경력 {yearsLabel(me.years)}</span>
              {overall.n < SMALL_SAMPLE && <Badge tone="amber" className="ml-1">응답 {overall.n}명 · 참고용</Badge>}
            </div>
            <p className="mt-3 text-lg font-medium text-indigo-100">내 월급은 전체에서</p>
            <p className="text-5xl font-black tracking-tight tabular-nums sm:text-6xl">
              상위 {fmtNum(salaryTop.topPercent)}%
            </p>
            <p className="mt-3 text-sm text-indigo-100">
              {overall.n.toLocaleString('ko-KR')}명 중 {salaryTop.rank}위 ·{' '}
              {me.jobGroup} 안에서는 <b className="text-white">상위 {fmtNum(jobTop.topPercent)}%</b> ({position.jobGroup.n}명 중 {jobTop.rank}위)
            </p>
            <div className="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4">
              {[
                ['내 월급', formatWon(me.salary)],
                ['전체 평균 월급', formatWon(overall.avg.salary)],
                ['전체 중앙값', formatWon(overall.medianSalary)],
                ['내가 남기는 돈', formatWon(me.savings)],
              ].map(([label, value]) => (
                <div key={label} className="rounded-xl bg-white/10 px-3 py-2.5">
                  <p className="text-xs text-indigo-100">{label}</p>
                  <p className="mt-0.5 text-lg font-bold tabular-nums">{value}</p>
                </div>
              ))}
            </div>
          </section>

          {/* 항목별 내 위치 */}
          <Card>
            <CardTitle title="항목별 내 위치" desc="전체 응답자와 비교한 순위예요. 지출 항목은 많이 쓸수록 상위예요." />
            <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
              {METRICS.map((m) => (
                <PositionCard key={m.key} metric={m} me={me} avg={overall.avg[m.key]} rankInfo={position.overall.rank[m.key]} n={position.overall.n} />
              ))}
            </div>
          </Card>

          {/* 평균 비교표 */}
          <Card>
            <CardTitle title="평균 비교" desc="나와 전체 / 같은 직군 / 같은 경력대 평균을 나란히 봐요." />
            <div className="-mx-5 overflow-x-auto px-5 sm:mx-0 sm:px-0">
              <table className="w-full min-w-[34rem] text-sm">
                <thead>
                  <tr className="border-b border-slate-200 text-left text-xs text-slate-500">
                    <th scope="col" className="py-2 pr-3 font-medium">항목</th>
                    {compareCols.map((c) => (
                      <th key={c.key} scope="col" className={`py-2 pl-3 text-right font-medium ${c.key === 'me' ? 'text-indigo-700' : ''}`}>
                        {c.label}{c.n !== undefined && <span className="block font-normal text-slate-400">{c.n}명</span>}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="tabular-nums">
                  {METRICS.map((m) => (
                    <tr key={m.key} className="border-b border-slate-100 last:border-0">
                      <th scope="row" className="py-2.5 pr-3 text-left font-medium text-slate-700">{m.label}</th>
                      {compareCols.map((c) => (
                        <td key={c.key} className={`py-2.5 pl-3 text-right ${c.key === 'me' ? 'font-bold text-indigo-700' : 'text-slate-700'}`}>
                          {formatWon(c.values[m.key])}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>

          <DistributionSection distribution={distribution} me={me} />

          <div className="flex flex-wrap justify-center gap-2">
            <Button variant="secondary" onClick={copyLink}>{copied ? '✓ 링크 복사됨' : '🔗 결과 링크 복사'}</Button>
            <Link to="/stats" className="inline-flex items-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">전체 통계 보기</Link>
            <Link to="/" className="inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">새로 입력하기</Link>
          </div>
        </div>
      );
    }

    function StatsPage() {
      const { data, loading, error, reload } = useFetch('/stats');

      if (loading && !data) return <PageLoader />;
      if (error) return <ErrorState message={error.message} onRetry={reload} />;

      const { overall, distribution } = data;
      if (overall.n === 0) return <EmptyStats />;

      const maxSpend = Math.max(1, ...SPEND_ITEMS.map((i) => overall.avg[i.key]));

      return (
        <div className="space-y-6">
          <Card className="anim-pop">
            <CardTitle
              title="전체 통계"
              desc={`지금까지 ${overall.n.toLocaleString('ko-KR')}명이 응답했어요.`}
              right={<Button variant="ghost" size="sm" onClick={reload} disabled={loading}>{loading ? <Spinner /> : '↻'} 새로고침</Button>}
            />
            {overall.n < SMALL_SAMPLE && <p className="mb-4 text-sm text-amber-700">응답이 {SMALL_SAMPLE}명 미만이라 통계가 크게 흔들릴 수 있어요.</p>}
            <div className="grid grid-cols-2 gap-3 md:grid-cols-4">
              <StatTile label="평균 월급" value={formatWon(overall.avg.salary)} />
              <StatTile label="월급 중앙값" value={formatWon(overall.medianSalary)} sub="딱 가운데 사람의 월급" />
              <StatTile label="평균 월 지출" value={formatWon(overall.avg.totalSpend)} />
              <StatTile label="평균 남는 돈" value={formatWon(overall.avg.savings)} />
            </div>

            <h3 className="mb-3 mt-6 font-semibold text-slate-800">항목별 평균 지출</h3>
            <ul className="space-y-2">
              {SPEND_ITEMS.map((i) => (
                <li key={i.key} className="grid grid-cols-[4.5rem_1fr_5rem] items-center gap-3 text-sm">
                  <span className="text-slate-600">{i.label}</span>
                  <div className="h-4">
                    <div className="h-full rounded-r bg-indigo-400" style={{ width: `${Math.max(1, (overall.avg[i.key] / maxSpend) * 100)}%` }} />
                  </div>
                  <span className="text-right font-semibold tabular-nums text-slate-800">{formatWon(overall.avg[i.key])}</span>
                </li>
              ))}
            </ul>
          </Card>

          <DistributionSection distribution={distribution} />

          <div className="text-center">
            <Link to="/" className="inline-flex items-center rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-700">나도 입력하고 내 위치 보기</Link>
          </div>
        </div>
      );
    }

    function NotFoundPage() {
      return (
        <Card className="mx-auto max-w-md text-center">
          <p className="text-3xl" aria-hidden="true">🧭</p>
          <p className="mt-2 font-semibold text-slate-800">페이지를 찾을 수 없어요</p>
          <Link to="/" className="mt-4 inline-flex rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">처음으로</Link>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      return (
        <Router>
          <Header />
          <main className="mx-auto max-w-5xl px-4 py-6 sm:py-8">
            <Routes>
              <Route path="/" element={<HomePage />} />
              <Route path="/stats" element={<StatsPage />} />
              <Route path="/result/:id" element={<ResultPage />} />
              <Route path="*" element={<NotFoundPage />} />
            </Routes>
          </main>
          <Footer />
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
