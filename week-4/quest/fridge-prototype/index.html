// 🧮 Utils — 날짜 · 포맷 헬퍼

const DAY_MS = 24 * 60 * 60 * 1000;

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

/** 오늘 기준 n일 뒤의 'YYYY-MM-DD'. 목 데이터를 항상 오늘 기준으로 만들기 위해 사용 */
function dayOffset(n) {
  const d = startOfToday();
  d.setDate(d.getDate() + n);
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function daysLeft(iso) {
  return Math.round((new Date(`${iso}T00:00:00`) - startOfToday()) / DAY_MS);
}

function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${y}.${m}.${d}`;
}

function expiryTone(n) {
  if (n <= 2) return 'danger';
  if (n <= 5) return 'warning';
  return 'success';
}

function expiryLabel(n) {
  if (n < 0) return `${Math.abs(n)}일 지남`;
  if (n === 0) return '오늘까지';
  return `D-${n}`;
}

    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl', xl: 'max-w-4xl' };

  return (
    <div

// ========================================
// 🔀 Router Components (hash-based)
// ========================================
const RouterContext = createContext({ path: '/', navigate: () => {} });

function matchRoute(pattern, path) {
  const p = pattern.split('/').filter(Boolean);
  const c = path.split('/').filter(Boolean);
  if (p.length !== c.length) return null;

  const params = {};
  for (let i = 0; i < p.length; i++) {
    if (p[i].startsWith(':')) {
      params[p[i].slice(1)] = decodeURIComponent(c[i]);
    } else if (p[i] !== c[i]) {
      return null;
    }
  }
  return params;
}

function Router({ children }) {
  const readHash = () => window.location.hash.replace(/^#/, '') || '/';
  const [path, setPath] = useState(readHash);

  useEffect(() => {
    const onChange = () => {
      setPath(readHash());
      window.scrollTo({ top: 0 });
    };
    window.addEventListener('hashchange', onChange);
    if (!window.location.hash) window.location.hash = '#/';
    return () => window.removeEventListener('hashchange', onChange);
  }, []);

  const navigate = useCallback((to) => {
    window.location.hash = `#${to}`;
  }, []);

  return (
    <RouterContext.Provider value={{ path, navigate }}>
      {children}
    </RouterContext.Provider>
  );
}

function Routes({ children }) {
  const { path } = useContext(RouterContext);
  const routes = React.Children.toArray(children);

  let matched = null;
  let matchedParams = {};
  let fallback = null;

  for (const route of routes) {
    if (route.props.path === '*') { fallback = route; continue; }
    const params = matchRoute(route.props.path, path);
    if (params) { matched = route; matchedParams = params; break; }
  }

  const target = matched || fallback;

  return target ? <RouteParamsProvider params={matchedParams}>{target.props.element}</RouteParamsProvider> : null;
}

const ParamsContext = createContext({});
function RouteParamsProvider({ params, children }) {
  return <ParamsContext.Provider value={params}>{children}</ParamsContext.Provider>;
}

function Route() { return null; }

function Link({ to, className = '', children, ...rest }) {
  const { navigate } = useContext(RouterContext);
  return (
    <a
      href={`#${to}`}
      className={className}
      onClick={(e) => { e.preventDefault(); navigate(to); }}
      {...rest}
    >
      {children}
    </a>
  );
}

// ========================================
// 📡 API Layer — server.js (Supabase PostgreSQL)
// ========================================
// 같은 서버가 이 페이지를 서빙하므로 상대 경로면 충분하다 (로컬 · Vercel 양쪽 동작)
const API_BASE_URL = '/api';

// 로그인 토큰 보관함. 새로고침해도 로그인이 유지되도록 localStorage 에 둔다
const TOKEN_KEY = 'fp_token';
const tokenStore = {
  get() {
    try { return localStorage.getItem(TOKEN_KEY) || null; } catch { return null; }
  },
  set(token) {
    try { localStorage.setItem(TOKEN_KEY, token); } catch {}
  },
  clear() {
    try { localStorage.removeItem(TOKEN_KEY); } catch {}
  },
};

// 토큰이 죽었을 때(만료·위조·계정 삭제) AuthProvider 가 강제 로그아웃하도록 걸어 두는 자리
let onAuthExpired = () => {};

/** 서버 응답 규약 { success, data, message? } 를 풀어서 data 를 돌려준다 */
async function api(endpoint, { method = 'GET', body, auth = true } = {}) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';

  const token = auth ? tokenStore.get() : null;
  if (token) headers.Authorization = `Bearer ${token}`;

  const res = await fetch(`${API_BASE_URL}${endpoint}`, {
    method,
    headers: Object.keys(headers).length > 0 ? headers : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });

  let payload = null;
  try {
    payload = await res.json();
  } catch {
    // 서버가 JSON 이 아닌 응답을 준 경우 (프록시 오류 등)
  }

  // 401 은 토큰 문제다. 로그인 화면으로 돌려보낸 뒤 에러를 그대로 올린다
  if (res.status === 401 && auth) {
    onAuthExpired((payload && payload.message) || '다시 로그인해 주세요');
  }

  if (!res.ok || !payload || payload.success === false) {
    throw new Error((payload && payload.message) || `요청에 실패했습니다 (HTTP ${res.status})`);
  }
  return payload;
}

// ========================================
// 🔐 Auth Store (Context) — JWT 로그인 상태
// ========================================
const AuthContext = createContext(null);
const useAuth = () => useContext(AuthContext);

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [ready, setReady] = useState(false);   // 저장된 토큰 확인이 끝났는지
  const [expiredMsg, setExpiredMsg] = useState('');

  const logout = useCallback((message = '') => {
    tokenStore.clear();
    setUser(null);
    setExpiredMsg(message);
  }, []);

  // api() 안에서 401 을 만나면 여기로 흘러들어온다
  useEffect(() => {
    onAuthExpired = (message) => logout(message);
    return () => { onAuthExpired = () => {}; };
  }, [logout]);

  // 새로고침 직후: 저장된 토큰이 아직 유효한지 서버에 물어본다
  useEffect(() => {
    const token = tokenStore.get();
    if (!token) { setReady(true); return; }

    let alive = true;
    api('/auth/me')
      .then(({ data }) => { if (alive) setUser(data.user); })
      .catch(() => { if (alive) tokenStore.clear(); })
      .finally(() => { if (alive) setReady(true); });
    return () => { alive = false; };
  }, []);

  const authenticate = useCallback(async (endpoint, body) => {
    const { data } = await api(endpoint, { method: 'POST', body, auth: false });
    tokenStore.set(data.token);
    setExpiredMsg('');
    setUser(data.user);
    return data.user;
  }, []);

  const login = useCallback(
    (email, password) => authenticate('/auth/login', { email, password }),
    [authenticate]
  );

  const signup = useCallback(
    (email, nickname, password) => authenticate('/auth/signup', { email, nickname, password }),
    [authenticate]
  );

  return (
    <AuthContext.Provider value={{ user, ready, login, signup, logout, expiredMsg }}>
      {children}
    </AuthContext.Provider>
  );
}

// ========================================
// 🗄️ Fridge Store (Context) — 서버가 진짜 저장소
// ========================================
const FridgeContext = createContext(null);
const useFridge = () => useContext(FridgeContext);

function FridgeProvider({ children }) {
  const [ingredients, setIngredients] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [shopping, setShopping] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [aiEnabled, setAiEnabled] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [toast, setToast] = useState('');

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(''), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const notify = useCallback((msg) => setToast(msg), []);

  // 초기 로딩: 네 리소스를 한 번의 요청으로 받아온다
  const reload = useCallback(async () => {
    setLoading(true);
    setLoadError(null);
    try {
      const { data } = await api('/bootstrap');
      setIngredients(data.ingredients);
      setRecipes(data.recipes);
      setShopping(data.shopping);
      setFavorites(data.favorites);
      setAiEnabled(data.aiEnabled === true);
    } catch (err) {
      setLoadError(err.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { reload(); }, [reload]);

  const ownedNames = useMemo(
    () => new Set(ingredients.filter((i) => i.qty > 0).map((i) => i.name)),
    [ingredients]
  );

  /** 레시피별 보유/부족 재료와 매칭률 */
  const recipeStats = useMemo(() => {
    const map = {};
    for (const r of recipes) {
      const have = r.items.filter((it) => ownedNames.has(it.name));
      const missing = r.items.filter((it) => !ownedNames.has(it.name));
      map[r.id] = {
        have,
        missing,
        rate: r.items.length === 0 ? 0 : Math.round((have.length / r.items.length) * 100),
      };
    }
    return map;
  }, [recipes, ownedNames]);

  const expiringSoon = useMemo(
    () =>
      ingredients
        .map((i) => ({ ...i, left: daysLeft(i.expiresAt) }))
        .filter((i) => i.left <= 5)
        .sort((a, b) => a.left - b.left),
    [ingredients]
  );

  // ── 재료 ───────────────────────────────────
  const addIngredient = useCallback(async (form) => {
    try {
      const { data } = await api('/ingredients', { method: 'POST', body: form });
      setIngredients((prev) => [data, ...prev]);
      notify(`${data.name} 을(를) 냉장고에 넣었어요`);
    } catch (err) {
      notify(err.message);
    }
  }, [notify]);

  const updateQty = useCallback(async (id, delta) => {
    try {
      const { data } = await api(`/ingredients/${id}`, { method: 'PATCH', body: { delta } });
      setIngredients((prev) => prev.map((i) => (i.id === id ? data : i)));
    } catch (err) {
      notify(err.message);
    }
  }, [notify]);

  const removeIngredient = useCallback(async (id) => {
    try {
      const { data } = await api(`/ingredients/${id}`, { method: 'DELETE' });
      setIngredients((prev) => prev.filter((i) => i.id !== id));
      notify(`${data.name} 을(를) 비웠어요`);
    } catch (err) {
      notify(err.message);
    }
  }, [notify]);

  // ── AI 레시피 ──────────────────────────────
  /** 서버가 OpenAI 를 호출해 레시피를 만들고 DB 에 저장한 뒤 돌려준다. 성공하면 저장된 레시피를 반환 */
  const generateRecipe = useCallback(async ({ mode, names, request }) => {
    const { data } = await api('/recipes/generate', {
      method: 'POST',
      body: { mode, names, request },
    });
    setRecipes((prev) => [...prev, data]);
    notify(`${data.name} 레시피를 만들었어요`);
    return data;
  }, [notify]);

  const removeRecipe = useCallback(async (id) => {
    try {
      const { data } = await api(`/recipes/${id}`, { method: 'DELETE' });
      setRecipes((prev) => prev.filter((r) => r.id !== id));
      setFavorites((prev) => prev.filter((f) => f !== id));
      notify(`${data.name} 레시피를 삭제했어요`);
      return true;
    } catch (err) {
      notify(err.message);
      return false;
    }
  }, [notify]);

  // ── 즐겨찾기 ───────────────────────────────
  const toggleFavorite = useCallback(async (recipeId) => {
    const isFav = favorites.includes(recipeId);
    try {
      await api(`/favorites/${recipeId}`, { method: isFav ? 'DELETE' : 'PUT' });
      setFavorites((prev) => (isFav ? prev.filter((f) => f !== recipeId) : [...prev, recipeId]));
    } catch (err) {
      notify(err.message);
    }
  }, [favorites, notify]);

  // ── 장보기 ─────────────────────────────────
  /** 레시피 상세에서 부족한 재료를 한 번에 담는다 */
  const addShopping = useCallback(async (items, source) => {
    try {
      const payload = await api('/shopping', { method: 'POST', body: { items, source } });
      if (payload.data.length === 0) {
        notify(payload.message || '이미 장바구니에 담겨 있어요');
        return;
      }
      setShopping((prev) => [...prev, ...payload.data]);
      notify(`${payload.data.length}개 재료를 장바구니에 담았어요`);
    } catch (err) {
      notify(err.message);
    }
  }, [notify]);

  /** 장보기 화면에서 직접 입력한 항목 */
  const addShoppingManual = useCallback(async (name) => {
    try {
      const payload = await api('/shopping', { method: 'POST', body: { name, source: '직접 추가' } });
      if (payload.data.length === 0) {
        notify(payload.message || '이미 장바구니에 담겨 있어요');
        return;
      }
      setShopping((prev) => [...prev, ...payload.data]);
      notify(`${name} 을(를) 담았어요`);
    } catch (err) {
      notify(err.message);
    }
  }, [notify]);

  const toggleShopping = useCallback(async (id) => {
    const target = shopping.find((s) => s.id === id);
    if (!target) return;
    try {
      const { data } = await api(`/shopping/${id}`, { method: 'PATCH', body: { done: !target.done } });
      setShopping((prev) => prev.map((s) => (s.id === id ? data : s)));
    } catch (err) {
      notify(err.message);
    }
  }, [shopping, notify]);

  const removeShopping = useCallback(async (id) => {
    try {
      await api(`/shopping/${id}`, { method: 'DELETE' });
      setShopping((prev) => prev.filter((s) => s.id !== id));
    } catch (err) {
      notify(err.message);
    }
  }, [notify]);

  const clearDoneShopping = useCallback(async () => {
    try {
      const { data } = await api('/shopping/done', { method: 'DELETE' });
      setShopping((prev) => prev.filter((s) => !s.done));
      notify(`구매 완료 ${data.removed}개를 정리했어요`);
    } catch (err) {
      notify(err.message);
    }
  }, [notify]);

  const value = {
    ingredients, recipes, shopping, favorites, recipeStats, expiringSoon, ownedNames,
    loading, loadError, reload, aiEnabled,
    generateRecipe, removeRecipe,
    addIngredient, updateQty, removeIngredient,
    toggleFavorite, addShopping, addShoppingManual, toggleShopping, removeShopping, clearDoneShopping,
    notify,
  };

  return (
    <FridgeContext.Provider value={value}>
      {children}
      <Toast message={toast} />
    </FridgeContext.Provider>
  );
}

  const handleSubmit = () => {
    const next = {};
    if (!form.name.trim()) next.name = '재료 이름을 입력해 주세요';
    if (!Number.isInteger(Number(form.qty)) || Number(form.qty) <= 0) next.qty = '1 이상의 정수를 입력해 주세요';
    if (form.days === '' || !Number.isInteger(Number(form.days))) next.days = '남은 일수를 정수로 입력해 주세요';
    setErrors(next);
    if (Object.keys(next).length > 0) return;

    // 소비기한은 서버가 CURRENT_DATE + days 로 계산한다 (클라이언트 시계에 의존하지 않음)
    onSubmit({
      name: form.name.trim(),
      category: form.category,
      qty: Number(form.qty),
      unit: form.unit.trim() || '개',
      location: form.location,
      days: Number(form.days),
    });
    onClose();
  };

  return (
    <Modal isOpen={isOpen} onClose={onClose} title="재료 넣기" size="md">
      <div className="space-y-4">
        <Input
          label="재료 이름"
          value={form.name}
          onChange={set('name')}
          placeholder="예) 브로콜리"
          error={errors.name}
        />

        <div className="grid grid-cols-2 gap-3">
          <Select
            label="카테고리"
            value={form.category}
            onChange={set('category')}
            options={CATEGORIES.map((c) => ({ value: c, label: `${CATEGORY_ICON[c]} ${c}` }))}
          />
          <Select
            label="보관 위치"
            value={form.location}
            onChange={set('location')}
            options={LOCATIONS.map((l) => ({ value: l, label: `${LOCATION_STYLE[l].icon} ${l}` }))}
          />
        </div>

        <div className="grid grid-cols-2 gap-3">
          <Input label="수량" type="number" min="0" value={form.qty} onChange={set('qty')} error={errors.qty} />
          <Input label="단위" value={form.unit} onChange={set('unit')} placeholder="개 / g / ml" />
        </div>

        <Input
          label="유통기한 (오늘부터 며칠 뒤)"
          type="number"
          value={form.days}
          onChange={set('days')}
          error={errors.days}
        />
        <p className="-mt-2 text-xs text-stone-400">
          예상 소비기한: <strong className="text-stone-600">{formatDate(dayOffset(Number(form.days) || 0))}</strong>
        </p>

        <div className="flex gap-2 pt-2">
          <Button variant="secondary" size="md" className="flex-1" onClick={onClose}>취소</Button>
          <Button variant="primary" size="md" className="flex-1" onClick={handleSubmit}>냉장고에 넣기</Button>
        </div>
      </div>
    </Modal>
  );
}

function IngredientsPage() {
  const { ingredients, addIngredient, updateQty, removeIngredient } = useFridge();
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('전체');
  const [location, setLocation] = useState('전체');
  const [sort, setSort] = useState('expiry');
  const [modalOpen, setModalOpen] = useState(false);

  const filtered = useMemo(() => {
    let list = ingredients.filter((i) => {
      const okQuery = i.name.toLowerCase().includes(query.trim().toLowerCase());
      const okCat = category === '전체' || i.category === category;
      const okLoc = location === '전체' || i.location === location;
      return okQuery && okCat && okLoc;
    });

    const sorters = {
      expiry: (a, b) => daysLeft(a.expiresAt) - daysLeft(b.expiresAt),
      name: (a, b) => a.name.localeCompare(b.name, 'ko'),
      added: (a, b) => new Date(b.addedAt) - new Date(a.addedAt),
    };
    return [...list].sort(sorters[sort]);
  }, [ingredients, query, category, location, sort]);

  const resetFilters = () => { setQuery(''); setCategory('전체'); setLocation('전체'); };

  return (
    <PageShell
      title="냉장고 재료"
      description={`전체 ${ingredients.length}종 중 ${filtered.length}종 표시 중`}
      action={<Button variant="primary" size="md" onClick={() => setModalOpen(true)}>＋ 재료 넣기</Button>}
    >
      {/* 필터 바 */}
      <Card className="p-4 mb-5">
        <div className="flex flex-col lg:flex-row gap-3">
          <div className="lg:max-w-xs w-full">
            <SearchInput value={query} onChange={(e) => setQuery(e.target.value)} placeholder="재료 이름 검색" />
          </div>
          <div className="flex-1 flex flex-wrap items-center gap-3">
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
              <Chip active={category === '전체'} onClick={() => setCategory('전체')}>전체</Chip>
              {CATEGORIES.map((c) => (
                <Chip key={c} active={category === c} onClick={() => setCategory(c)}>
                  {CATEGORY_ICON[c]} {c}
                </Chip>
              ))}
            </div>
          </div>
        </div>

        <div className="mt-3 pt-3 border-t border-stone-100 flex flex-wrap items-center gap-3">
          <div className="flex items-center gap-1.5">
            <span className="text-xs font-bold text-stone-400 mr-1">보관</span>
            <Chip active={location === '전체'} onClick={() => setLocation('전체')}>전체</Chip>
            {LOCATIONS.map((l) => (
              <Chip key={l} active={location === l} onClick={() => setLocation(l)}>
                {LOCATION_STYLE[l].icon} {l}
              </Chip>
            ))}
          </div>
          <div className="ml-auto w-full sm:w-44">
            <Select
              value={sort}
              onChange={(e) => setSort(e.target.value)}
              options={[
                { value: 'expiry', label: '유통기한 임박순' },
                { value: 'name', label: '이름순' },
                { value: 'added', label: '최근 담은 순' },
              ]}
            />
          </div>
        </div>
      </Card>

      {filtered.length === 0 ? (
        <Card className="p-4">
          <EmptyState
            icon="🔍"
            title="조건에 맞는 재료가 없어요"
            description="검색어나 필터를 바꿔 보세요."
            action={<Button variant="secondary" onClick={resetFilters}>필터 초기화</Button>}
          />
        </Card>
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
          {filtered.map((item) => (
            <IngredientCard
              key={item.id}
              item={item}
              onInc={(id) => updateQty(id, 1)}
              onDec={(id) => updateQty(id, -1)}
              onRemove={removeIngredient}
            />
          ))}
        </div>
      )}

      <IngredientFormModal isOpen={modalOpen} onClose={() => setModalOpen(false)} onSubmit={addIngredient} />
    </PageShell>
  );
}

const AI_MODES = [
  { value: 'all',      label: '냉장고 전체',   hint: '지금 있는 재료를 폭넓게 보고 알아서 골라 줍니다' },
  { value: 'expiring', label: '임박 재료 위주', hint: '유통기한 5일 이내 재료를 최대한 소비합니다' },
  { value: 'pick',     label: '직접 고르기',   hint: '선택한 재료를 반드시 모두 사용합니다' },
];

function AiRecipeModal({ isOpen, onClose }) {
  const { ingredients, expiringSoon, generateRecipe } = useFridge();
  const { navigate } = useRouter();

  const [mode, setMode] = useState('all');
  const [picked, setPicked] = useState([]);
  const [request, setRequest] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    if (isOpen) { setMode('all'); setPicked([]); setRequest(''); setBusy(false); setError(''); }
  }, [isOpen]);

  const usable = useMemo(() => ingredients.filter((i) => i.qty > 0), [ingredients]);

  const togglePick = (name) =>
    setPicked((prev) => (prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]));

  // 모드별로 지금 생성을 누를 수 있는지
  const blocked =
    usable.length === 0
      ? '냉장고가 비어 있어요. 재료를 먼저 넣어 주세요.'
      : mode === 'expiring' && expiringSoon.length === 0
        ? '유통기한이 임박한(5일 이내) 재료가 없어요.'
        : mode === 'pick' && picked.length === 0
          ? '사용할 재료를 하나 이상 골라 주세요.'
          : '';

  const handleGenerate = async () => {
    setBusy(true);
    setError('');
    try {
      const recipe = await generateRecipe({
        mode,
        names: mode === 'pick' ? picked : undefined,
        request: request.trim() || undefined,
      });
      onClose();
      navigate(`/recipes/${recipe.id}`);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <Modal
      isOpen={isOpen}
      onClose={busy ? () => {} : onClose}
      title="✨ AI 레시피 만들기"
      size="lg"
    >
      <div className="space-y-5">
        <p className="text-sm text-stone-500 leading-relaxed">
          지금 냉장고에 있는 재료를 그대로 읽어서 새 레시피를 만들고 저장합니다.
          만들어진 레시피는 레시피북에 <Badge tone="ai" size="sm">✨ AI</Badge> 표시로 남습니다.
        </p>

        {/* 어떤 재료를 기준으로 만들지 */}
        <div>
          <p className="mb-2 text-sm font-semibold text-stone-700">무엇을 기준으로 만들까요?</p>
          <div className="flex flex-wrap gap-1.5">
            {AI_MODES.map((m) => (
              <Chip key={m.value} active={mode === m.value} onClick={() => setMode(m.value)}>
                {m.label}
              </Chip>
            ))}
          </div>
          <p className="mt-2 text-xs text-stone-400">
            {AI_MODES.find((m) => m.value === mode).hint}
          </p>
        </div>

        {/* 임박 재료 미리보기 */}
        {mode === 'expiring' && expiringSoon.length > 0 && (
          <div className="p-3 rounded-xl bg-amber-50 border border-amber-100">
            <p className="text-xs font-bold text-amber-800 mb-2">이 재료들을 소비합니다</p>
            <div className="flex flex-wrap gap-1.5">
              {expiringSoon.map((i) => (
                <Badge key={i.id} tone={expiryTone(i.left)} size="sm">
                  {i.name} · {expiryLabel(i.left)}
                </Badge>
              ))}
            </div>
          </div>
        )}

        {/* 직접 고르기 */}
        {mode === 'pick' && (
          <div>
            <div className="flex items-center justify-between mb-2">
              <p className="text-sm font-semibold text-stone-700">사용할 재료</p>
              <span className="text-xs font-bold text-stone-400">{picked.length}개 선택</span>
            </div>
            <div className="max-h-52 overflow-y-auto p-1 rounded-xl border border-stone-200">
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-1">
                {usable.map((i) => {
                  const on = picked.includes(i.name);
                  return (
                    <button
                      key={i.id}
                      onClick={() => togglePick(i.name)}
                      aria-pressed={on}
                      className={`flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-xs font-semibold text-left transition-colors
                        ${on ? 'bg-emerald-600 text-white' : 'bg-white text-stone-600 hover:bg-stone-100'}`}
                    >
                      <span aria-hidden="true">{on ? '✓' : CATEGORY_ICON[i.category] || '🥄'}</span>
                      <span className="truncate">{i.name}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        <Textarea
          label="요청사항 (선택)"
          value={request}
          onChange={(e) => setRequest(e.target.value)}
          placeholder="예) 맵지 않게, 15분 안에, 술안주로, 아이도 먹을 수 있게"
          rows={2}
          maxLength={200}
        />

        {(error || blocked) && (
          <div className={`px-3.5 py-3 rounded-xl text-sm font-semibold
            ${error ? 'bg-rose-50 text-rose-700 border border-rose-100' : 'bg-stone-100 text-stone-500'}`}>
            {error || blocked}
          </div>
        )}

        <div className="flex gap-2 pt-1">
          <Button variant="secondary" size="md" className="flex-1" onClick={onClose} disabled={busy}>
            취소
          </Button>
          <Button
            variant="primary"
            size="md"
            className="flex-1 bg-violet-600 hover:bg-violet-700 focus-visible:ring-violet-500"
            onClick={handleGenerate}
            disabled={busy || !!blocked}
          >
            {busy ? <><Spinner /> 만드는 중...</> : '✨ 레시피 만들기'}
          </Button>
        </div>

        {busy && (
          <p className="text-center text-xs text-stone-400">
            AI 가 재료를 보고 레시피를 쓰는 중입니다. 보통 5~15초 걸려요.
          </p>
        )}
      </div>
    </Modal>
  );
}

function RecipesPage() {
  const { recipes, recipeStats, favorites, toggleFavorite, aiEnabled } = useFridge();
  const [query, setQuery] = useState('');
  const [tag, setTag] = useState('전체');
  const [onlyCookable, setOnlyCookable] = useState(false);
  const [onlyFavorite, setOnlyFavorite] = useState(false);
  const [onlyAi, setOnlyAi] = useState(false);
  const [aiOpen, setAiOpen] = useState(false);

  const allTags = useMemo(() => {
    const s = new Set();
    recipes.forEach((r) => r.tags.forEach((t) => s.add(t)));
    return Array.from(s);
  }, [recipes]);

  const filtered = useMemo(() => {
    return recipes
      .filter((r) => {
        const q = query.trim().toLowerCase();
        const okQuery =
          !q ||
          r.name.toLowerCase().includes(q) ||
          r.items.some((it) => it.name.toLowerCase().includes(q));
        const okTag = tag === '전체' || r.tags.includes(tag);
        const okCookable = !onlyCookable || recipeStats[r.id].rate === 100;
        const okFav = !onlyFavorite || favorites.includes(r.id);
        const okAi = !onlyAi || r.aiGenerated;
        return okQuery && okTag && okCookable && okFav && okAi;
      })
      .sort((a, b) => recipeStats[b.id].rate - recipeStats[a.id].rate);
  }, [recipes, recipeStats, query, tag, onlyCookable, onlyFavorite, onlyAi, favorites]);

  return (
    <PageShell
      title="레시피북"
      description="냉장고에 있는 재료와 얼마나 맞는지 함께 보여드려요"
      action={
        aiEnabled && (
          <Button
            variant="primary"
            size="md"
            className="bg-violet-600 hover:bg-violet-700 focus-visible:ring-violet-500"
            onClick={() => setAiOpen(true)}
          >
            ✨ AI 레시피 만들기
          </Button>
        )
      }
    >
      <Card className="p-4 mb-5">
        <div className="flex flex-col lg:flex-row gap-3">
          <div className="lg:max-w-xs w-full">
            <SearchInput value={query} onChange={(e) => setQuery(e.target.value)} placeholder="요리명 · 재료로 검색" />
          </div>
          <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
            <Chip active={tag === '전체'} onClick={() => setTag('전체')}>전체</Chip>
            {allTags.map((t) => (
              <Chip key={t} active={tag === t} onClick={() => setTag(t)}>#{t}</Chip>
            ))}
          </div>
        </div>
        <div className="mt-3 pt-3 border-t border-stone-100 flex flex-wrap items-center gap-2">
          <Chip active={onlyCookable} onClick={() => setOnlyCookable((v) => !v)}>✅ 지금 바로 가능한 것만</Chip>
          <Chip active={onlyFavorite} onClick={() => setOnlyFavorite((v) => !v)}>⭐ 즐겨찾기만</Chip>
          <Chip active={onlyAi} onClick={() => setOnlyAi((v) => !v)}>✨ AI 생성만</Chip>
          <span className="ml-auto text-xs font-bold text-stone-400">{filtered.length}개의 레시피</span>
        </div>
      </Card>

      {filtered.length === 0 ? (
        <Card className="p-4">
          <EmptyState
            icon="📖"
            title="조건에 맞는 레시피가 없어요"
            description="필터를 풀거나 다른 재료로 검색해 보세요."
            action={
              <Button
                variant="secondary"
                onClick={() => { setQuery(''); setTag('전체'); setOnlyCookable(false); setOnlyFavorite(false); setOnlyAi(false); }}
              >
                필터 초기화
              </Button>
            }
          />
        </Card>
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map((r) => (
            <RecipeCard
              key={r.id}
              recipe={r}
              stat={recipeStats[r.id]}
              favorite={favorites.includes(r.id)}
              onToggleFavorite={toggleFavorite}
            />
          ))}
        </div>
      )}

      <AiRecipeModal isOpen={aiOpen} onClose={() => setAiOpen(false)} />
    </PageShell>
  );
}

            ) : (
              <div className="mt-4 px-3 py-3 rounded-xl bg-emerald-50 text-center">
                <p className="text-sm font-bold text-emerald-700">재료가 모두 있어요. 바로 만들 수 있습니다!</p>
              </div>
            )}
          </Card>
        </div>

        {/* 우: 조리 순서 */}
        <div className="lg:col-span-2">
          <Card className="p-5">
            <div className="flex items-center justify-between mb-4">
              <div>
                <h2 className="font-extrabold text-stone-800">👨‍🍳 조리 순서</h2>
                <p className="text-xs text-stone-400 mt-0.5">단계를 눌러 완료 표시할 수 있어요</p>
              </div>
              <Badge tone="info">{checked.length}/{recipe.steps.length} 완료</Badge>
            </div>

            <ol className="space-y-3">
              {recipe.steps.map((step, idx) => {
                const done = checked.includes(idx);
                return (
                  <li key={idx}>
                    <button
                      onClick={() => toggleStep(idx)}
                      aria-pressed={done}
                      className={`w-full flex items-start gap-3 text-left px-4 py-3.5 rounded-xl border transition-all
                        ${done
                          ? 'bg-emerald-50 border-emerald-200'
                          : 'bg-white border-stone-200 hover:border-stone-300 hover:bg-stone-50'}`}
                    >
                      <span className={`w-7 h-7 shrink-0 grid place-items-center rounded-lg text-xs font-extrabold
                        ${done ? 'bg-emerald-600 text-white' : 'bg-stone-100 text-stone-500'}`}>
                        {done ? '✓' : idx + 1}
                      </span>
                      <span className={`text-sm leading-relaxed ${done ? 'text-emerald-800 line-through decoration-emerald-400' : 'text-stone-700'}`}>
                        {step}
                      </span>
                    </button>
                  </li>
                );
              })}
            </ol>

            <div className="mt-5 pt-5 border-t border-stone-100 flex flex-wrap gap-2">
              <Button
                variant="primary"
                size="md"
                onClick={() => { setChecked(recipe.steps.map((_, i) => i)); notify('요리 완료! 맛있게 드세요 🍽'); }}
              >
                요리 완료 표시
              </Button>
              <Button variant="ghost" size="md" onClick={() => setChecked([])}>초기화</Button>
            </div>
          </Card>
        </div>
      </div>

      <Modal isOpen={confirmDelete} onClose={() => setConfirmDelete(false)} title="레시피 삭제" size="sm">
        <p className="text-sm text-stone-600 leading-relaxed">
          <strong className="text-stone-800">{recipe.name}</strong> 을(를) 삭제할까요?
          즐겨찾기도 함께 지워지고 되돌릴 수 없습니다.
        </p>
        <div className="flex gap-2 mt-5">
          <Button variant="secondary" size="md" className="flex-1" onClick={() => setConfirmDelete(false)}>
            취소
          </Button>
          <Button
            variant="danger"
            size="md"
            className="flex-1"
            onClick={async () => {
              const ok = await removeRecipe(recipe.id);
              setConfirmDelete(false);
              if (ok) navigate('/recipes');
            }}
          >
            삭제
          </Button>
        </div>
      </Modal>
    </PageShell>
  );
}

function ShoppingPage() {
  const { shopping, toggleShopping, removeShopping, clearDoneShopping, addShoppingManual } = useFridge();
  const [draft, setDraft] = useState('');

  const pending = shopping.filter((s) => !s.done);
  const done = shopping.filter((s) => s.done);
  const progress = shopping.length === 0 ? 0 : Math.round((done.length / shopping.length) * 100);

  const handleAdd = () => {
    const name = draft.trim();
    if (!name) return;
    addShoppingManual(name);
    setDraft('');
  };

  const Row = ({ item }) => (
    <li className="flex items-center gap-3 px-4 py-3 rounded-xl border border-stone-200 bg-white hover:border-stone-300 transition-colors">
      <button
        onClick={() => toggleShopping(item.id)}
        aria-label={`${item.name} ${item.done ? '구매 취소' : '구매 완료'}`}
        aria-pressed={item.done}
        className={`w-6 h-6 shrink-0 grid place-items-center rounded-md border-2 text-xs transition-all
          ${item.done ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-stone-300 text-transparent hover:border-emerald-500'}`}
      >
        ✓
      </button>
      <div className="min-w-0 flex-1">
        <p className={`text-sm font-bold truncate ${item.done ? 'text-stone-400 line-through' : 'text-stone-800'}`}>
          {item.name}
        </p>
        <p className="text-xs text-stone-400 truncate">{item.qty} · {item.source}에서 추가</p>
      </div>
      <button
        onClick={() => removeShopping(item.id)}
        aria-label={`${item.name} 삭제`}
        className="w-7 h-7 shrink-0 grid place-items-center rounded-lg text-stone-300 hover:bg-rose-50 hover:text-rose-500 transition-colors"
      >
        ✕
      </button>
    </li>
  );

  return (
    <PageShell
      title="장보기 목록"
      description="레시피에서 부족했던 재료가 자동으로 모입니다"
      action={
        done.length > 0 && (
          <Button variant="secondary" size="md" onClick={clearDoneShopping}>
            구매 완료 {done.length}개 정리
          </Button>
        )
      }
    >
      <div className="grid lg:grid-cols-3 gap-4 sm:gap-6">
        <div className="lg:col-span-2 space-y-5">
          <Card className="p-4">
            <div className="flex gap-2">
              <Input
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') handleAdd(); }}
                placeholder="직접 추가할 항목 (예: 된장 1통)"
              />
              <Button variant="primary" size="md" className="shrink-0" onClick={handleAdd}>담기</Button>
            </div>
          </Card>

          <Card className="p-5">
            <h2 className="font-extrabold text-stone-800 mb-3">🛒 살 것 ({pending.length})</h2>
            {pending.length === 0 ? (
              <EmptyState icon="🎉" title="살 게 없어요" description="장보기 목록을 모두 비웠습니다." />
            ) : (
              <ul className="space-y-2">
                {pending.map((item) => <Row key={item.id} item={item} />)}
              </ul>
            )}
          </Card>

          {done.length > 0 && (
            <Card className="p-5">
              <h2 className="font-extrabold text-stone-400 mb-3">✅ 구매 완료 ({done.length})</h2>
              <ul className="space-y-2 opacity-70">
                {done.map((item) => <Row key={item.id} item={item} />)}
              </ul>
            </Card>
          )}
        </div>

        <div className="space-y-4">
          <Card className="p-5">
            <h2 className="font-extrabold text-stone-800 mb-1">진행률</h2>
            <p className="text-xs text-stone-400 mb-4">{shopping.length}개 중 {done.length}개 완료</p>
            <p className="text-4xl font-extrabold text-stone-800 mb-3 tabular-nums">{progress}<span className="text-lg text-stone-400">%</span></p>
            <ProgressBar value={progress} tone={progress === 100 ? 'brand' : 'warning'} />
          </Card>

          <Card className="p-5 bg-emerald-50/60 border-emerald-100">
            <h2 className="font-extrabold text-emerald-800 mb-2">💡 장보기 팁</h2>
            <ul className="space-y-2 text-xs text-emerald-800/80 leading-relaxed list-disc list-inside">
              <li>유통기한 임박 재료부터 소비할 레시피를 고르면 장볼 양이 줄어요.</li>
              <li>양념류는 한 번 사면 오래 쓰니 남은 양을 먼저 확인하세요.</li>
              <li>구매 후 <Link to="/ingredients" className="font-bold underline">재료 넣기</Link>로 바로 등록해 두면 기한 관리가 쉬워집니다.</li>
            </ul>
          </Card>
        </div>
      </div>
    </PageShell>
  );
}

function NotFoundPage() {
  return (
    <PageShell title="페이지를 찾을 수 없어요">
      <Card className="p-4">
        <EmptyState
          icon="🧭"
          title="잘못된 주소입니다"

function Footer() {
  return (
    <footer className="hidden sm:block border-t border-stone-200 bg-white/60">
      <div className="max-w-6xl mx-auto px-6 py-6 text-center text-xs text-stone-400">
        우리집 냉장고 · 재료 &amp; 레시피 관리 — Express + Supabase PostgreSQL 에 실제로 저장됩니다.

// ========================================
// 🔐 Auth Pages — 로그인 · 회원가입
// ========================================
/** 로그인·회원가입이 공유하는 가운데 정렬 카드 레이아웃 */
function AuthShell({ title, description, children, footer }) {
  return (
    <div className="min-h-screen bg-stone-100 flex flex-col items-center justify-center px-4 py-10">
      <div className="w-full max-w-md">
        <div className="text-center mb-6">
          <span className="inline-grid place-items-center w-14 h-14 rounded-2xl bg-emerald-600 text-white text-2xl shadow-sm">🧊</span>
          <h1 className="mt-3 text-2xl font-extrabold text-stone-800 tracking-tight">{title}</h1>
          <p className="mt-1.5 text-sm text-stone-500">{description}</p>
        </div>

        <Card className="p-6 animate-fade-up">{children}</Card>

        <p className="mt-5 text-center text-sm text-stone-500">{footer}</p>
      </div>
    </div>
  );
}

/** 폼 위에 뜨는 빨간 오류 박스 */
function AuthError({ message }) {
  if (!message) return null;
  return (
    <div role="alert" className="mb-4 px-3.5 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-sm font-semibold text-rose-700">
      {message}
    </div>
  );
}

function LoginPage() {
  const { login, expiredMsg } = useAuth();
  const { navigate } = useRouter();
  const [form, setForm] = useState({ email: '', password: '' });
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (busy) return;

    if (!form.email.trim() || !form.password) {
      setError('이메일과 비밀번호를 모두 입력해 주세요');
      return;
    }

    setBusy(true);
    setError('');
    try {
      await login(form.email.trim(), form.password);
      navigate('/');   // 로그인 성공 → 대시보드
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <AuthShell
      title="우리집 냉장고"
      description="로그인하면 내 재료와 레시피만 보여요"
      footer={<>아직 계정이 없나요? <Link to="/signup" className="font-bold text-emerald-700 hover:underline">회원가입</Link></>}
    >
      <AuthError message={error || expiredMsg} />

      <form onSubmit={handleSubmit} className="space-y-4">
        <Input
          label="이메일"
          type="email"
          value={form.email}
          onChange={set('email')}
          placeholder="you@example.com"
          autoComplete="email"
          disabled={busy}
        />
        <Input
          label="비밀번호"
          type="password"
          value={form.password}
          onChange={set('password')}
          placeholder="비밀번호"
          autoComplete="current-password"
          disabled={busy}
        />
        <Button type="submit" variant="primary" size="md" className="w-full" disabled={busy}>
          {busy ? <><Spinner /> 로그인 중...</> : '로그인'}
        </Button>
      </form>
    </AuthShell>
  );
}

function SignupPage() {
  const { signup } = useAuth();
  const { navigate } = useRouter();
  const [form, setForm] = useState({ email: '', nickname: '', password: '', confirm: '' });
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (busy) return;

    // 서버도 같은 규칙으로 다시 검사한다. 여기 검사는 왕복을 아끼기 위한 것
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) {
      setError('올바른 이메일 형식이 아니에요');
      return;
    }
    if (!form.nickname.trim()) {
      setError('닉네임을 입력해 주세요');
      return;
    }
    if (form.password.length < 8) {
      setError('비밀번호는 8자 이상으로 입력해 주세요');
      return;
    }
    if (form.password !== form.confirm) {
      setError('비밀번호가 서로 달라요');
      return;
    }

    setBusy(true);
    setError('');
    try {
      await signup(form.email.trim(), form.nickname.trim(), form.password);
      navigate('/');   // 가입 성공 → 바로 로그인된 상태로 대시보드
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <AuthShell
      title="회원가입"
      description="가입하면 예시 재료와 레시피가 담긴 내 냉장고가 만들어져요"
      footer={<>이미 계정이 있나요? <Link to="/login" className="font-bold text-emerald-700 hover:underline">로그인</Link></>}
    >
      <AuthError message={error} />

      <form onSubmit={handleSubmit} className="space-y-4">
        <Input
          label="이메일"
          type="email"
          value={form.email}
          onChange={set('email')}
          placeholder="you@example.com"
          autoComplete="email"
          disabled={busy}
        />
        <Input
          label="닉네임"
          value={form.nickname}
          onChange={set('nickname')}
          placeholder="화면에 보여줄 이름"
          maxLength={20}
          autoComplete="nickname"
          disabled={busy}
        />
        <Input
          label="비밀번호"
          type="password"
          value={form.password}
          onChange={set('password')}
          placeholder="8자 이상"
          autoComplete="new-password"
          disabled={busy}
        />
        <Input
          label="비밀번호 확인"
          type="password"
          value={form.confirm}
          onChange={set('confirm')}
          placeholder="한 번 더 입력"
          autoComplete="new-password"
          disabled={busy}
        />
        <Button type="submit" variant="primary" size="md" className="w-full" disabled={busy}>
          {busy ? <><Spinner /> 가입 중...</> : '가입하고 시작하기'}
        </Button>
      </form>
    </AuthShell>
  );
}

// ========================================
// 🚀 App Component
// ========================================
function LoadingScreen() {
  return (
    <div className="min-h-screen grid place-items-center px-4">
      <div className="text-center">
        <div className="text-5xl mb-4 animate-pulse" aria-hidden="true">🧊</div>
        <p className="text-sm font-bold text-stone-600">냉장고를 여는 중...</p>
        <p className="mt-1 text-xs text-stone-400">서버에서 재료와 레시피를 불러오고 있어요</p>
      </div>
    </div>
  );
}

/** 저장된 토큰이 아직 유효한지 확인하는 동안 잠깐 보이는 화면 */
function AuthLoadingScreen() {
  return (
    <div className="min-h-screen grid place-items-center px-4">
      <div className="text-center">
        <div className="text-5xl mb-4 animate-pulse" aria-hidden="true">🔐</div>
        <p className="text-sm font-bold text-stone-600">로그인 정보를 확인하는 중...</p>
      </div>
    </div>
  );
}

function ErrorScreen({ message, onRetry }) {
  return (
    <div className="min-h-screen grid place-items-center px-4">
      <Card className="max-w-md w-full p-6 text-center">
        <div className="text-5xl mb-3" aria-hidden="true">🔌</div>
        <h1 className="text-lg font-extrabold text-stone-800">서버에 연결하지 못했어요</h1>
        <p className="mt-2 text-sm text-stone-500 break-words">{message}</p>
        <p className="mt-3 text-xs text-stone-400">
          <code className="px-1.5 py-0.5 rounded bg-stone-100">node server.js</code> 가 실행 중인지,
          <code className="ml-1 px-1.5 py-0.5 rounded bg-stone-100">.env</code> 의 DATABASE_URL 이 올바른지 확인해 주세요.
        </p>
        <Button variant="primary" size="md" className="mt-5 w-full" onClick={onRetry}>다시 시도</Button>
      </Card>
    </div>
  );
}

/** 서버 데이터가 준비된 뒤에만 실제 화면을 그린다 */
function AppContent() {
  const { loading, loadError, reload } = useFridge();

  if (loading) return <LoadingScreen />;
  if (loadError) return <ErrorScreen message={loadError} onRetry={reload} />;

  return (
    <div className="min-h-screen flex flex-col">
      <Header />
      <div className="flex-1">
        <Routes>
          <Route path="/" element={<DashboardPage />} />
          <Route path="/ingredients" element={<IngredientsPage />} />
          <Route path="/recipes" element={<RecipesPage />} />
          <Route path="/recipes/:id" element={<RecipeDetailPage />} />
          <Route path="/shopping" element={<ShoppingPage />} />
          <Route path="*" element={<NotFoundPage />} />
        </Routes>
      </div>
      <Footer />
      <BottomNav />
    </div>
  );
}

/**
 * 로그인 여부에 따라 보여줄 화면을 가른다.
 * 로그인 전에는 FridgeProvider 를 아예 마운트하지 않아서 /api/bootstrap 요청이 나가지 않는다
 */
function AuthGate() {
  const { ready, user } = useAuth();
  const { path, navigate } = useRouter();

  // 로그인한 사람이 /login · /signup 에 남아 있으면 대시보드로 보낸다
  useEffect(() => {
    if (user && (path === '/login' || path === '/signup')) navigate('/');
  }, [user, path, navigate]);

  if (!ready) return <AuthLoadingScreen />;

  if (!user) {
    return (
      <Routes>
        <Route path="/signup" element={<SignupPage />} />
        <Route path="*" element={<LoginPage />} />
      </Routes>
    );
  }

  return (
    <FridgeProvider>
      <AppContent />
    </FridgeProvider>
  );
}

function App() {
  return (
    <Router>
      <AuthProvider>
        <AuthGate />
      </AuthProvider>
    </Router>
  );
}

// ========================================
// Rendering

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
