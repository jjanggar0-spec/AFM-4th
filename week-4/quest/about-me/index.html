    const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

    // ========================================
    // 📡 API
    // ========================================
    const API_BASE_URL = '/api';
    const ADMIN_KEY_STORAGE = 'about-me-admin-password';

    async function apiRequest(endpoint, { method = 'GET', body, headers = {} } = {}) {
      let res;
      try {
        res = await fetch(`${API_BASE_URL}${endpoint}`, {
          method,
          headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...headers },
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch {
        throw Object.assign(new Error('서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해 주세요.'), { status: 0 });
      }
      const json = await res.json().catch(() => null);
      if (!res.ok || !json?.success) {
        throw Object.assign(new Error(json?.message || `요청에 실패했습니다. (${res.status})`), { status: res.status });
      }
      return json.data;
    }

    // 2026. 9. 14. 오후 3:22 형태 (한국 시간)
    const formatReceivedAt = (value) =>
      new Date(value).toLocaleString('ko-KR', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric',
        weekday: 'short', hour: '2-digit', minute: '2-digit',
      });

    function timeAgo(value) {
      const sec = Math.floor((Date.now() - new Date(value).getTime()) / 1000);
      if (sec < 60) return '방금 전';
      if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
      if (sec < 86400) return `${Math.floor(sec / 3600)}시간 전`;
      if (sec < 86400 * 30) return `${Math.floor(sec / 86400)}일 전`;
      return formatReceivedAt(value);
    }

    function useReveal() {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); io.disconnect(); }
        }, { threshold: 0.15 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return [ref, visible];
    }

    function useActiveSection(ids) {
      const [active, setActive] = useState(ids[0]);
      useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
        }, { rootMargin: '-45% 0px -50% 0px' });
        ids.forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
        return () => io.disconnect();
      }, [ids]);
      return active;
    }

    function useScrollProgress() {
      const [progress, setProgress] = useState(0);
      useEffect(() => {
        const onScroll = () => {
          const max = document.documentElement.scrollHeight - window.innerHeight;
          setProgress(max > 0 ? window.scrollY / max : 0);
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        return () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('resize', onScroll);
        };
      }, []);
      return progress;
    }

    const RouterContext = createContext({ path: '/', params: {}, navigate: () => {} });

    // '#/admin' → '/admin'. '#main' 같은 일반 앵커는 홈으로 본다
    const getPath = () => {
      const hash = window.location.hash;
      return hash.startsWith('#/') ? hash.slice(1).split('?')[0] || '/' : '/';
    };

    function matchRoute(pattern, path) {
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('/').filter(Boolean);
      if (pattern === '*') return {};
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getPath);
      useEffect(() => {
        const onHashChange = () => {
          const next = getPath();
          setPath((prev) => {
            if (prev !== next) window.scrollTo(0, 0);
            return next;
          });
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, params: {}, navigate }}>{children}</RouterContext.Provider>;
    }

    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    function Route() { return null; }

    function Routes({ children }) {
      const router = useRouter();
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) {
          return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
        }
      }
      return null;
    }

              </Reveal>
              <Reveal delay={240} className="mt-8 flex flex-wrap gap-3">
                <Button size="lg" onClick={() => scrollToId('hello')}>이야기 읽기 ↓</Button>
                <Button size="lg" variant="secondary" onClick={() => scrollToId('summary')}>한 줄 요약</Button>
              </Reveal>
            </div>

            <Reveal delay={200} className="md:col-span-6">
              <figure className="relative">
                <div className="absolute -inset-3 rounded-[2rem] bg-fairway-100 rotate-2" aria-hidden="true" />
                <img
                  src={PHOTO_SRC}
                  alt="필드에서 아이언 샷을 치는 이태훈"
                  className="relative w-full aspect-[4/3] object-cover rounded-[1.75rem] shadow-xl"
                />
                <figcaption className="absolute -bottom-5 left-5 rounded-full bg-paper px-4 py-2 text-sm shadow-md ring-1 ring-ink/10">
                  ⛳ 주말 아침, 첫 티샷 이후
                </figcaption>
              </figure>
            </Reveal>
          </div>

          <div className="mx-auto max-w-6xl px-4 sm:px-6 pb-14">
            <dl className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
              {PROFILE.facts.map((f, i) => (
                <Reveal key={f.label} delay={i * 70}>
                  <Card className="h-full !p-5">
                    <dt className="text-xs text-ink/50">{f.label}</dt>
                    <dd className="mt-1 font-serif text-lg sm:text-xl font-bold">{f.value}</dd>
                  </Card>
                </Reveal>
              ))}
            </dl>
          </div>
        </section>
      );
    }

    function Timeline() {
      return (
        <section aria-labelledby="timeline-title" className="bg-ink text-paper">
          <div className="mx-auto max-w-6xl px-4 sm:px-6 py-14">
            <h2 id="timeline-title" className="text-sm tracking-[.25em] text-clay-400 font-medium">TIMELINE</h2>
            <ol className="mt-8 grid gap-8 sm:grid-cols-2 lg:grid-cols-4">
              {TIMELINE.map((t, i) => (
                <Reveal as="li" key={t.year} delay={i * 90} className="relative pl-6 border-l border-paper/20">
                  <span className="absolute -left-[5px] top-2 h-2.5 w-2.5 rounded-full bg-clay-400" aria-hidden="true" />
                  <p className="font-serif text-3xl font-bold">{t.year}</p>
                  <p className="mt-1 text-paper/70">{t.text}</p>
                </Reveal>
              ))}
            </ol>
          </div>
        </section>
      );
    }

    function StorySection({ section, index }) {
      const { id, icon, kicker, title, paragraphs, quote, chips, stat, principles, photo, tone } = section;
      const num = String(index + 1).padStart(2, '0');
      const accent = tone === 'clay' ? 'text-clay-500' : 'text-fairway-600';
      const alt = index % 2 === 1;

      return (
        <section id={id} aria-labelledby={`${id}-title`} className={`scroll-mt-14 ${alt ? 'bg-white/40' : ''}`}>
          <div className="mx-auto max-w-6xl px-4 sm:px-6 py-16 md:py-24 grid gap-10 md:grid-cols-12">
            {/* 좌측: 번호 + 제목 */}
            <div className="md:col-span-4">
              <div className="md:sticky md:top-24">
                <Reveal>
                  <p className={`font-serif text-6xl md:text-7xl font-black ${accent} opacity-90`} aria-hidden="true">{num}</p>
                </Reveal>
                <Reveal delay={80}>
                  {kicker && <Badge tone={tone} className="mt-4">{kicker}</Badge>}
                  <h2 id={`${id}-title`} className="mt-3 font-serif text-3xl sm:text-4xl font-bold leading-tight">
                    <span className="mr-2" aria-hidden="true">{icon}</span>{title}
                  </h2>
                </Reveal>
                {tone === 'clay' && <div className="stitch mt-6 w-24" aria-hidden="true" />}
              </div>
            </div>

            {/* 우측: 본문 */}
            <div className="md:col-span-8 space-y-7">
              {paragraphs.map((p, i) => (
                <Reveal key={i} delay={i * 60}>
                  <p className="text-[17px] sm:text-lg leading-[1.95] text-ink/85">{p}</p>
                </Reveal>
              ))}

              {chips && (
                <Reveal className="flex flex-wrap gap-2">
                  {chips.map((c) => <Badge key={c} tone={tone} className="!text-sm !px-4 !py-1.5">{c}</Badge>)}
                </Reveal>
              )}

              {principles && (
                <Reveal className="grid gap-3 sm:grid-cols-3">
                  {principles.map((pr) => (
                    <Card key={pr.what} className="!p-5 text-center">
                      <p className="text-sm text-ink/50">{pr.what}</p>
                      <p className="mt-2 font-serif text-lg font-semibold leading-snug">{pr.how}</p>
                    </Card>
                  ))}
                </Reveal>
              )}

              {(stat || photo) && (
                <Reveal className="grid gap-4 sm:grid-cols-5 items-stretch">
                  {stat && (
                    <Card className={`${photo ? 'sm:col-span-2' : 'sm:col-span-5'} flex flex-col justify-center`}>
                      <p className={`font-serif text-5xl font-black ${accent}`}>{stat.value}</p>
                      <p className="mt-2 text-sm text-ink/60">{stat.label}</p>
                    </Card>
                  )}
                  {photo && (
                    <img
                      src={PHOTO_SRC}
                      alt="잔디 위에서 스윙을 마무리하는 모습"
                      loading="lazy"
                      className="sm:col-span-3 w-full h-56 sm:h-full object-cover object-[50%_40%] rounded-2xl shadow-md"
                    />
                  )}
                </Reveal>
              )}

              {quote && (
                <Reveal className="pt-2">
                  <PullQuote tone={tone}>{quote}</PullQuote>
                </Reveal>
              )}
            </div>
          </div>
        </section>
      );
    }

    function Summary() {
      return (
        <section id="summary" aria-labelledby="summary-title" className="scroll-mt-14 bg-fairway-900 text-paper">
          <div className="mx-auto max-w-4xl px-4 sm:px-6 py-20 md:py-28 text-center">
            <Reveal>
              <h2 id="summary-title" className="text-sm tracking-[.25em] text-clay-400 font-medium">한 줄 요약</h2>
            </Reveal>
            <Reveal delay={100}>
              <p className="mt-6 font-serif text-2xl sm:text-3xl md:text-4xl leading-snug font-semibold">
                {PROFILE.summary}
              </p>
            </Reveal>
            <Reveal delay={200} className="mt-10 flex flex-wrap justify-center gap-2">
              {['1968년생', '이안과 행정원장', '⚾ 야구', '⛳ 골프', '💍 1999년부터 둘이서'].map((t) => (
                <span key={t} className="rounded-full border border-paper/25 px-4 py-1.5 text-sm text-paper/80">{t}</span>
              ))}
            </Reveal>
          </div>
        </section>
      );
    }

    const CONTENT_MAX = 2000;
    const CONTENT_MIN = 5;
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const EMPTY_FORM = { name: '', email: '', content: '' };

    function validateMessage({ name, email, content }) {
      const errors = {};
      if (!name.trim()) errors.name = '이름을 입력해 주세요.';
      if (!EMAIL_RE.test(email.trim())) errors.email = '올바른 이메일을 입력해 주세요.';
      if (content.trim().length < CONTENT_MIN) errors.content = `내용을 ${CONTENT_MIN}자 이상 입력해 주세요.`;
      return errors;
    }

    function ContactSection() {
      const [form, setForm] = useState(EMPTY_FORM);
      const [errors, setErrors] = useState({});
      const [status, setStatus] = useState('idle'); // idle | sending | sent | error
      const [serverError, setServerError] = useState('');
      const [sent, setSent] = useState(null);

      const update = (field) => (e) => {
        setForm((f) => ({ ...f, [field]: e.target.value }));
        if (errors[field]) setErrors((er) => ({ ...er, [field]: undefined }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const found = validateMessage(form);
        setErrors(found);
        if (Object.keys(found).length) {
          document.getElementById(`contact-${Object.keys(found)[0]}`)?.focus();
          return;
        }
        setStatus('sending');
        setServerError('');
        try {
          const data = await apiRequest('/messages', { method: 'POST', body: form });
          setSent(data);
          setForm(EMPTY_FORM);
          setStatus('sent');
        } catch (err) {
          setServerError(err.message);
          setStatus('error');
        }
      };

      const sending = status === 'sending';

      return (
        <section id="contact" aria-labelledby="contact-title" className="scroll-mt-14">
          <div className="mx-auto max-w-6xl px-4 sm:px-6 py-16 md:py-24 grid gap-10 md:grid-cols-12">
            <div className="md:col-span-4">
              <Reveal>
                <p className="font-serif text-6xl md:text-7xl font-black text-clay-500 opacity-90" aria-hidden="true">✉</p>
                <Badge tone="clay" className="mt-4">편하게 연락 주세요</Badge>
                <h2 id="contact-title" className="mt-3 font-serif text-3xl sm:text-4xl font-bold leading-tight">문의하기</h2>
                <p className="mt-4 leading-relaxed text-ink/70">
                  병원 행정 이야기든, 야구나 골프 이야기든 좋습니다.
                  남겨 주신 글은 꼼꼼히 읽고 이메일로 답장드리겠습니다.
                </p>
              </Reveal>
            </div>

            <div className="md:col-span-8">
              <Reveal>
                <Card className="sm:!p-8">
                  {status === 'sent' && sent ? (
                    <div className="py-6 text-center" role="status">
                      <p className="text-5xl" aria-hidden="true">⛳</p>
                      <h3 className="mt-4 font-serif text-2xl font-bold">문의가 잘 전달되었습니다</h3>
                      <p className="mt-2 text-ink/70">{sent.name}님, 소중한 글 감사합니다.</p>
                      <p className="mt-1 text-sm text-ink/50">접수 시각 · {formatReceivedAt(sent.receivedAt)}</p>
                      <Button variant="secondary" className="mt-6" onClick={() => { setStatus('idle'); setSent(null); }}>
                        새 문의 작성
                      </Button>
                    </div>
                  ) : (
                    <form onSubmit={handleSubmit} noValidate className="space-y-5">
                      <div className="grid gap-5 sm:grid-cols-2">
                        <Input id="contact-name" label="이름" required value={form.name} onChange={update('name')}
                          placeholder="홍길동" autoComplete="name" maxLength={50} error={errors.name} disabled={sending} />
                        <Input id="contact-email" type="email" label="이메일" required value={form.email} onChange={update('email')}
                          placeholder="you@example.com" autoComplete="email" maxLength={100} error={errors.email} disabled={sending} />
                      </div>
                      <Textarea id="contact-content" label="내용" required value={form.content} onChange={update('content')}
                        placeholder="하고 싶은 이야기를 적어 주세요." maxLength={CONTENT_MAX} error={errors.content} disabled={sending} />
                      {status === 'error' && <Alert>{serverError}</Alert>}
                      <div className="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <p className="text-xs text-ink/45">보내 주신 이름·이메일은 답장에만 사용합니다.</p>
                        <Button type="submit" size="lg" disabled={sending} className="w-full sm:w-auto">
                          {sending ? <><Spinner /> 보내는 중…</> : '문의 보내기'}
                        </Button>
                      </div>
                    </form>
                  )}
                </Card>
              </Reveal>
            </div>
          </div>
        </section>
      );
    }

    function AdminLogin({ onSubmit, error, loading }) {
      const [password, setPassword] = useState('');
      return (
        <Card className="mx-auto max-w-md sm:!p-8">
          <h2 className="font-serif text-2xl font-bold">관리자 확인</h2>
          <p className="mt-2 text-sm text-ink/60">문의 목록을 보려면 관리자 비밀번호를 입력하세요.</p>
          <form className="mt-6 space-y-4" onSubmit={(e) => { e.preventDefault(); if (password) onSubmit(password); }}>
            <Input id="admin-password" type="password" label="비밀번호" value={password}
              onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" autoFocus disabled={loading} />
            {error && <Alert>{error}</Alert>}
            <Button type="submit" size="lg" className="w-full" disabled={loading || !password}>
              {loading ? <><Spinner /> 확인 중…</> : '목록 보기'}
            </Button>
          </form>
        </Card>
      );
    }

    function MessageItem({ message, isNew }) {
      const [open, setOpen] = useState(false);
      const long = message.content.length > 160 || message.content.split('\n').length > 3;
      return (
        <li>
          <Card className="!p-5 sm:!p-6">
            <div className="flex flex-wrap items-start justify-between gap-x-4 gap-y-2">
              <div className="min-w-0">
                <p className="font-semibold text-ink">
                  {message.name}
                  {isNew && <Badge tone="clay" className="ml-2 align-middle">NEW</Badge>}
                </p>
                <a href={`mailto:${message.email}`} className="break-all text-sm text-fairway-700 hover:underline">{message.email}</a>
              </div>
              <div className="text-right text-sm">
                <time dateTime={message.receivedAt} className="block text-ink/70">{formatReceivedAt(message.receivedAt)}</time>
                <span className="text-xs text-ink/40">#{message.id} · {timeAgo(message.receivedAt)}</span>
              </div>
            </div>
            <p className={`mt-4 whitespace-pre-wrap break-words leading-relaxed text-ink/85 ${!open && long ? 'line-clamp-3' : ''}`}>
              {message.content}
            </p>
            {long && (
              <button type="button" onClick={() => setOpen((v) => !v)} aria-expanded={open}
                className="mt-2 text-sm font-medium text-fairway-700 hover:underline">
                {open ? '접기' : '전체 보기'}
              </button>
            )}
          </Card>
        </li>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    const SECTION_IDS = [...SECTIONS.map((s) => s.id), 'contact'];

    function HomePage() {
      const active = useActiveSection(SECTION_IDS);
      const progress = useScrollProgress();

      return (
        <>
          <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded focus:bg-ink focus:px-3 focus:py-2 focus:text-paper">
            본문으로 건너뛰기
          </a>
          <ProgressBar value={progress} />
          <Header active={active} />
          <main id="main">
            <Hero />
            <Timeline />
            {SECTIONS.map((s, i) => <StorySection key={s.id} section={s} index={i} />)}
            <Summary />
            <ContactSection />
          </main>
          <Footer />
        </>
      );
    }

    const readStoredKey = () => { try { return sessionStorage.getItem(ADMIN_KEY_STORAGE) || ''; } catch { return ''; } };
    const writeStoredKey = (v) => { try { v ? sessionStorage.setItem(ADMIN_KEY_STORAGE, v) : sessionStorage.removeItem(ADMIN_KEY_STORAGE); } catch {} };

    function AdminPage() {
      const [password, setPassword] = useState(readStoredKey);
      const [messages, setMessages] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [query, setQuery] = useState('');
      const [loadedAt, setLoadedAt] = useState(null);

      const load = useCallback(async (key) => {
        setLoading(true);
        setError('');
        try {
          const data = await apiRequest('/messages', { headers: { 'x-admin-password': key } });
          setMessages(data);
          setPassword(key);
          setLoadedAt(new Date());
          writeStoredKey(key);
        } catch (err) {
          if (err.status === 401) { setPassword(''); setMessages(null); writeStoredKey(''); }
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { if (password) load(password); }, []); // 저장된 비밀번호가 있으면 바로 조회

      const logout = () => { writeStoredKey(''); setPassword(''); setMessages(null); setError(''); };

      const q = query.trim().toLowerCase();
      const filtered = (messages || []).filter((m) =>
        !q || [m.name, m.email, m.content].some((v) => v.toLowerCase().includes(q))
      );
      const newCount = (messages || []).filter((m) => Date.now() - new Date(m.receivedAt) < 86400000).length;

      return (
        <>
          <header className="sticky top-0 z-40 border-b border-ink/10 bg-paper/85 backdrop-blur">
            <nav className="mx-auto flex h-14 max-w-4xl items-center justify-between px-4 sm:px-6" aria-label="관리자 메뉴">
              <Link to="/" className="font-serif text-lg font-bold tracking-tight">
                이태훈<span className="text-clay-500">.</span> <span className="ml-1 text-sm font-sans font-medium text-ink/50">관리자</span>
              </Link>
              <div className="flex items-center gap-1">
                {messages && <Button variant="ghost" size="sm" onClick={logout}>로그아웃</Button>}
                <Link to="/" className="rounded-full px-3 py-1.5 text-sm text-ink/60 hover:bg-ink/5 hover:text-ink">← 소개 페이지</Link>
              </div>
            </nav>
          </header>

          <main className="mx-auto max-w-4xl px-4 sm:px-6 py-10 md:py-14">
            <p className="text-sm font-medium tracking-[.25em] text-clay-600">ADMIN</p>
            <h1 className="mt-2 font-serif text-3xl sm:text-4xl font-bold">문의 목록</h1>

            {!messages ? (
              <div className="mt-10">
                {loading && password
                  ? <p className="flex items-center justify-center gap-2 py-16 text-ink/60"><Spinner /> 불러오는 중…</p>
                  : <AdminLogin onSubmit={load} error={error} loading={loading} />}
              </div>
            ) : (
              <>
                <div className="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3">
                  <Card className="!p-4"><p className="text-xs text-ink/50">전체 문의</p><p className="mt-1 font-serif text-2xl font-bold">{messages.length}건</p></Card>
                  <Card className="!p-4"><p className="text-xs text-ink/50">최근 24시간</p><p className="mt-1 font-serif text-2xl font-bold text-clay-500">{newCount}건</p></Card>
                  <Card className="!p-4 col-span-2 sm:col-span-1"><p className="text-xs text-ink/50">가장 최근 접수</p><p className="mt-1 text-sm font-medium">{messages[0] ? timeAgo(messages[0].receivedAt) : '-'}</p></Card>
                </div>

                <div className="mt-6 flex flex-col gap-3 sm:flex-row sm:items-end">
                  <Input id="admin-search" type="search" label="검색" className="flex-1" value={query}
                    onChange={(e) => setQuery(e.target.value)} placeholder="이름, 이메일, 내용으로 찾기" />
                  <Button variant="secondary" size="lg" onClick={() => load(password)} disabled={loading}>
                    {loading ? <><Spinner /> 새로고침</> : '↻ 새로고침'}
                  </Button>
                </div>
                <p className="mt-2 text-xs text-ink/45" aria-live="polite">
                  최신순 정렬 · {loadedAt && `${loadedAt.toLocaleTimeString('ko-KR')} 기준`}{q && ` · 검색 결과 ${filtered.length}건`}
                </p>

                {error && <div className="mt-4"><Alert>{error}</Alert></div>}

                {messages.length === 0 ? (
                  <Card className="mt-6 py-14 text-center">
                    <p className="text-4xl" aria-hidden="true">📭</p>
                    <p className="mt-3 font-medium">아직 받은 문의가 없습니다.</p>
                    <p className="mt-1 text-sm text-ink/50">소개 페이지의 문의하기 폼으로 들어온 글이 여기에 표시됩니다.</p>
                  </Card>
                ) : filtered.length === 0 ? (
                  <Card className="mt-6 py-10 text-center text-ink/60">“{query}”에 맞는 문의가 없습니다.</Card>
                ) : (
                  <ul className="mt-6 space-y-4">
                    {filtered.map((m) => (
                      <MessageItem key={m.id} message={m} isNew={Date.now() - new Date(m.receivedAt) < 86400000} />
                    ))}
                  </ul>
                )}
              </>
            )}
          </main>
        </>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      return (
        <Router>
          <Routes>
            <Route path="/admin" element={<AdminPage />} />
            <Route path="*" element={<HomePage />} />
          </Routes>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
