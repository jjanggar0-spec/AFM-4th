function Card({ children, className = "" }) {
  return (
    <div className={"bg-white rounded-2xl border border-slate-200 shadow-sm " + className}>
      {children}
    </div>
  );
}

function Badge({ children, tone = "slate", className = "" }) {
  const tones = {
    slate: "bg-slate-100 text-slate-700",
    green: "bg-emerald-100 text-emerald-800",
    red: "bg-rose-100 text-rose-700",
    amber: "bg-amber-100 text-amber-800",
    blue: "bg-blue-100 text-blue-800",
    violet: "bg-violet-100 text-violet-800",
  };
  return (
    <span className={"inline-block text-xs font-semibold px-2.5 py-1 rounded-full " + tones[tone] + " " + className}>
      {children}
    </span>
  );
}

function Button({ children, variant = "primary", size = "md", onClick, disabled, className = "" }) {
  const base = "inline-flex items-center justify-center rounded-lg font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-slate-900 text-white hover:bg-slate-700",
    secondary: "bg-white text-slate-700 border border-slate-300 hover:bg-slate-50",
    ghost: "text-slate-600 hover:bg-slate-100",
  };
  const sizes = { sm: "text-xs px-3 py-1.5", md: "text-sm px-4 py-2", lg: "text-base px-5 py-2.5" };
  return (
    <button className={[base, variants[variant], sizes[size], className].join(" ")} onClick={onClick} disabled={disabled}>
      {children}
    </button>
  );
}

function Section({ num, title, desc, children }) {
  return (
    <section className="mt-16">
      <div className="flex items-baseline gap-3">

      if (sortKey === "rating") return (b.rating || 0) - (a.rating || 0);
      return (b.reviews || 0) - (a.reviews || 0);

  const won = (n) => n.toLocaleString("ko-KR") + "원";

                  <td className="px-4 py-3 text-right tabular-nums whitespace-nowrap">
                    {r.rating ? "★ " + r.rating.toFixed(1) : <span className="text-slate-300">—</span>}
