    /* Tailwind 유틸리티로 표현이 어려운 부분만 커스텀 */
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble-in { animation: bubbleIn 0.28s cubic-bezier(0.22, 1, 0.36, 1); }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40%           { opacity: 1;    transform: translateY(-3px); }
    }
    .dot-1 { animation: blink 1.2s infinite 0s; }
    .dot-2 { animation: blink 1.2s infinite 0.18s; }
    .dot-3 { animation: blink 1.2s infinite 0.36s; }

    /* 스트리밍 중 커서 */
    @keyframes caret { 50% { opacity: 0; } }
    .caret::after {
      content: '▍';
      margin-left: 1px;
      animation: caret 1s step-end infinite;
    }

    /* 스크롤바 */
    .scroll-soft::-webkit-scrollbar { width: 8px; }
    .scroll-soft::-webkit-scrollbar-thumb { background: #d8d3ea; border-radius: 9999px; }
    .scroll-soft::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>

const CRISIS_WORDS = ['자살', '죽고싶', '자해', '살기싫', '사라지고싶', '끝내고싶'];

// ========================================
// 🛠 Utils
// ========================================
function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

function saveLS(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* quota 초과 등은 조용히 무시 */
  }
}

function formatTime(ts) {
  const d = new Date(ts);
  const h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const ampm = h < 12 ? '오전' : '오후';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `${ampm} ${hh}:${m}`;
}

function maskKey(key) {
  if (!key) return '미설정';
  if (key.length < 14) return '••••';
  return `${key.slice(0, 7)}••••••${key.slice(-4)}`;
}

function hasCrisisSignal(text) {
  const t = (text || '').replace(/\s/g, '');
  return CRISIS_WORDS.some((w) => t.includes(w));
}

function makeId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

// ========================================
// 🎨 Design System Components
// ========================================
function Button({
  variant = 'primary',
  size = 'md',
  disabled = false,
  type = 'button',
  className = '',
  children,
  ...rest
}) {
  const base =
    'inline-flex items-center justify-center gap-1.5 font-semibold rounded-xl transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-400 disabled:opacity-40 disabled:cursor-not-allowed';

  const variants = {
    primary: 'bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800 shadow-sm shadow-indigo-600/20',
    secondary: 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 active:bg-slate-100',
    danger: 'bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100',
    ghost: 'bg-transparent text-slate-500 hover:bg-slate-200/60 hover:text-slate-700',
  };

  const sizes = {
    sm: 'text-xs px-2.5 py-1.5',
    md: 'text-sm px-4 py-2.5',
    lg: 'text-base px-5 py-3',
  };

  return (
    <button
      type={type}
      disabled={disabled}
      className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
      {...rest}
    >
      {children}
    </button>
  );
}

function Input({ label, error, className = '', id, ...rest }) {
  const inputId = id || `input-${label || 'field'}`;
  return (
    <div className="w-full">
      {label && (
        <label htmlFor={inputId} className="block text-sm font-medium text-slate-700 mb-1.5">
          {label}
        </label>
      )}
      <input
        id={inputId}
        aria-invalid={!!error}
        className={`w-full rounded-xl border px-3.5 py-2.5 text-sm text-slate-800 placeholder-slate-400 transition focus:outline-none focus:ring-2 ${
          error
            ? 'border-rose-300 focus:ring-rose-300'
            : 'border-slate-200 focus:ring-indigo-300 focus:border-indigo-300'
        } ${className}`}
        {...rest}
      />
      {error && <p className="mt-1.5 text-xs text-rose-600">{error}</p>}
    </div>
  );
}

function Select({ label, value, onChange, options, id, className = '' }) {
  const selectId = id || `select-${label || 'field'}`;
  return (
    <div className="w-full">
      {label && (
        <label htmlFor={selectId} className="block text-sm font-medium text-slate-700 mb-1.5">
          {label}
        </label>
      )}
      <select
        id={selectId}
        value={value}
        onChange={onChange}
        className={`w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm text-slate-800 transition focus:outline-none focus:ring-2 focus:ring-indigo-300 ${className}`}
      >
        {options.map((opt) => (
          <option key={opt.value} value={opt.value}>
            {opt.label}
          </option>
        ))}
      </select>
    </div>
  );
}

function Card({ className = '', children }) {
  return (
    <div className={`bg-white rounded-2xl shadow-sm border border-slate-200/70 ${className}`}>
      {children}
    </div>
  );
}

function Modal({ isOpen, onClose, title, size = 'md', children, hideClose = false }) {
  useEffect(() => {
    if (!isOpen) return undefined;
    const onKey = (e) => {
      if (e.key === 'Escape' && !hideClose) onClose();
    };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [isOpen, onClose, hideClose]);

  if (!isOpen) return null;

  const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg' };

  return (
    <div
      className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-0 sm:p-4"
      role="dialog"
      aria-modal="true"
      aria-label={title}
      onClick={() => !hideClose && onClose()}
    >
      <div
        className={`w-full ${sizes[size]} bg-white rounded-t-3xl sm:rounded-2xl shadow-xl max-h-[90vh] overflow-y-auto scroll-soft`}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <h2 className="text-lg font-bold text-slate-800">{title}</h2>
          {!hideClose && (
            <button
              onClick={onClose}
              aria-label="닫기"
              className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          )}
        </div>
        <div className="px-5 pb-5">{children}</div>
      </div>
    </div>
  );
}

function MessageBubble({ message, mode, streaming = false }) {
  const isUser = message.role === 'user';

  if (message.role === 'error') {
    return (
      <div className="bubble-in mx-auto w-full max-w-2xl px-4">
        <div className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
          <span className="font-semibold">응답을 받지 못했어요.</span> {message.content}
        </div>
      </div>
    );
  }

  return (
    <div className={`bubble-in w-full max-w-2xl mx-auto px-4 flex gap-2.5 ${isUser ? 'flex-row-reverse' : ''}`}>
      {!isUser && (
        <div
          className={`mt-0.5 h-9 w-9 shrink-0 rounded-full bg-gradient-to-br ${mode.accent} flex items-center justify-center text-base shadow-sm`}
          aria-hidden="true"
        >
          {mode.emoji}
        </div>
      )}

      <div className={`flex flex-col gap-1 ${isUser ? 'items-end' : 'items-start'} max-w-[82%] sm:max-w-[75%]`}>
        {!isUser && <span className="px-1 text-[11px] font-medium text-slate-400">{mode.label} 상담사</span>}
        <div
          className={`whitespace-pre-wrap break-words rounded-2xl px-4 py-3 text-[15px] leading-relaxed shadow-sm ${
            isUser
              ? 'bg-indigo-600 text-white rounded-br-md'
              : 'bg-white text-slate-700 border border-slate-200/80 rounded-bl-md'
          }`}
        >
          {streaming && !message.content ? (
            <TypingDots />
          ) : (
            <span className={streaming ? 'caret' : ''}>{message.content}</span>
          )}
        </div>
        <span className="px-1 text-[10px] text-slate-400">{formatTime(message.ts)}</span>
      </div>
    </div>
  );
}

function ModePicker({ mode, onChange, disabled }) {

          <button

            role="radio"

            disabled={disabled}
            onClick={() => onChange(m)}
            title={m.desc}
            className={`shrink-0 rounded-full px-3.5 py-1.5 text-xs font-semibold transition disabled:opacity-40 ${
              active
                ? `bg-gradient-to-r ${m.accent} text-white shadow-sm`

}

function Header({ mode, onModeChange, onOpenSettings, onReset, busy, hasMessages }) {

                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.35.42.63.77.77H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </Button>
          </div>
        </div>

        <div className="mt-3">
          <ModePicker mode={mode} onChange={onModeChange} disabled={busy} />
        </div>
      </div>
    </header>
  );
}

function EmptyState({ mode, onPick, disabled }) {
  return (
    <div className="mx-auto w-full max-w-2xl px-4 py-10 text-center">
      <div className={`mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br ${mode.accent} text-3xl shadow-sm`} aria-hidden="true">
        {mode.emoji}
      </div>
      <h2 className="text-lg font-bold text-slate-800">여기서는 천천히 말해도 괜찮아요</h2>
      <p className="mx-auto mt-2 max-w-sm text-sm leading-relaxed text-slate-500">
        정리되지 않은 이야기여도 좋습니다. 오늘 마음에 남아 있는 것부터 편하게 꺼내 보세요.
      </p>

      <div className="mt-6 grid gap-2 sm:grid-cols-2">
        {STARTERS.map((s) => (
          <button
            key={s}
            disabled={disabled}
            onClick={() => onPick(s)}
            className="rounded-xl border border-slate-200 bg-white px-4 py-3 text-left text-sm text-slate-600 shadow-sm transition hover:border-indigo-200 hover:bg-indigo-50/50 hover:text-indigo-700 disabled:opacity-40"
          >
            {s}
          </button>
        ))}
      </div>
    </div>
  );
}

function Composer({ value, onChange, onSend, onStop, busy, disabled }) {
  const taRef = useRef(null);

  useEffect(() => {
    const el = taRef.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = `${Math.min(el.scrollHeight, 140)}px`;
  }, [value]);

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
      e.preventDefault();
      onSend();
    }
  };

  return (
    <div className="sticky bottom-0 z-20 border-t border-slate-200/80 bg-slate-50/95 backdrop-blur">
      <div className="mx-auto w-full max-w-2xl px-4 py-3">
        <div className="flex items-end gap-2 rounded-2xl border border-slate-200 bg-white p-2 shadow-sm focus-within:border-indigo-300 focus-within:ring-2 focus-within:ring-indigo-100">
          <textarea
            ref={taRef}
            rows={1}
            value={value}
            disabled={disabled}
            onChange={(e) => onChange(e.target.value)}
            onKeyDown={handleKeyDown}
            placeholder={disabled ? '잠시만요…' : '마음에 있는 이야기를 적어 주세요…'}
            aria-label="메시지 입력"
            className="max-h-[140px] flex-1 resize-none bg-transparent px-2 py-2 text-[15px] leading-relaxed text-slate-800 placeholder-slate-400 focus:outline-none disabled:cursor-not-allowed"
          />
          {busy ? (
            <Button variant="secondary" size="md" onClick={onStop} className="!px-3" aria-label="응답 중단">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
            </Button>
          ) : (
            <Button
              size="md"
              onClick={onSend}
              disabled={disabled || !value.trim()}
              className="!px-3"
              aria-label="보내기"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m22 2-7 20-4-9-9-4 20-7z" />
              </svg>
            </Button>
          )}
        </div>
        <p className="mt-2 text-center text-[10px] leading-relaxed text-slate-400">
          AI 상담 도우미이며 전문 의료 서비스가 아닙니다 · 위기 상황 시 <span className="font-semibold text-slate-500">109</span> · <span className="font-semibold text-slate-500">1577-0199</span>
        </p>
      </div>
    </div>
  );
}

// ========================================
// 📄 Modal Views
// ========================================
function SettingsModal({ isOpen, onClose, apiKey, model, onSave }) {
  const [draftKey, setDraftKey] = useState(apiKey);
  const [draftModel, setDraftModel] = useState(model);
  const [reveal, setReveal] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    if (isOpen) {
      setDraftKey(apiKey);
      setDraftModel(model);
      setReveal(false);
      setError('');
    }
  }, [isOpen, apiKey, model]);

  const handleSave = () => {
    const trimmed = draftKey.trim();
    if (!trimmed) {
      setError('API 키를 입력해 주세요.');
      return;
    }
    if (!trimmed.startsWith('sk-')) {
      setError('OpenAI API 키는 sk- 로 시작합니다.');
      return;
    }
    onSave({ apiKey: trimmed, model: draftModel });
    onClose();
  };

  return (
    <Modal isOpen={isOpen} onClose={onClose} title="설정">
      <div className="space-y-4">
        <div>
          <Input
            label="OpenAI API 키"
            type={reveal ? 'text' : 'password'}
            value={draftKey}
            onChange={(e) => { setDraftKey(e.target.value); setError(''); }}
            placeholder="sk-proj-…"
            error={error}
            autoComplete="off"
          />
          <div className="mt-1.5 flex items-center justify-between">
            <span className="text-[11px] text-slate-400">현재: {maskKey(apiKey)}</span>
            <button
              onClick={() => setReveal((v) => !v)}
              className="text-[11px] font-medium text-indigo-600 hover:underline"
            >
              {reveal ? '가리기' : '보기'}
            </button>
          </div>
        </div>

        <Select
          label="모델"
          value={draftModel}
          onChange={(e) => setDraftModel(e.target.value)}
          options={MODELS}
        />

        <div className="rounded-xl bg-amber-50 border border-amber-200 px-3.5 py-3 text-[11px] leading-relaxed text-amber-800">
          <p className="font-semibold">보안 안내</p>
          <p className="mt-1">
            이 앱은 브라우저에서 OpenAI API를 직접 호출합니다. 키는 이 브라우저의 localStorage 에만 저장되지만,
            소스 코드에 남은 키는 누구나 볼 수 있으니 <span className="font-semibold">공개 저장소에 커밋하거나 배포하지 마세요.</span>
          </p>
        </div>

        <div className="flex justify-end gap-2 pt-1">
          <Button variant="secondary" onClick={onClose}>취소</Button>
          <Button onClick={handleSave}>저장</Button>
        </div>
      </div>
    </Modal>
  );
}

function ConsentModal({ isOpen, onAgree }) {
  return (
    <Modal isOpen={isOpen} onClose={() => {}} title="시작하기 전에" hideClose>
      <div className="space-y-3 text-sm leading-relaxed text-slate-600">
        <p>
          <span className="font-semibold text-slate-800">마음쉼표</span>는 마음을 정리하는 것을 돕는 AI 대화 도우미입니다.
          편하게 이야기하실 수 있도록 만들어졌지만, 아래 내용을 먼저 확인해 주세요.
        </p>
        <ul className="space-y-2 rounded-xl bg-slate-50 p-3.5 text-[13px]">
          <li className="flex gap-2"><span aria-hidden="true">•</span><span>전문 의료·심리 치료를 <b>대체하지 않습니다.</b> 진단이나 처방을 하지 않습니다.</span></li>
          <li className="flex gap-2"><span aria-hidden="true">•</span><span>AI의 답변은 <b>부정확할 수 있습니다.</b> 중요한 결정은 전문가와 상의해 주세요.</span></li>
          <li className="flex gap-2"><span aria-hidden="true">•</span><span>대화 내용은 <b>내 브라우저에만 저장</b>되며, 응답 생성을 위해 OpenAI 로 전송됩니다.</span></li>
        </ul>
        <div className="rounded-xl border border-rose-200 bg-rose-50 p-3.5 text-[13px] text-rose-700">
          <p className="font-semibold">지금 위급하다면</p>
          <p className="mt-1">자살예방상담전화 <b>109</b> · 정신건강위기상담 <b>1577-0199</b> · 응급 <b>119</b></p>
        </div>
        <Button size="lg" className="w-full" onClick={onAgree}>이해했어요, 시작할게요</Button>
      </div>
    </Modal>
  );
}

// ========================================
// 🚀 App
// ========================================
function App() {
  const [apiKey, setApiKey] = useState(() => loadLS(STORAGE.key, DEFAULT_API_KEY));
  const [model, setModel] = useState(() => loadLS(STORAGE.model, MODELS[0].value));
  const [mode, setMode] = useState(() => {
    const savedId = loadLS(STORAGE.mode, MODES[0].id);
    return MODES.find((m) => m.id === savedId) || MODES[0];
  });
  const [messages, setMessages] = useState(() => loadLS(STORAGE.messages, []));
  const [agreed, setAgreed] = useState(() => loadLS(STORAGE.agreed, false));

  const [draft, setDraft] = useState('');
  const [streamingText, setStreamingText] = useState(null); // null 이면 스트리밍 중 아님
  const [busy, setBusy] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showCrisis, setShowCrisis] = useState(false);

  const abortRef = useRef(null);
  const bottomRef = useRef(null);

  // --- 영속화 ---
  useEffect(() => { saveLS(STORAGE.key, apiKey); }, [apiKey]);
  useEffect(() => { saveLS(STORAGE.model, model); }, [model]);
  useEffect(() => { saveLS(STORAGE.mode, mode.id); }, [mode]);
  useEffect(() => { saveLS(STORAGE.messages, messages); }, [messages]);
  useEffect(() => { saveLS(STORAGE.agreed, agreed); }, [agreed]);

  // --- 새 메시지마다 하단으로 스크롤 ---
  useEffect(() => {
    if (bottomRef.current) {
      bottomRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  }, [messages, streamingText]);

  // --- 언마운트 시 진행 중 요청 정리 ---
  useEffect(() => () => {
    if (abortRef.current) abortRef.current.abort();
  }, []);

  const systemPrompt = useMemo(() => `${mode.prompt}\n\n${SAFETY_RULES}`, [mode]);
  const keyReady = Boolean(apiKey && apiKey.trim());

  const send = useCallback(async (rawText) => {
    const text = (rawText === undefined ? draft : rawText).trim();
    if (!text || busy) return;

    if (!keyReady) {
      setShowSettings(true);
      return;
    }

    if (hasCrisisSignal(text)) setShowCrisis(true);

    const userMsg = { id: makeId(), role: 'user', content: text, ts: Date.now() };
    const history = [...messages, userMsg];

    setMessages(history);
    setDraft('');
    setBusy(true);
    setStreamingText('');

    const controller = new AbortController();
    abortRef.current = controller;

    // 컨텍스트는 최근 20개 메시지로 제한 (토큰 절약)
    const payloadMessages = [
      { role: 'system', content: systemPrompt },
      ...history
        .filter((m) => m.role === 'user' || m.role === 'assistant')
        .slice(-20)
        .map((m) => ({ role: m.role, content: m.content })),
    ];

    let acc = '';

    try {
      const res = await fetch(OPENAI_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${apiKey.trim()}`,
        },
        body: JSON.stringify({
          model,
          messages: payloadMessages,
          temperature: 0.85,
          max_tokens: 700,
          stream: true,
        }),
        signal: controller.signal,
      });

      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try {
          const errJson = await res.json();
          if (errJson && errJson.error && errJson.error.message) detail = errJson.error.message;
        } catch (e) { /* 본문이 JSON 이 아닐 수 있음 */ }
        throw new Error(detail);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      // SSE 스트림 파싱
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices && json.choices[0] && json.choices[0].delta;
            if (delta && delta.content) {
              acc += delta.content;
              setStreamingText(acc);
            }
          } catch (e) { /* 잘린 청크는 건너뜀 */ }
        }
      }

      if (acc.trim()) {
        setMessages((prev) => [...prev, { id: makeId(), role: 'assistant', content: acc, ts: Date.now() }]);
        if (hasCrisisSignal(acc)) setShowCrisis(true);
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        // 사용자가 중단 → 여기까지 받은 내용은 보존
        if (acc.trim()) {
          setMessages((prev) => [...prev, { id: makeId(), role: 'assistant', content: `${acc}\n\n(중단됨)`, ts: Date.now() }]);
        }
      } else {
        setMessages((prev) => [...prev, { id: makeId(), role: 'error', content: err.message, ts: Date.now() }]);
      }
    } finally {
      abortRef.current = null;
      setStreamingText(null);
      setBusy(false);
    }
  }, [draft, busy, keyReady, messages, systemPrompt, apiKey, model]);

  const stop = useCallback(() => {
    if (abortRef.current) abortRef.current.abort();
  }, []);

  const reset = useCallback(() => {
    if (busy) return;
    if (messages.length && !window.confirm('지금까지의 대화를 모두 지울까요?')) return;
    setMessages([]);
    setShowCrisis(false);
  }, [busy, messages.length]);

  return (
    <div className="flex min-h-screen flex-col bg-slate-100">
      <Header
        mode={mode}
        onModeChange={setMode}
        onOpenSettings={() => setShowSettings(true)}
        onReset={reset}
        busy={busy}
        hasMessages={messages.length > 0}
      />

      <main className="flex-1 py-5">
        {!keyReady && (
          <div className="mx-auto mb-4 w-full max-w-2xl px-4">
            <Card className="flex items-center justify-between gap-3 p-3.5">
              <div className="min-w-0">
                <p className="text-sm font-semibold text-slate-800">API 키가 필요해요</p>
                <p className="text-xs text-slate-500">설정에서 OpenAI API 키를 입력하면 대화를 시작할 수 있어요.</p>
              </div>
              <Button size="sm" onClick={() => setShowSettings(true)}>키 입력</Button>
            </Card>
          </div>
        )}

        {messages.length === 0 && streamingText === null ? (
          <EmptyState mode={mode} onPick={(s) => send(s)} disabled={busy || !keyReady} />
        ) : (
          <div className="flex flex-col gap-5">
            {messages.map((m) => (
              <MessageBubble key={m.id} message={m} mode={mode} />
            ))}

            {streamingText !== null && (
              <MessageBubble
                message={{ id: 'streaming', role: 'assistant', content: streamingText, ts: Date.now() }}
                mode={mode}
                streaming
              />
            )}

            {showCrisis && <CrisisCard onDismiss={() => setShowCrisis(false)} />}
          </div>
        )}

        <div ref={bottomRef} className="h-2" />
      </main>

      <Composer
        value={draft}
        onChange={setDraft}
        onSend={() => send()}
        onStop={stop}
        busy={busy}
        disabled={!keyReady || busy}
      />

      <SettingsModal
        isOpen={showSettings}
        onClose={() => setShowSettings(false)}
        apiKey={apiKey}
        model={model}
        onSave={({ apiKey: k, model: m }) => { setApiKey(k); setModel(m); }}
      />

      <ConsentModal isOpen={!agreed} onAgree={() => setAgreed(true)} />
    </div>
  );
}

// Rendering

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
