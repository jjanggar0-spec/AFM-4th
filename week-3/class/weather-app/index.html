<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 날씨</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현 불가능한 것만 커스텀 CSS 로 정의 */
    @keyframes float-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-float-in { animation: float-in .45s cubic-bezier(.22,1,.36,1) both; }

    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 9s linear infinite; transform-origin: center; }

    @keyframes drift {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }
    .animate-drift { animation: drift 4s ease-in-out infinite; }

    @keyframes rain-fall {
      0%   { transform: translateY(-2px); opacity: .35; }
      35%  { opacity: 1; }
      100% { transform: translateY(1.5px); opacity: .35; }
    }
    .animate-rain { animation: rain-fall 1.1s linear infinite; }

    @keyframes flash {
      0%, 45%, 100% { opacity: .55; }
      50%, 60%      { opacity: 1; }
    }
    .animate-flash { animation: flash 2.2s ease-in-out infinite; }

    /* 가로 스크롤 영역의 스크롤바를 얇게 */
    .thin-scroll::-webkit-scrollbar { height: 6px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); border-radius: 9999px; }

    @media (prefers-reduced-motion: reduce) {
      .animate-float-in, .animate-spin-slow, .animate-drift, .animate-rain, .animate-flash { animation: none; }
    }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // ⚙️ Config — OpenWeatherMap
    // ========================================

    // ⚠️ 브라우저에서 직접 호출하므로 이 키는 소스에 그대로 노출된다.
    //    공개 저장소에 올리거나 배포할 때는 서버(프록시)로 옮기고 키를 재발급할 것.
    const API_KEY = '1d5926b624ef458b103acdefc47d5cbc';
    const API_BASE_URL = 'https://api.openweathermap.org/data/2.5';

    // 무료 플랜에서 쓸 수 있는 엔드포인트만 사용한다.
    //   /weather        — 현재 날씨
    //   /forecast       — 5일 / 3시간 간격 예보
    //   /air_pollution  — 미세먼지
    const ENDPOINTS = {
      current: (lat, lon) =>
        `${API_BASE_URL}/weather?lat=${lat}&lon=${lon}&units=metric&lang=kr&appid=${API_KEY}`,
      forecast: (lat, lon) =>
        `${API_BASE_URL}/forecast?lat=${lat}&lon=${lon}&units=metric&lang=kr&appid=${API_KEY}`,
      air: (lat, lon) =>
        `${API_BASE_URL}/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`,
    };

    const CITIES = [
      { id: 'seoul',     name: '서울', region: '대한민국 · 종로구',        lat: 37.5729, lon: 126.9794 },
      { id: 'busan',     name: '부산', region: '대한민국 · 해운대구',      lat: 35.1587, lon: 129.1604 },
      { id: 'jeju',      name: '제주', region: '대한민국 · 제주시',        lat: 33.4996, lon: 126.5312 },
      { id: 'gangneung', name: '강릉', region: '대한민국 · 강원특별자치도', lat: 37.7519, lon: 128.8761 },
    ];

    // ========================================
    // 🗺️ API Response → View Model 매핑
    // ========================================

    const WEATHER_META = {
      clear:   { label: '맑음',      tone: 'from-sky-400 via-sky-500 to-indigo-600' },
      partly:  { label: '구름 조금', tone: 'from-sky-400 via-cyan-500 to-blue-700' },
      cloudy:  { label: '구름 많음', tone: 'from-slate-400 via-slate-500 to-slate-700' },
      rain:    { label: '비',        tone: 'from-slate-500 via-blue-700 to-slate-900' },
      shower:  { label: '소나기',    tone: 'from-indigo-500 via-blue-700 to-slate-900' },
      thunder: { label: '천둥번개',  tone: 'from-slate-600 via-indigo-800 to-slate-900' },
      snow:    { label: '눈',        tone: 'from-sky-200 via-slate-400 to-slate-600' },
      fog:     { label: '안개',      tone: 'from-slate-300 via-slate-500 to-slate-700' },
    };

    // OpenWeatherMap condition code → 내부 아이콘 키
    // https://openweathermap.org/weather-conditions
    function mapCondition(id) {
      if (id >= 200 && id < 300) return 'thunder';
      if (id >= 300 && id < 400) return 'rain';    // 이슬비
      if (id === 511) return 'snow';               // 어는 비
      if (id >= 500 && id <= 504) return 'rain';
      if (id >= 520 && id < 600) return 'shower';
      if (id >= 600 && id < 700) return 'snow';
      if (id >= 700 && id < 800) return 'fog';
      if (id === 800) return 'clear';
      if (id === 801 || id === 802) return 'partly';
      return 'cloudy';                             // 803, 804
    }

    // 도시의 현지 시각으로 읽기 위해 UTC 에 timezone offset 을 더한 Date 를 만든다.
    // 이렇게 만든 Date 는 반드시 getUTC* 계열로 읽어야 한다.
    const toLocal = (unixSeconds, tzOffset) => new Date((unixSeconds + tzOffset) * 1000);

    const WIND_DIRS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
    const windDirLabel = (deg) => WIND_DIRS[Math.round(deg / 45) % 8];

    const pad2 = (n) => String(n).padStart(2, '0');
    const clockLabel = (unixSeconds, tzOffset) => {
      const d = toLocal(unixSeconds, tzOffset);
      return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}`;
    };

    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    // 사람이 읽을 한 줄 요약을 실제 관측값에서 만든다
    function buildSummary({ temp, conditionKey, pop, wind, humidity }) {
      const parts = [];

      if (conditionKey === 'thunder') parts.push('천둥번개가 치고 있어요');
      else if (conditionKey === 'rain' || conditionKey === 'shower') parts.push('비가 내리고 있어요');
      else if (conditionKey === 'snow') parts.push('눈이 내리고 있어요');
      else if (conditionKey === 'fog') parts.push('안개가 끼어 시야가 흐려요');
      else if (temp >= 30) parts.push('한낮 더위가 만만치 않아요');
      else if (temp >= 24) parts.push('포근한 날씨예요');
      else if (temp >= 15) parts.push('활동하기 좋은 선선한 날씨예요');
      else if (temp >= 5) parts.push('쌀쌀하니 겉옷을 챙기세요');
      else parts.push('많이 추워요, 따뜻하게 입으세요');

      if (pop >= 60) parts.push('우산을 꼭 챙기세요');
      else if (pop >= 30) parts.push('우산을 챙기면 좋아요');
      else if (wind >= 8) parts.push('바람이 강하게 붑니다');
      else if (humidity >= 85) parts.push('공기가 눅눅합니다');

      return parts.join('. ') + '.';
    }

    // 현재 날씨 응답 매핑
    function mapCurrent(res, tzOffset, popNow, air) {
      const w = res.weather[0];
      const conditionKey = mapCondition(w.id);

      return {
        temp: res.main.temp,
        feelsLike: res.main.feels_like,
        condition: conditionKey,
        description: w.description,        // API 가 준 한국어 설명 (예: "튼구름")
        isDay: w.icon.endsWith('d'),
        humidity: res.main.humidity,
        wind: res.wind.speed,
        windDir: windDirLabel(res.wind.deg || 0),
        gust: res.wind.gust,
        pressure: res.main.pressure,
        clouds: res.clouds.all,
        visibility: Math.round((res.visibility ?? 10000) / 100) / 10, // m → km
        pop: popNow,
        dust: air,                         // 대기오염 호출이 실패하면 null
        sunrise: clockLabel(res.sys.sunrise, tzOffset),
        sunset: clockLabel(res.sys.sunset, tzOffset),
        observedAt: res.dt,
        summary: buildSummary({
          temp: res.main.temp,
          conditionKey,
          pop: popNow,
          wind: res.wind.speed,
          humidity: res.main.humidity,
        }),
      };
    }

    // 3시간 간격 예보 → 시간별 카드 (기본 8칸 = 24시간)
    function mapHourly(list, tzOffset, count = 8) {
      return list.slice(0, count).map((item) => {
        const d = toLocal(item.dt, tzOffset);
        return {
          hour: d.getUTCHours(),
          temp: item.main.temp,
          condition: mapCondition(item.weather[0].id),
          isDay: item.sys.pod === 'd',
          pop: Math.round((item.pop || 0) * 100),
        };
      });
    }

    // 3시간 간격 예보를 현지 날짜 기준으로 묶어 일별 예보로 만든다
    function mapDaily(list, tzOffset) {
      const buckets = new Map();

      list.forEach((item) => {
        const d = toLocal(item.dt, tzOffset);
        const key = `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;

        if (!buckets.has(key)) {
          buckets.set(key, {
            date: d,
            high: -Infinity,
            low: Infinity,
            pop: 0,
            conditionCounts: {},
            // 낮 시간대(09~18시) 날씨를 그날의 대표 날씨로 삼는다
            daytimeCounts: {},
          });
        }

        const b = buckets.get(key);
        const hour = d.getUTCHours();
        const key2 = mapCondition(item.weather[0].id);

        b.high = Math.max(b.high, item.main.temp_max);
        b.low = Math.min(b.low, item.main.temp_min);
        b.pop = Math.max(b.pop, Math.round((item.pop || 0) * 100));
        b.conditionCounts[key2] = (b.conditionCounts[key2] || 0) + 1;
        if (hour >= 9 && hour <= 18) b.daytimeCounts[key2] = (b.daytimeCounts[key2] || 0) + 1;
      });

      const PRECIP = ['thunder', 'snow', 'rain', 'shower'];

      // 가장 잦은 날씨를 대표로 삼되, 강수 확률이 높은 날은 강수 아이콘을 우선한다.
      // (하루 8칸 중 비가 3칸이어도 "비 오는 날"로 읽히는 게 맞다)
      const pickTop = (counts, pop) => {
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        if (pop >= 50) {
          const precip = sorted.find(([key]) => PRECIP.includes(key));
          if (precip) return precip[0];
        }
        return sorted[0][0];
      };

      const dateKey = (d) => `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
      const nowLocal = toLocal(Math.floor(Date.now() / 1000), tzOffset);
      const todayKey = dateKey(nowLocal);
      const tomorrowKey = dateKey(new Date(nowLocal.getTime() + 86400000));

      return Array.from(buckets.entries()).map(([key, b]) => {
        const counts = Object.keys(b.daytimeCounts).length ? b.daytimeCounts : b.conditionCounts;
        return {
          isToday: key === todayKey,
          day: key === todayKey ? '오늘' : key === tomorrowKey ? '내일' : DAY_NAMES[b.date.getUTCDay()],
          date: `${b.date.getUTCMonth() + 1}/${b.date.getUTCDate()}`,
          condition: pickTop(counts, b.pop),
          high: b.high,
          low: b.low,
          pop: b.pop,
        };
      });
    }

    // 대기오염 응답 매핑 (실패해도 앱은 계속 동작해야 한다)
    function mapAir(res) {
      const entry = res.list && res.list[0];
      if (!entry) return null;
      return {
        pm10: Math.round(entry.components.pm10),
        pm25: Math.round(entry.components.pm2_5),
        aqi: entry.main.aqi, // 1(좋음) ~ 5(매우 나쁨)
      };
    }

    // ========================================
    // 📡 useWeather — 세 엔드포인트를 묶어 한 번에 가져오는 훅
    // ========================================

    function useWeather(city) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [reloadKey, setReloadKey] = useState(0);

      const refetch = useCallback(() => setReloadKey((k) => k + 1), []);

      useEffect(() => {
        const controller = new AbortController();
        let cancelled = false;

        // 첫 로딩에서만 전체 스켈레톤을 보여주고, 새로고침은 화면을 유지한 채 갱신한다
        setLoading((prev) => (data ? prev : true));
        setError(null);

        const get = (url) =>
          fetch(url, { signal: controller.signal }).then(async (res) => {
            if (!res.ok) {
              const body = await res.json().catch(() => ({}));
              const err = new Error(body.message || `HTTP ${res.status}`);
              err.status = res.status;
              throw err;
            }
            return res.json();
          });

        Promise.all([
          get(ENDPOINTS.current(city.lat, city.lon)),
          get(ENDPOINTS.forecast(city.lat, city.lon)),
          // 미세먼지는 부가 정보이므로 실패해도 전체를 실패시키지 않는다
          get(ENDPOINTS.air(city.lat, city.lon)).catch(() => null),
        ])
          .then(([current, forecast, air]) => {
            if (cancelled) return;

            const tzOffset = forecast.city.timezone ?? current.timezone ?? 0;
            const hourly = mapHourly(forecast.list, tzOffset);
            const daily = mapDaily(forecast.list, tzOffset);
            const popNow = hourly.length ? hourly[0].pop : 0;

            const mapped = mapCurrent(current, tzOffset, popNow, air ? mapAir(air) : null);

            // 오늘의 최고/최저는 남은 예보만으로는 부족할 수 있어 현재 기온으로 보정한다.
            // 자정 무렵에는 예보의 첫 구간이 이미 내일일 수 있어 오늘 버킷을 직접 찾는다.
            const today = daily.find((d) => d.isToday);
            if (today) {
              today.high = Math.max(today.high, mapped.temp);
              today.low = Math.min(today.low, mapped.temp);
            }

            setData({
              current: mapped,
              hourly,
              daily,
              tzOffset,
              high: today ? today.high : mapped.temp,
              low: today ? today.low : mapped.temp,
              updatedAt: clockLabel(Math.floor(Date.now() / 1000), tzOffset),
            });
            setLoading(false);
          })
          .catch((err) => {
            if (cancelled || err.name === 'AbortError') return;
            setError(
              err.status === 401
                ? 'API 키가 유효하지 않습니다. 새로 발급한 키라면 활성화까지 최대 2시간이 걸릴 수 있어요.'
                : err.status === 429
                ? '무료 플랜 호출 한도를 넘었습니다. 잠시 후 다시 시도해 주세요.'
                : `${err.message} — 네트워크 상태를 확인해 주세요.`
            );
            setLoading(false);
          });

        return () => {
          cancelled = true;
          controller.abort();
        };
      // data 는 스켈레톤 표시 여부만 판단하는 용도라 의존성에서 제외한다
      }, [city.lat, city.lon, reloadKey]); // eslint-disable-line react-hooks/exhaustive-deps

      return { data, loading, error, refetch };
    }

    // ========================================
    // 🛠️ Utils
    // ========================================

    const toF = (c) => Math.round(c * 9 / 5 + 32);
    const formatTemp = (c, unit) => (unit === 'C' ? Math.round(c) : toF(c));

    const shortHour = (h) => `${h}시`;

    // OpenWeatherMap 의 종합 대기질 지수(1~5). 오존·이산화질소까지 포함하므로
    // 미세먼지 농도만 보고 판단한 등급과 다를 수 있어, 화면에서도 따로 표기한다.
    const AQI_LEVELS = [
      null,
      { label: '좋음', color: 'bg-sky-400/20 text-sky-100 ring-sky-300/30' },
      { label: '양호', color: 'bg-emerald-400/20 text-emerald-100 ring-emerald-300/30' },
      { label: '보통', color: 'bg-amber-400/20 text-amber-100 ring-amber-300/30' },
      { label: '나쁨', color: 'bg-orange-400/20 text-orange-100 ring-orange-300/30' },
      { label: '매우 나쁨', color: 'bg-rose-400/20 text-rose-100 ring-rose-300/30' },
    ];
    const aqiLevel = (aqi) => AQI_LEVELS[aqi] || AQI_LEVELS[3];

    // 국내 기준(㎍/㎥)에 맞춘 미세먼지 등급
    const dustLevel = (pm10) => {
      if (pm10 <= 30) return { label: '좋음', color: 'bg-sky-400/20 text-sky-100 ring-sky-300/30' };
      if (pm10 <= 80) return { label: '보통', color: 'bg-emerald-400/20 text-emerald-100 ring-emerald-300/30' };
      if (pm10 <= 150) return { label: '나쁨', color: 'bg-orange-400/20 text-orange-100 ring-orange-300/30' };
      return { label: '매우 나쁨', color: 'bg-rose-400/20 text-rose-100 ring-rose-300/30' };
    };

    const cloudLevel = (clouds) => {
      if (clouds <= 20) return { label: '거의 없음', color: 'bg-sky-400/20 text-sky-100 ring-sky-300/30' };
      if (clouds <= 60) return { label: '조금', color: 'bg-emerald-400/20 text-emerald-100 ring-emerald-300/30' };
      if (clouds <= 85) return { label: '많음', color: 'bg-amber-400/20 text-amber-100 ring-amber-300/30' };
      return { label: '흐림', color: 'bg-slate-400/25 text-slate-100 ring-slate-300/30' };
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, className = '', ...rest }) {
      const base =
        'inline-flex items-center justify-center gap-1.5 rounded-full font-medium transition ' +
        'focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70 ' +
        'disabled:opacity-40 disabled:cursor-not-allowed';

      const variants = {
        primary: 'bg-white/90 text-slate-900 hover:bg-white shadow-sm',
        secondary: 'bg-white/15 text-white ring-1 ring-inset ring-white/25 hover:bg-white/25 backdrop-blur',
        danger: 'bg-rose-500 text-white hover:bg-rose-600 shadow-sm',
        ghost: 'bg-transparent text-white/80 hover:text-white hover:bg-white/10',
      };

      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-5 py-2.5 text-base',
      };

      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Card({ children, className = '', ...rest }) {
      return (
        <div
          className={`rounded-3xl bg-white/10 ring-1 ring-inset ring-white/15 backdrop-blur-md shadow-lg shadow-black/10 p-5 sm:p-6 ${className}`}
          {...rest}
        >
          {children}
        </div>
      );
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'md' }) {
      const panelRef = useRef(null);

      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        if (panelRef.current) panelRef.current.focus();
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = prevOverflow;
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/60 backdrop-blur-sm sm:p-4"
          onClick={onClose}
          role="presentation"
        >
          <div
            ref={panelRef}
            tabIndex={-1}
            role="dialog"
            aria-modal="true"
            aria-label={title}
            onClick={(e) => e.stopPropagation()}
            className={`w-full ${sizes[size]} rounded-t-3xl sm:rounded-3xl bg-slate-900 text-white ring-1 ring-white/10 shadow-2xl p-5 sm:p-6 animate-float-in focus:outline-none`}
          >
            <div className="flex items-start justify-between gap-4 mb-4">
              <h2 className="text-lg font-semibold">{title}</h2>
              <button
                type="button"
                onClick={onClose}
                aria-label="닫기"
                className="rounded-full p-1.5 text-white/60 hover:text-white hover:bg-white/10 transition"
              >
                <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                  <path d="M6 6l12 12M18 6L6 18" />
                </svg>
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function Skeleton({ className = '' }) {
      return <div className={`animate-pulse rounded-3xl bg-white/15 ${className}`} />;
    }

    // ========================================
    // 🌤️ WeatherIcon — 날씨 상태별 인라인 SVG
    // ========================================

    function WeatherIcon({ condition, day = true, className = 'w-12 h-12' }) {
      const Sun = (
        <g className="animate-spin-slow" stroke="#FDE68A" fill="none" strokeWidth="1.6" strokeLinecap="round">
          <circle cx="12" cy="12" r="4.2" fill="#FBBF24" stroke="#FBBF24" />
          <path d="M12 3.2v2M12 19v1.8M3.4 12h1.9M18.8 12h1.9M6 6l1.3 1.3M16.8 16.8L18 18M18 6l-1.2 1.3M7.3 16.8L6 18" />
        </g>
      );

      const Moon = (
        <path
          d="M18.5 14.4A7.2 7.2 0 019.6 5.5a7.4 7.4 0 108.9 8.9z"
          fill="#E2E8F0"
          stroke="#CBD5E1"
          strokeWidth="1.2"
        />
      );

      const Cloud = (extraClass = '') => (
        <path
          className={extraClass}
          d="M7.6 18.5h9.1a3.7 3.7 0 00.4-7.4 5.3 5.3 0 00-10.1-1.2 3.8 3.8 0 00.6 8.6z"
          fill="#F1F5F9"
          stroke="#CBD5E1"
          strokeWidth="1.1"
        />
      );

      const RainDrops = (count) => (
        <g stroke="#38BDF8" strokeWidth="2.2" strokeLinecap="round">
          {Array.from({ length: count }).map((_, i) => (
            <line
              key={i}
              x1={9.2 + i * 3.0}
              y1={19.6}
              x2={8.5 + i * 3.0}
              y2={22.2}
              className="animate-rain"
              style={{ animationDelay: `${i * 0.22}s` }}
            />
          ))}
        </g>
      );

      let content;
      switch (condition) {
        case 'clear':
          content = day ? Sun : Moon;
          break;
        case 'partly':
          content = (
            <g>
              <g transform="translate(3.5,-2.5) scale(0.7)">{day ? Sun : Moon}</g>
              {Cloud('animate-drift')}
            </g>
          );
          break;
        case 'cloudy':
          content = (
            <g>
              <path d="M5.5 15.2a3 3 0 011.2-5.8 4.4 4.4 0 018.2-1.2" fill="none" stroke="#94A3B8" strokeWidth="1.2" strokeLinecap="round" />
              {Cloud('animate-drift')}
            </g>
          );
          break;
        case 'rain':
          content = <g>{Cloud()}{RainDrops(3)}</g>;
          break;
        case 'shower':
          content = (
            <g>
              <g transform="translate(4,-3) scale(0.62)">{day ? Sun : Moon}</g>
              {Cloud()}
              {RainDrops(2)}
            </g>
          );
          break;
        case 'thunder':
          content = (
            <g>
              {Cloud()}
              <path
                className="animate-flash"
                d="M12.6 18.2l-2.6 3.4h2.2l-.7 2.4 3-3.6h-2.2l.9-2.2z"
                fill="#FACC15"
                stroke="#FACC15"
                strokeWidth=".8"
                strokeLinejoin="round"
              />
            </g>
          );
          break;
        case 'snow':
          content = (
            <g>
              {Cloud()}
              <g stroke="#BAE6FD" strokeWidth="2" strokeLinecap="round">
                <path d="M9.6 20.4h.01M12.4 21.6h.01M15.2 20.4h.01" />
              </g>
            </g>
          );
          break;
        case 'fog':
          content = (
            <g>
              {Cloud()}
              <g stroke="#CBD5E1" strokeWidth="1.7" strokeLinecap="round">
                <path className="animate-drift" d="M6.2 20.6h11.6" />
                <path className="animate-drift" style={{ animationDelay: '.6s' }} d="M8 22.6h8.4" />
              </g>
            </g>
          );
          break;
        default:
          content = Cloud();
      }

      const label = (WEATHER_META[condition] || {}).label || '날씨';

      return (
        <svg viewBox="0 0 24 24" className={className} role="img" aria-label={label}>
          {content}
        </svg>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================

    function Header({ cities, selectedId, onSelect, unit, onToggleUnit, onRefresh, refreshing }) {
      return (
        <header className="flex flex-col gap-4">
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-2 text-white">
              <WeatherIcon condition="partly" className="w-8 h-8" />
              <span className="text-lg font-semibold tracking-tight">오늘의 날씨</span>
            </div>

            <div className="flex items-center gap-2">
              <Button
                variant="secondary"
                size="sm"
                onClick={onToggleUnit}
                aria-label={`온도 단위 전환, 현재 ${unit === 'C' ? '섭씨' : '화씨'}`}
              >
                °{unit}
              </Button>
              <Button variant="secondary" size="sm" onClick={onRefresh} disabled={refreshing} aria-label="날씨 새로고침">
                <svg
                  viewBox="0 0 24 24"
                  className={`w-4 h-4 ${refreshing ? 'animate-spin' : ''}`}
                  fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                >
                  <path d="M20 11a8 8 0 10-1.8 6.1" />
                  <path d="M20 20v-5h-5" />
                </svg>
                <span className="hidden sm:inline">{refreshing ? '갱신 중' : '새로고침'}</span>
              </Button>
            </div>
          </div>

          {/* 도시 선택 */}
          <nav aria-label="도시 선택" className="overflow-x-auto thin-scroll -mx-1 px-1 pb-1">
            <ul className="flex gap-2 min-w-max" role="list">
              {cities.map((city) => {
                const active = city.id === selectedId;
                return (
                  <li key={city.id}>
                    <button
                      type="button"
                      onClick={() => onSelect(city.id)}
                      aria-current={active ? 'true' : undefined}
                      className={`rounded-full px-4 py-2 text-sm font-medium whitespace-nowrap transition
                        focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70 ${
                          active
                            ? 'bg-white text-slate-900 shadow-sm'
                            : 'bg-white/10 text-white/80 ring-1 ring-inset ring-white/20 hover:bg-white/20 hover:text-white'

        </header>

    }

    function Footer({ updatedAt, onOpenInfo }) {
      return (
        <footer className="flex flex-col sm:flex-row items-center justify-between gap-2 pt-2 pb-8 text-xs text-white/60">
          <p>{updatedAt ? `${updatedAt} 갱신 · ` : ''}OpenWeatherMap 실시간 데이터</p>
          <button
            type="button"
            onClick={onOpenInfo}
            className="rounded underline underline-offset-4 hover:text-white/90 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
          >
            데이터 출처
          </button>
        </footer>
      );
    }

    // ========================================
    // 📄 Section Components
    // ========================================

    function CurrentWeather({ city, weather, unit }) {
      const c = weather.current;

      return (
        <Card className="animate-float-in">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6">
            <div className="min-w-0">
              <p className="text-sm text-white/70">{city.region}</p>
              <h1 className="mt-0.5 text-2xl font-semibold text-white">{city.name}</h1>

              <div className="mt-4 flex items-start gap-1">
                <span className="text-7xl sm:text-8xl font-light leading-none text-white tabular-nums">
                  {formatTemp(c.temp, unit)}
                </span>
                <span className="mt-2 text-2xl text-white/70">°{unit}</span>
              </div>

              <p className="mt-3 text-lg text-white/90">{c.description}</p>
              <p className="mt-1 text-sm text-white/70">
                체감 {formatTemp(c.feelsLike, unit)}° · 최고 {formatTemp(weather.high, unit)}° / 최저 {formatTemp(weather.low, unit)}°
              </p>
              <p className="mt-3 max-w-sm text-sm text-white/80">{c.summary}</p>
            </div>

            <div className="flex sm:flex-col items-center gap-4 shrink-0">
              <WeatherIcon
                condition={c.condition}
                day={c.isDay}
                className="w-28 h-28 sm:w-36 sm:h-36 drop-shadow-lg"
              />
              <div className="flex flex-wrap justify-center gap-2">
                {c.dust && (
                  <Badge className={aqiLevel(c.dust.aqi).color}>
                    대기질 {aqiLevel(c.dust.aqi).label}
                  </Badge>
                )}
                <Badge className={cloudLevel(c.clouds).color}>구름 {cloudLevel(c.clouds).label}</Badge>
              </div>
            </div>
          </div>
        </Card>
      );
    }

    function HourlyForecast({ hourly, unit }) {
      const temps = hourly.map((h) => h.temp);
      const min = Math.min(...temps);
      const max = Math.max(...temps);
      const range = Math.max(max - min, 1);

      return (
        <Card className="animate-float-in" style={{ animationDelay: '.06s' }}>
          <h2 className="mb-4 text-sm font-semibold text-white/80">시간별 예보 · 24시간 (3시간 간격)</h2>

          <div className="overflow-x-auto thin-scroll pb-2">
            <ul className="flex min-w-max gap-1" role="list">
              {hourly.map((h, i) => {
                // 기온을 막대 높이(24~72px)로 매핑
                const barHeight = 24 + ((h.temp - min) / range) * 48;
                return (
                  <li key={i} className="flex w-16 flex-col items-center gap-2 rounded-2xl py-3 transition hover:bg-white/10">
                    <span className="text-xs text-white/70">{shortHour(h.hour)}</span>
                    <WeatherIcon condition={h.condition} day={h.isDay} className="w-7 h-7" />
                    <span className={`text-[11px] tabular-nums ${h.pop >= 50 ? 'text-sky-200' : 'text-white/40'}`}>
                      {h.pop}%
                    </span>
                    <div className="flex h-[72px] flex-col items-center justify-end">
                      <span className="mb-1 text-sm font-medium text-white tabular-nums">
                        {formatTemp(h.temp, unit)}°
                      </span>
                      <div
                        className="w-1.5 rounded-full bg-gradient-to-t from-sky-400/40 to-amber-200/80"
                        style={{ height: `${barHeight}px` }}
                        aria-hidden="true"
                      />
                    </div>
                  </li>
                );
              })}
            </ul>
          </div>
        </Card>
      );
    }

    function DailyForecast({ daily, unit }) {
      const weekMin = Math.min(...daily.map((d) => d.low));
      const weekMax = Math.max(...daily.map((d) => d.high));
      const span = Math.max(weekMax - weekMin, 1);

      return (
        <Card className="animate-float-in" style={{ animationDelay: '.12s' }}>
          <h2 className="mb-3 text-sm font-semibold text-white/80">주간 예보 · {daily.length}일</h2>

          <ul role="list" className="divide-y divide-white/10">
            {daily.map((d, i) => {
              const left = ((d.low - weekMin) / span) * 100;
              const width = Math.max(((d.high - d.low) / span) * 100, 6);
              return (
                <li key={i} className="grid grid-cols-[3rem_1.75rem_2.5rem_1fr_2.5rem] items-center gap-2 py-3 sm:gap-3">
                  <span className={`text-sm ${d.isToday ? 'font-semibold text-white' : 'text-white/80'}`}>{d.day}</span>
                  <WeatherIcon condition={d.condition} className="w-7 h-7" />
                  <span className={`text-right text-xs tabular-nums ${d.pop >= 50 ? 'text-sky-200' : 'text-white/40'}`}>
                    {d.pop}%
                  </span>

                  <div className="flex items-center gap-2">
                    <span className="w-8 text-right text-sm tabular-nums text-white/50">{formatTemp(d.low, unit)}°</span>
                    <div className="relative h-1.5 flex-1 rounded-full bg-white/15" aria-hidden="true">
                      <div
                        className="absolute h-1.5 rounded-full bg-gradient-to-r from-sky-300 via-amber-200 to-orange-300"
                        style={{ left: `${left}%`, width: `${width}%` }}
                      />
                    </div>
                  </div>

                  <span className="text-right text-sm tabular-nums text-white">{formatTemp(d.high, unit)}°</span>
                </li>
              );
            })}
          </ul>
        </Card>
      );
    }

    function DetailTile({ label, value, sub, icon }) {
      return (
        <div className="rounded-2xl bg-white/5 p-4 ring-1 ring-inset ring-white/10">
          <div className="flex items-center gap-1.5 text-xs text-white/60">
            {icon}
            <span>{label}</span>
          </div>
          <p className="mt-2 text-xl font-medium text-white tabular-nums">{value}</p>
          {sub && <p className="mt-0.5 text-xs text-white/50">{sub}</p>}
        </div>
      );
    }

    function WeatherDetails({ weather, unit }) {
      const c = weather.current;
      const icon = (d) => (
        <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d={d} />
        </svg>
      );

      return (
        <Card className="animate-float-in" style={{ animationDelay: '.18s' }}>
          <h2 className="mb-4 text-sm font-semibold text-white/80">상세 정보</h2>

          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
            <DetailTile
              label="체감 온도"
              value={`${formatTemp(c.feelsLike, unit)}°`}
              sub={
                c.feelsLike - c.temp >= 1 ? '실제보다 덥게 느껴져요'
                : c.temp - c.feelsLike >= 1 ? '실제보다 춥게 느껴져요'
                : '실제 기온과 비슷해요'
              }
              icon={icon('M12 3v10a4 4 0 102 0V3a1 1 0 10-2 0z')}
            />
            <DetailTile
              label="습도"
              value={`${c.humidity}%`}
              sub={c.humidity >= 80 ? '매우 습함' : c.humidity >= 60 ? '다소 습함' : '쾌적함'}
              icon={icon('M12 3.5s5.5 6 5.5 9.5a5.5 5.5 0 11-11 0C6.5 9.5 12 3.5 12 3.5z')}
            />
            <DetailTile
              label="바람"
              value={`${c.wind.toFixed(1)} m/s`}
              sub={c.gust ? `${c.windDir}풍 · 돌풍 ${c.gust.toFixed(1)}` : `${c.windDir}풍`}
              icon={icon('M3 8h11a2.5 2.5 0 10-2.5-2.5M3 12h15a3 3 0 11-3 3M3 16h8a2 2 0 11-2 2')}
            />
            <DetailTile
              label="강수 확률"
              value={`${c.pop}%`}
              sub={`다음 3시간 · ${c.pop >= 60 ? '우산이 필요해요' : c.pop >= 30 ? '우산을 챙기면 좋아요' : '우산은 두고 가세요'}`}
              icon={icon('M7 16.5a4.5 4.5 0 01.6-9A5.5 5.5 0 0118 8.5a3.5 3.5 0 01-.5 7H7zM9 19l-.8 2M13 19l-.8 2')}
            />
            <DetailTile
              label="미세먼지"
              value={c.dust ? `${c.dust.pm10} ㎍/㎥` : '—'}
              sub={c.dust ? `초미세 ${c.dust.pm25} ㎍/㎥ · ${dustLevel(c.dust.pm10).label}` : '정보 없음'}
              icon={icon('M4 7h9M4 12h13M4 17h7')}
            />
            <DetailTile
              label="구름량"
              value={`${c.clouds}%`}
              sub={cloudLevel(c.clouds).label}
              icon={icon('M7.6 17.5h9.1a3.7 3.7 0 00.4-7.4 5.3 5.3 0 00-10.1-1.2 3.8 3.8 0 00.6 8.6z')}
            />
            <DetailTile
              label="가시거리"
              value={`${c.visibility} km`}
              sub={c.visibility < 5 ? '시야가 나빠요' : '시야가 좋아요'}
              icon={icon('M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM12 9.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z')}
            />
            <DetailTile
              label="기압"
              value={`${c.pressure} hPa`}
              sub={c.pressure < 1008 ? '저기압' : c.pressure > 1020 ? '고기압' : '평년 수준'}
              icon={icon('M12 4a8 8 0 018 8H4a8 8 0 018-8zM12 12l4-2.5')}
            />
          </div>

          <div className="mt-3 grid grid-cols-2 gap-3">
            <div className="flex items-center gap-3 rounded-2xl bg-white/5 p-4 ring-1 ring-inset ring-white/10">
              <svg viewBox="0 0 24 24" className="w-7 h-7 shrink-0" fill="none" stroke="#FBBF24" strokeWidth="1.6" strokeLinecap="round">
                <path d="M8 14a4 4 0 018 0M3 18h18M12 8V3M5.5 8.5l2 2M18.5 8.5l-2 2M9.5 5.5L12 3l2.5 2.5" />
              </svg>
              <div>
                <p className="text-xs text-white/60">일출</p>
                <p className="text-lg font-medium text-white tabular-nums">{c.sunrise}</p>
              </div>
            </div>
            <div className="flex items-center gap-3 rounded-2xl bg-white/5 p-4 ring-1 ring-inset ring-white/10">
              <svg viewBox="0 0 24 24" className="w-7 h-7 shrink-0" fill="none" stroke="#FB923C" strokeWidth="1.6" strokeLinecap="round">
                <path d="M8 14a4 4 0 018 0M3 18h18M12 3v5M5.5 8.5l2 2M18.5 8.5l-2 2M9.5 5.5L12 8l2.5-2.5" />
              </svg>
              <div>
                <p className="text-xs text-white/60">일몰</p>
                <p className="text-lg font-medium text-white tabular-nums">{c.sunset}</p>
              </div>
            </div>
          </div>
        </Card>
      );
    }

    function LoadingState() {
      return (
        <div className="flex flex-col gap-4" aria-busy="true" aria-live="polite">
          <span className="sr-only">날씨 정보를 불러오는 중입니다</span>
          <Skeleton className="h-64" />
          <Skeleton className="h-44" />
          <Skeleton className="h-72" />
        </div>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <Card className="py-12 text-center">
          <svg viewBox="0 0 24 24" className="mx-auto w-12 h-12 text-amber-300" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round">
            <path d="M12 8v5M12 16.5h.01M10.3 3.9L2.6 17.4A2 2 0 004.3 20.4h15.4a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" />
          </svg>
          <p className="mt-4 font-medium text-white">날씨 정보를 불러오지 못했어요</p>
          <p className="mx-auto mt-1 max-w-sm text-sm text-white/60">{message}</p>
          <Button variant="primary" size="md" className="mt-5" onClick={onRetry}>
            다시 시도
          </Button>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [cityId, setCityId] = useState(CITIES[0].id);
      const [unit, setUnit] = useState('C');
      const [infoOpen, setInfoOpen] = useState(false);

      const city = useMemo(() => CITIES.find((c) => c.id === cityId), [cityId]);
      const { data, loading, error, refetch } = useWeather(city);

      const toggleUnit = useCallback(() => {
        setUnit((u) => (u === 'C' ? 'F' : 'C'));
      }, []);

      // 실제 날씨와 현지 낮/밤에 따라 배경 그라디언트를 바꾼다
      const bgTone = useMemo(() => {
        if (!data) return 'from-slate-600 via-slate-700 to-slate-900';
        if (!data.current.isDay) return 'from-slate-800 via-slate-900 to-black';
        return WEATHER_META[data.current.condition].tone;
      }, [data]);

      return (
        <div className={`min-h-screen bg-gradient-to-b ${bgTone} transition-colors duration-700`}>
          <div className="mx-auto flex max-w-4xl flex-col gap-5 px-4 py-6 sm:px-6">
            <Header
              cities={CITIES}
              selectedId={cityId}
              onSelect={setCityId}
              unit={unit}
              onToggleUnit={toggleUnit}
              onRefresh={refetch}
              refreshing={loading}
            />

            <main className="flex flex-col gap-4">
              {error ? (
                <ErrorState message={error} onRetry={refetch} />
              ) : loading || !data ? (
                <LoadingState />
              ) : (
                <React.Fragment>
                  <CurrentWeather city={city} weather={data} unit={unit} />
                  <HourlyForecast hourly={data.hourly} unit={unit} />
                  <DailyForecast daily={data.daily} unit={unit} />
                  <WeatherDetails weather={data} unit={unit} />
                </React.Fragment>
              )}
            </main>

            <Footer updatedAt={data ? data.updatedAt : null} onOpenInfo={() => setInfoOpen(true)} />
          </div>

          <Modal isOpen={infoOpen} onClose={() => setInfoOpen(false)} title="데이터 출처" size="md">
            <div className="space-y-3 text-sm text-white/80">
              <p>
                모든 값은 <strong className="text-white">OpenWeatherMap</strong> 무료 API 의 실시간
                응답입니다. 도시를 바꾸거나 새로고침할 때마다 다시 호출합니다.
              </p>
              <ul className="space-y-1 text-white/70">
                <li>· <code className="rounded bg-white/10 px-1.5 py-0.5">/weather</code> — 현재 날씨</li>
                <li>· <code className="rounded bg-white/10 px-1.5 py-0.5">/forecast</code> — 5일 / 3시간 간격 예보</li>
                <li>· <code className="rounded bg-white/10 px-1.5 py-0.5">/air_pollution</code> — 미세먼지</li>
              </ul>
              <p className="text-white/60">
                시간별 예보는 무료 플랜 특성상 3시간 간격이고, 주간 예보는 3시간 예보를 현지 날짜로
                묶어 계산한 값입니다. 자외선 지수는 무료 플랜에서 제공되지 않아 구름량으로 대체했습니다.
              </p>
              <p className="text-white/60">
                상단의 <strong className="text-white/80">대기질</strong> 배지는 오존·이산화질소까지
                반영한 OpenWeatherMap 종합 지수라, 미세먼지 농도만 본 등급과 다를 수 있습니다.
              </p>
              <p className="text-white/60">
                모든 시각은 해당 도시의 현지 시간 기준입니다.
              </p>
            </div>
            <div className="mt-5 flex justify-end">
              <Button variant="primary" size="md" onClick={() => setInfoOpen(false)}>
                확인
              </Button>
            </div>
          </Modal>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
