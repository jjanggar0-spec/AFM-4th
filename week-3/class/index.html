// 🛠 Utils

function formatViews(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '억';
  if (n >= 10000) return Math.round(n / 10000).toLocaleString() + '만';
  return n.toLocaleString();
}

function formatDate(iso) {
  const parts = iso.split('-');
  return Number(parts[1]) + '/' + parts[2];
}

function Badge({ children, variant = 'default', className = '' }) {
  const variants = {
    default: 'bg-slate-800 text-slate-300 ring-slate-700',
    accent: 'bg-pink-500/15 text-pink-300 ring-pink-500/30',
    warn: 'bg-amber-500/15 text-amber-300 ring-amber-500/30',
    muted: 'bg-slate-800/60 text-slate-400 ring-slate-700/60'
  };
  return (
    <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset ${variants[variant]} ${className}`}>
      {children}
    </span>
  );
}

function Card({ children, className = '' }) {

}

function Button({ children, variant = 'primary', size = 'md', className = '', ...rest }) {

    primary: 'bg-white text-slate-900 hover:bg-slate-200',
    secondary: 'bg-slate-800 text-slate-100 hover:bg-slate-700 ring-1 ring-slate-700',
    ghost: 'text-slate-300 hover:bg-slate-800/70'
  };
  const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-5 py-2.5 text-base' };
  return (
    <button
      className={`inline-flex items-center justify-center gap-2 rounded-lg font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-pink-400 disabled:opacity-50 ${variants[variant]} ${sizes[size]} ${className}`}
      {...rest}
    >
      {children}
    </button>
  );
}

function Modal({ isOpen, onClose, title, children }) {
  useEffect(() => {
    if (!isOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = prev;
    };
  }, [isOpen, onClose]);

  if (!isOpen) return null;
  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4"
      role="dialog"
      aria-modal="true"
      aria-label={title}
      onClick={onClose}
    >
      <div
        className="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-slate-900 ring-1 ring-slate-700 no-scrollbar"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-start justify-between gap-4 border-b border-slate-800 p-5">
          <h3 className="text-lg font-bold">{title}</h3>
          <button
            onClick={onClose}
            aria-label="닫기"
            className="rounded-lg p-1.5 text-slate-400 transition hover:bg-slate-800 hover:text-white"
          >
            <svg className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
            </svg>
          </button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function Tabs({ tabs, value, onChange }) {
  return (
    <div className="flex flex-wrap gap-2" role="tablist">
      {tabs.map((t) => (
        <button
          key={t.value}
          role="tab"
          aria-selected={value === t.value}
          onClick={() => onChange(t.value)}
          className={`rounded-full px-4 py-2 text-sm font-semibold transition ${
            value === t.value
              ? 'bg-white text-slate-900'
              : 'bg-slate-900 text-slate-400 ring-1 ring-slate-800 hover:text-slate-200'
          }`}
        >
          {t.label}
          <span className="ml-1.5 text-xs opacity-60">{t.count}</span>
        </button>
      ))}
    </div>
  );
}

      style={{ aspectRatio: '9 / 16' }}
      aria-label={`${post.title} 자세히 보기`}
    >
      {failed ? (
        <div className="flex h-full w-full flex-col items-center justify-center gap-2 p-3 text-center text-slate-500">
          <svg className="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" aria-hidden="true">

          </svg>
          <span className="text-[11px] leading-tight">썸네일 없음</span>
        </div>
      ) : (
        <img
          src={THUMB(post.code)}
          alt={`${post.title} 썸네일`}
          loading="lazy"
          onError={() => setFailed(true)}
          className="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        />
      )}
      <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/50 to-transparent p-3 pt-8 text-left">
        <p className="truncate text-xs font-semibold text-white">{post.title}</p>
        <p className="mt-0.5 flex items-center gap-1.5 text-[11px] text-slate-300">
          <svg className="h-3 w-3 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M4 4.5A1.5 1.5 0 0 1 6.23 3.2l9.1 5.5a1.5 1.5 0 0 1 0 2.6l-9.1 5.5A1.5 1.5 0 0 1 4 15.5v-11Z" />
          </svg>
          {formatViews(post.views)}
          <span className="opacity-50">·</span>
          {formatDate(post.date)}
        </p>
      </div>
    </button>
  );
}

        <p className="mt-1">썸네일과 지표는 각 게시물 소유자에게 저작권이 있으며, 리서치 인용 목적으로만 사용했습니다.</p>
      </div>
    </footer>
  );
}

// ========================================
// 📄 Page Sections
// ========================================
function MethodSection() {
  return (
    <section className="mt-16">
      <h2 className="text-2xl font-black tracking-tight sm:text-3xl">조사 방법</h2>
      <Card className="mt-4 border-l-2 border-amber-500/50 p-5">
        <p className="text-sm leading-relaxed text-slate-300">
          <strong className="font-bold text-amber-300">#댄스챌린지 태그를 그대로 훑는 방식은 쓸모가 없었습니다.</strong>{' '}
          인스타그램 웹 검색이 최신순이 아닌 <strong className="text-white">관련도순</strong>으로 정렬되기 때문에,
          상위 결과가 학교·기업 이벤트 공지나 2024년 게시물로 채워졌기 때문입니다. 그래서 아래 순서로 접근했습니다.
        </p>
      </Card>
      <div className="mt-4 grid gap-4 sm:grid-cols-3">
        {RESEARCH.method.map((m) => (
          <Card key={m.step} className="p-5">
            <span className="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-slate-800 text-sm font-black text-pink-400">
              {m.step}
            </span>
            <h3 className="mt-3 font-bold text-white">{m.title}</h3>
            <p className="mt-1.5 text-sm leading-relaxed text-slate-400">{m.body}</p>
          </Card>
        ))}
      </div>
    </section>
  );
}

function ExcludedSection() {
  return (
    <section className="mt-16">
      <h2 className="text-2xl font-black tracking-tight sm:text-3xl">제외한 항목</h2>
      <div className="mt-4 grid gap-4">
        {RESEARCH.excluded.map((e) => (
          <Card key={e.name} className="p-5">
            <div className="flex flex-wrap items-center gap-2">
              <h3 className="text-lg font-bold text-slate-300 line-through decoration-slate-600">{e.name}</h3>
              <span className="text-sm text-slate-500">{e.artist}</span>
              <Badge variant="warn">최근 120일 게시물 0건</Badge>
            </div>
            <p className="mt-2 text-sm leading-relaxed text-slate-400">{e.reason}</p>
          </Card>
        ))}
      </div>
    </section>
  );
}

function LimitsSection() {
  return (
    <section className="mt-16">
      <h2 className="text-2xl font-black tracking-tight sm:text-3xl">한계</h2>
      <Card className="mt-4 p-5">
        <ul className="space-y-3">
          {RESEARCH.limits.map((l, i) => (
            <li key={i} className="flex gap-3 text-sm leading-relaxed text-slate-400">
              <span className="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-slate-600" aria-hidden="true" />
              {l}
            </li>
          ))}
        </ul>
      </Card>
    </section>
  );
}

function PostModal({ state, onClose }) {
  const [failed, setFailed] = useState(false);
  const post = state ? state.post : null;
  const challenge = state ? state.challenge : null;

  useEffect(() => { setFailed(false); }, [post ? post.code : null]);

  if (!post) return null;
  return (
    <Modal isOpen={true} onClose={onClose} title={`${challenge.name} · ${post.title}`}>
      <div className="grid gap-5 sm:grid-cols-[220px_1fr]">
        <div className="overflow-hidden rounded-xl bg-slate-800 ring-1 ring-slate-700" style={{ aspectRatio: '9 / 16' }}>
          {failed ? (
            <div className="flex h-full items-center justify-center text-sm text-slate-500">썸네일 없음</div>
          ) : (
            <img
              src={THUMB(post.code)}
              alt={`${post.title} 썸네일`}
              onError={() => setFailed(true)}
              className="h-full w-full object-cover"
            />
          )}
        </div>
        <div className="min-w-0">
          <div className="flex flex-wrap gap-2">
            <Badge variant="accent">{challenge.name}</Badge>
            <Badge variant="muted">{challenge.artist}</Badge>
          </div>
          <dl className="mt-4 space-y-3 text-sm">
            <div className="flex justify-between gap-4 border-b border-slate-800 pb-2">
              <dt className="text-slate-500">계정</dt>
              <dd className="font-semibold text-slate-200">{post.account}</dd>
            </div>
            <div className="flex justify-between gap-4 border-b border-slate-800 pb-2">
              <dt className="text-slate-500">업로드</dt>
              <dd className="font-semibold tabular-nums text-slate-200">{post.date}</dd>
            </div>
            <div className="flex justify-between gap-4 border-b border-slate-800 pb-2">
              <dt className="text-slate-500">조회수</dt>
              <dd className="font-semibold tabular-nums text-slate-200">
                {formatViews(post.views)}
                <span className="ml-1.5 text-xs font-normal text-slate-500">({post.views.toLocaleString()})</span>
              </dd>
            </div>
            <div className="flex justify-between gap-4">
              <dt className="text-slate-500">게시물 코드</dt>
              <dd className="font-mono text-xs text-slate-400">{post.code}</dd>
            </div>
          </dl>
          <a href={REEL(post.code)} target="_blank" rel="noopener noreferrer" className="mt-5 block">
            <Button className="w-full" size="lg">
              인스타그램에서 보기
              <svg className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M11 3a1 1 0 1 0 0 2h1.586l-5.293 5.293a1 1 0 1 0 1.414 1.414L14 6.414V8a1 1 0 1 0 2 0V4a1 1 0 0 0-1-1h-4Z" />
                <path d="M5 5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3a1 1 0 1 0-2 0v3H5V7h3a1 1 0 0 0 0-2H5Z" />
              </svg>
            </Button>
          </a>
        </div>
      </div>
    </Modal>
  );
}

// ========================================
// 🚀 App
// ========================================
function App() {
  const [filter, setFilter] = useState('all');
  const [modalState, setModalState] = useState(null);

  const tabs = useMemo(() => [
    { value: 'all', label: '전체', count: RESEARCH.challenges.length },
    { value: 'top', label: 'TOP 3', count: RESEARCH.challenges.filter((c) => c.tier === 'top').length },
    { value: 'other', label: '그 외', count: RESEARCH.challenges.filter((c) => c.tier === 'other').length }
  ], []);

  const visible = useMemo(
    () => RESEARCH.challenges.filter((c) => filter === 'all' || c.tier === filter),
    [filter]
  );

  const totalPosts = useMemo(
    () => RESEARCH.challenges.reduce((s, c) => s + c.posts.length, 0),
    []
  );

  const openPost = useCallback((post, challenge) => setModalState({ post, challenge }), []);
  const closeModal = useCallback(() => setModalState(null), []);

  return (
    <div className="min-h-screen">
      <Header />

      <main className="mx-auto max-w-6xl px-5 pb-16">
        <section className="-mt-6 grid grid-cols-2 gap-4 sm:grid-cols-4">
          <StatTile label="수집 게시물" value={RESEARCH.stats.fetched} sub="10개 키워드" />
          <StatTile label="최근 90일" value={RESEARCH.stats.recent90d} sub="분석 대상" />
          <StatTile label="식별 챌린지" value={RESEARCH.stats.challenges} sub="검증 완료" />
          <StatTile label="대표 게시물" value={totalPosts} sub="썸네일 수록" />
        </section>

        <section className="mt-16">
          <div className="flex flex-wrap items-end justify-between gap-4">
            <h2 className="text-2xl font-black tracking-tight sm:text-3xl">챌린지별 정리</h2>
            <Tabs tabs={tabs} value={filter} onChange={setFilter} />
          </div>

          <div className="mt-6 space-y-6">
            {visible.length === 0 ? (
              <Card className="p-10 text-center text-slate-500">해당하는 챌린지가 없습니다.</Card>
            ) : (
              visible.map((c) => (
                <ChallengeCard key={c.id} challenge={c} onOpenPost={openPost} />
              ))
            )}
          </div>
          <p className="mt-4 text-xs text-slate-500">
            썸네일을 클릭하면 상세 정보와 원본 게시물 링크가 열립니다.
          </p>
        </section>

        <MethodSection />
        <ExcludedSection />
        <LimitsSection />
      </main>

      <Footer />
      <PostModal state={modalState} onClose={closeModal} />
    </div>
  );
}

// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
