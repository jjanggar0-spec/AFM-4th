  <!-- 그릇 테두리 하이라이트 -->
  <ellipse cx="400" cy="352" rx="248" ry="92" fill="none" stroke="#3f596f" stroke-width="7"/>
  <path d="M196 306 C 250 274, 340 262, 400 262" fill="none" stroke="#7d9bb8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- 젓가락 -->
  <g stroke="#c8895a" stroke-width="9" stroke-linecap="round">
    <path d="M624 200 L 470 320"/>
    <path d="M652 224 L 500 340"/>
  </g>

  <text x="400" y="586" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="8" fill="#e8b48a" opacity="0.75">매콤 짬뽕</text>
</svg>
