<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR 코드 생성기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ CDN 버전 고정 필수. Babel 은 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <!-- QR 코드 생성 라이브러리 (UMD 브라우저 번들, window.QRCode 노출)
       1.5.x 는 npm 패키지에 build/ 번들이 없어 CDN 에서 404 → 1.4.4 로 고정 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <style>
    /* Tailwind 로 표현하기 어려운 진입 애니메이션 */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp .35s ease-out both; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    .animate-pop-in { animation: popIn .28s cubic-bezier(.34,1.4,.64,1) both; }

    /* 투명 배경 QR 을 눈으로 확인할 수 있도록 체커보드 패턴 */
    .checkerboard {
      background-image:
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    /* color input 의 기본 여백/테두리 제거 */
    input[type="color"] { -webkit-appearance: none; appearance: none; padding: 0; border: none; background: none; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: .5rem; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ========================================
    // 🔧 Constants & Utilities
    // ========================================

    const HISTORY_KEY = 'qr-generator-history';
    const HISTORY_LIMIT = 8;

    const SIZE_OPTIONS = [
      { label: '작게', value: 256 },
      { label: '보통', value: 512 },
      { label: '크게', value: 1024 },
    ];

    // 오류 정정 레벨: 높을수록 훼손에 강하지만 패턴이 촘촘해진다
    const ECC_OPTIONS = [
      { label: 'L · 7%', value: 'L' },
      { label: 'M · 15%', value: 'M' },
      { label: 'Q · 25%', value: 'Q' },
      { label: 'H · 30%', value: 'H' },
    ];

    const PRESETS = [
      { label: '기본',     dark: '#0f172a', light: '#ffffff' },
      { label: '인디고',   dark: '#4338ca', light: '#eef2ff' },
      { label: '포레스트', dark: '#166534', light: '#f0fdf4' },
      { label: '와인',     dark: '#9f1239', light: '#fff1f2' },
      { label: '반전',     dark: '#f8fafc', light: '#0f172a' },
    ];

    /**
     * 사용자가 입력한 주소를 정규화한다.
     * - 앞뒤 공백 제거
     * - 스킴이 없으면 https:// 를 붙여준다 (naver.com → https://naver.com)
     */
    function normalizeUrl(raw) {
      const trimmed = (raw || '').trim();
      if (!trimmed) return '';
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed)) return trimmed;
      if (/^(mailto:|tel:)/i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    /**
     * 정규화된 주소가 실제로 유효한 URL 인지 검사한다.
     * 반환: { valid, url, message }
     */
    function validateUrl(raw) {
      const trimmed = (raw || '').trim();
      if (!trimmed) return { valid: false, url: '', message: '' };

      const url = normalizeUrl(trimmed);
      try {
        const parsed = new URL(url);
        // http(s) 인데 호스트에 점이 없고 localhost 도 아니면 주소로 보기 어렵다
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
          const host = parsed.hostname;
          if (!host || (!host.includes('.') && host !== 'localhost')) {
            return { valid: false, url, message: '도메인 형식이 올바르지 않아요. (예: example.com)' };
          }
        }
        return { valid: true, url, message: '' };
      } catch (e) {
        return { valid: false, url, message: '웹사이트 주소 형식이 올바르지 않아요.' };
      }
    }

    // QRCode 는 잘못된 hex 를 만나면 예외를 던지므로, 넘기기 전에 항상 검증한다
    const HEX_RE = /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i;

    function isHex(value) {
      return HEX_RE.test((value || '').trim());
    }

    /** 유효한 hex 면 그대로, 아니면 fallback 을 돌려준다 */
    function safeHex(value, fallback) {
      return isHex(value) ? value.trim() : fallback;
    }

    /** input[type=color] 는 6자리 hex 만 받으므로 축약/알파 표기를 잘라 맞춘다 */
    function toSwatchHex(value, fallback) {
      const hex = safeHex(value, fallback);
      if (hex.length === 4) {
        // #abc → #aabbcc
        return '#' + hex.slice(1).split('').map((c) => c + c).join('');
      }
      return hex.slice(0, 7);
    }

    /** 다운로드 파일명에 쓸 수 있도록 호스트명을 안전하게 변환 */
    function toFileName(url) {
      try {
        const host = new URL(url).hostname.replace(/^www\./, '');
        return 'qr-' + host.replace(/[^a-z0-9.-]/gi, '-');
      } catch (e) {
        return 'qr-code';
      }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter((v) => typeof v === 'string') : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
      } catch (e) {
        /* 시크릿 모드 등에서 실패할 수 있으므로 조용히 무시 */
      }
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({
      children,
      variant = 'primary',
      size = 'md',
      disabled = false,
      type = 'button',
      onClick,
      className = '',
      ...rest
    }) {
      const base =
        'inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition ' +
        'focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-500 ' +
        'disabled:opacity-40 disabled:cursor-not-allowed';

      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800 shadow-sm',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 active:bg-slate-100',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 active:bg-rose-800',
        ghost: 'bg-transparent text-slate-600 hover:bg-slate-200/70 active:bg-slate-300/70',
      };

      const sizes = {
        sm: 'text-sm px-3 py-1.5',
        md: 'text-sm px-4 py-2.5',
        lg: 'text-base px-6 py-3',
      };

      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant] || variants.primary} ${sizes[size] || sizes.md} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({
      label,
      type = 'text',
      value,
      onChange,
      placeholder = '',
      error = '',
      hint = '',
      disabled = false,
      id,
      className = '',
      ...rest
    }) {
      const inputId = id || `input-${label || 'field'}`;
      const describedBy = error ? `${inputId}-error` : hint ? `${inputId}-hint` : undefined;

      return (
        <div className={className}>
          {label && (
            <label htmlFor={inputId} className="block text-sm font-semibold text-slate-700 mb-1.5">
              {label}
            </label>
          )}
          <input
            id={inputId}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={error ? 'true' : 'false'}
            aria-describedby={describedBy}
            className={
              'w-full rounded-xl border px-4 py-3 text-slate-800 placeholder:text-slate-400 transition ' +
              'focus:outline-none focus:ring-2 disabled:bg-slate-100 disabled:text-slate-400 ' +
              (error
                ? 'border-rose-400 focus:border-rose-500 focus:ring-rose-200'
                : 'border-slate-300 focus:border-indigo-500 focus:ring-indigo-200')
            }
            {...rest}
          />
          {error ? (
            <p id={`${inputId}-error`} role="alert" className="mt-1.5 text-sm text-rose-600">
              {error}
            </p>
          ) : hint ? (
            <p id={`${inputId}-hint`} className="mt-1.5 text-sm text-slate-500 break-all">
              {hint}
            </p>
          ) : null}
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm ring-1 ring-slate-200/70 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, tone = 'slate', className = '' }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-600',
        indigo: 'bg-indigo-100 text-indigo-700',
        emerald: 'bg-emerald-100 text-emerald-700',
        rose: 'bg-rose-100 text-rose-700',
      };
      return (
        <span
          className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ${tones[tone] || tones.slate} ${className}`}
        >
          {children}
        </span>
      );
    }

    /** 라디오처럼 동작하는 세그먼트 토글 */
    function SegmentedControl({ label, options, value, onChange }) {
      return (
        <div>
          {label && <p className="text-sm font-semibold text-slate-700 mb-1.5">{label}</p>}
          <div role="radiogroup" aria-label={label} className="flex gap-1 rounded-xl bg-slate-100 p-1">
            {options.map((opt) => {
              const active = opt.value === value;
              return (
                <button
                  key={opt.value}
                  type="button"
                  role="radio"
                  aria-checked={active}
                  onClick={() => onChange(opt.value)}
                  className={
                    'flex-1 rounded-lg px-2 py-1.5 text-sm font-semibold transition ' +
                    'focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 ' +
                    (active ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700')
                  }
                >
                  {opt.label}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function Toggle({ label, description, checked, onChange, id }) {
      const toggleId = id || `toggle-${label}`;
      return (
        <div className="flex items-start justify-between gap-4">
          <div>
            <label htmlFor={toggleId} className="cursor-pointer text-sm font-semibold text-slate-700">
              {label}
            </label>
            {description && <p className="mt-0.5 text-xs text-slate-500">{description}</p>}
          </div>
          <button
            id={toggleId}
            type="button"
            role="switch"
            aria-checked={checked}
            aria-label={label}
            onClick={() => onChange(!checked)}
            className={
              'relative h-6 w-11 shrink-0 rounded-full transition focus:outline-none ' +
              'focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-500 ' +
              (checked ? 'bg-indigo-600' : 'bg-slate-300')
            }
          >
            <span
              className={
                'absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all ' +
                (checked ? 'left-[1.375rem]' : 'left-0.5')
              }
            />
          </button>
        </div>
      );
    }

    function ColorField({ label, value, onChange, fallback = '#000000' }) {
      const valid = isHex(value);

      return (
        <div>
          <p className="mb-1.5 text-sm font-semibold text-slate-700">{label}</p>
          <div
            className={
              'flex items-center gap-2 rounded-xl border p-1.5 transition ' +
              (valid
                ? 'border-slate-300 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-200'
                : 'border-rose-400 focus-within:ring-2 focus-within:ring-rose-200')
            }
          >
            <input
              type="color"
              aria-label={label}
              value={toSwatchHex(value, fallback)}
              onChange={(e) => onChange(e.target.value)}
              className="h-8 w-8 shrink-0 cursor-pointer rounded-lg"
            />
            <input
              type="text"
              aria-label={`${label} 색상 코드`}
              aria-invalid={valid ? 'false' : 'true'}
              value={value}
              onChange={(e) => onChange(e.target.value)}
              className="w-full min-w-0 bg-transparent font-mono text-sm uppercase text-slate-700 focus:outline-none"
            />
          </div>
          {!valid && <p className="mt-1 text-xs text-rose-600">#RRGGBB 형식으로 입력해 주세요.</p>}
        </div>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================

    function Header() {
      return (
        <header className="mb-8 text-center">
          <div className="mb-4 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/25">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="h-7 w-7" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3" strokeLinecap="round" />
            </svg>
          </div>
          <h1 className="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">
            QR 코드 생성기
          </h1>
          <p className="mt-2 text-slate-500">웹사이트 주소를 입력하면 바로 QR 코드로 바꿔 드려요.</p>
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="mt-10 text-center text-xs text-slate-400">
          <p>모든 변환은 브라우저 안에서만 처리됩니다. 입력한 주소는 서버로 전송되지 않아요.</p>
        </footer>
      );
    }

    /** 복사·다운로드 피드백용 토스트 */
    function Toast({ message }) {
      if (!message) return null;
      return (
        <div role="status" aria-live="polite" className="animate-fade-up fixed bottom-6 left-1/2 z-50 -translate-x-1/2">
          <div className="flex items-center gap-2 rounded-full bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-xl">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="h-4 w-4 text-emerald-400" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
            {message}
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Feature Components
    // ========================================

    /**
     * QR 미리보기.
     * canvas 는 부모가 ref 로 소유한다(다운로드·복사에 필요). 여기서는 표시 상태만 담당하고,
     * ref 유실을 막기 위해 canvas 는 항상 DOM 에 두고 보이기 여부만 토글한다.
     */
    function QrPreview({ canvasRef, status, error, transparent }) {
      const isReady = status === 'ready';

      return (
        <div
          className={
            'relative flex aspect-square items-center justify-center rounded-2xl border-2 border-dashed p-6 ' +
            (isReady ? 'border-transparent bg-slate-50' : 'border-slate-200 bg-slate-50/60')
          }
        >
          {/* 1024px 캔버스도 컨테이너를 넘지 않도록 래퍼·캔버스 모두 폭을 제한한다 */}
          <div
            className={
              `min-w-0 max-w-full ${isReady ? 'block' : 'hidden'} ` +
              (transparent ? 'checkerboard rounded-xl' : '')
            }
          >
            <canvas
              ref={canvasRef}
              role="img"
              aria-label="생성된 QR 코드"
              className="animate-pop-in block h-auto max-w-full rounded-xl"
            />
          </div>

          {status === 'idle' && (
            <div className="px-4 text-center">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="mx-auto h-14 w-14 text-slate-300" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <path d="M14 14h3v3h-3zM18 18h3v3h-3z" />
              </svg>
              <p className="mt-3 text-sm font-medium text-slate-500">아직 만들어진 QR 코드가 없어요</p>
              <p className="mt-1 text-xs text-slate-400">주소를 입력하면 자동으로 나타납니다.</p>
            </div>
          )}

          {status === 'loading' && (
            <div className="text-center">
              <div className="mx-auto h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-indigo-600" />
              <p className="mt-3 text-sm text-slate-500">QR 코드를 만드는 중…</p>
            </div>
          )}

          {status === 'error' && (
            <div className="px-4 text-center">
              <div className="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-rose-100">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="h-6 w-6 text-rose-600" aria-hidden="true">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 8v5M12 16.5v.5" strokeLinecap="round" />
                </svg>
              </div>
              <p className="mt-3 text-sm font-semibold text-rose-700">QR 코드를 만들지 못했어요</p>
              <p className="mt-1 break-keep text-xs text-slate-500">{error}</p>
            </div>
          )}
        </div>
      );
    }

    function HistoryList({ items, onSelect, onClear }) {
      if (items.length === 0) return null;

      return (
        <Card className="mt-6 p-5 sm:p-6">
          <div className="mb-3 flex items-center justify-between">
            <h2 className="text-sm font-bold text-slate-800">최근 만든 주소</h2>
            <Button variant="ghost" size="sm" onClick={onClear}>
              전체 삭제
            </Button>
          </div>
          <ul className="flex flex-wrap gap-2">
            {items.map((item) => (
              <li key={item}>
                <button
                  type="button"
                  onClick={() => onSelect(item)}
                  title={item}
                  className="max-w-[16rem] truncate rounded-lg bg-slate-100 px-3 py-1.5 text-xs font-medium text-slate-600 transition hover:bg-indigo-100 hover:text-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
                >
                  {item.replace(/^https?:\/\//, '')}
                </button>
              </li>
            ))}
          </ul>
        </Card>
      );
    }

    // ========================================
    // 📄 Page Component
    // ========================================

    function QrGeneratorPage() {
      // --- 입력 & 옵션 ---
      const [rawUrl, setRawUrl] = useState('');
      const [size, setSize] = useState(512);
      const [ecc, setEcc] = useState('M');
      const [dark, setDark] = useState('#0f172a');
      const [light, setLight] = useState('#ffffff');
      const [transparent, setTransparent] = useState(false);
      const [quietZone, setQuietZone] = useState(true);

      // --- 생성 결과 ---
      const [status, setStatus] = useState('idle'); // idle | loading | ready | error
      const [renderError, setRenderError] = useState('');
      const [renderedUrl, setRenderedUrl] = useState('');
      const [toast, setToast] = useState('');

      // --- 히스토리 ---
      const [history, setHistory] = useState(loadHistory);

      const canvasRef = useRef(null);
      const toastTimer = useRef(null);

      const validation = useMemo(() => validateUrl(rawUrl), [rawUrl]);
      const touched = rawUrl.trim().length > 0;

      const showToast = useCallback((message) => {
        setToast(message);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(''), 2200);
      }, []);

      useEffect(() => {
        return () => {
          if (toastTimer.current) clearTimeout(toastTimer.current);
        };
      }, []);

      // QRCode 라이브러리에 넘길 옵션
      const qrOptions = useMemo(
        () => ({
          errorCorrectionLevel: ecc,
          width: size,
          margin: quietZone ? 2 : 0,
          color: {
            // 입력 중인 불완전한 hex 로 예외가 나지 않도록 항상 검증해서 넘긴다
            dark: safeHex(dark, '#000000'),
            // 투명 배경은 알파 00 (#RRGGBBAA) 으로 지정한다
            light: transparent ? '#00000000' : safeHex(light, '#ffffff'),
          },
        }),
        [ecc, size, quietZone, dark, light, transparent]
      );

      // --- 주소/옵션이 바뀌면 디바운스 후 자동 생성 ---
      useEffect(() => {
        if (!validation.valid) {
          setStatus('idle');
          setRenderedUrl('');
          return;
        }

        let cancelled = false;
        setStatus('loading');

        const timer = setTimeout(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          if (!window.QRCode) {
            setStatus('error');
            setRenderError('QR 라이브러리를 불러오지 못했어요. 네트워크 연결을 확인해 주세요.');
            return;
          }

          window.QRCode.toCanvas(canvas, validation.url, qrOptions)
            .then(() => {
              if (cancelled) return;
              setRenderedUrl(validation.url);
              setRenderError('');
              setStatus('ready');
            })
            .catch((err) => {
              if (cancelled) return;
              setStatus('error');
              setRenderError(
                err && err.message
                  ? `주소가 너무 길거나 옵션이 맞지 않아요. (${err.message})`
                  : '알 수 없는 오류가 발생했어요.'
              );
            });
        }, 350);

        return () => {
          cancelled = true;
          clearTimeout(timer);
        };
      }, [validation.valid, validation.url, qrOptions]);

      // --- 실제로 생성에 성공한 주소만 히스토리에 남긴다 ---
      useEffect(() => {
        if (status !== 'ready' || !renderedUrl) return;

        setHistory((prev) => {
          if (prev[0] === renderedUrl) return prev;
          const next = [renderedUrl, ...prev.filter((u) => u !== renderedUrl)].slice(0, HISTORY_LIMIT);
          saveHistory(next);
          return next;
        });
      }, [status, renderedUrl]);

      // --- 액션 ---

      const handleDownloadPng = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas || status !== 'ready') return;

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `${toFileName(renderedUrl)}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('PNG 파일을 저장했어요');
      }, [status, renderedUrl, showToast]);

      const handleDownloadSvg = useCallback(() => {
        if (status !== 'ready' || !window.QRCode) return;

        // 브라우저 번들의 toString 은 항상 SVG 문자열을 반환한다
        window.QRCode.toString(renderedUrl, qrOptions)
          .then((svg) => {
            const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const href = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = href;
            link.download = `${toFileName(renderedUrl)}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(href);
            showToast('SVG 파일을 저장했어요');
          })
          .catch(() => showToast('SVG 저장에 실패했어요'));
      }, [status, renderedUrl, qrOptions, showToast]);

      const handleCopyImage = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas || status !== 'ready') return;

        // ClipboardItem 미지원 브라우저 대비
        if (!navigator.clipboard || typeof window.ClipboardItem === 'undefined') {
          showToast('이 브라우저는 이미지 복사를 지원하지 않아요');
          return;
        }

        canvas.toBlob((blob) => {
          if (!blob) {
            showToast('이미지 복사에 실패했어요');
            return;
          }
          navigator.clipboard
            .write([new window.ClipboardItem({ 'image/png': blob })])
            .then(() => showToast('QR 이미지를 복사했어요'))
            .catch(() => showToast('이미지 복사 권한이 없어요'));
        }, 'image/png');
      }, [status, showToast]);

      const handleCopyUrl = useCallback(() => {
        if (!renderedUrl) return;
        if (!navigator.clipboard) {
          showToast('이 브라우저는 복사를 지원하지 않아요');
          return;
        }
        navigator.clipboard
          .writeText(renderedUrl)
          .then(() => showToast('주소를 복사했어요'))
          .catch(() => showToast('주소 복사에 실패했어요'));
      }, [renderedUrl, showToast]);

      const handleReset = useCallback(() => {
        setRawUrl('');
        setStatus('idle');
        setRenderedUrl('');
        setRenderError('');
      }, []);

      const handleClearHistory = useCallback(() => {
        setHistory([]);
        saveHistory([]);
      }, []);

      const applyPreset = useCallback((preset) => {
        setDark(preset.dark);
        setLight(preset.light);
        setTransparent(false);
      }, []);

      const isReady = status === 'ready';

      return (
        <div className="min-h-screen px-4 py-10 sm:py-14">
          <div className="mx-auto w-full max-w-5xl">
            <Header />

            <div className="grid grid-cols-1 gap-6 lg:grid-cols-5">
              {/* ---------- 입력 & 옵션 ---------- */}
              <Card className="animate-fade-up p-5 sm:p-7 lg:col-span-3">
                <Input
                  id="website-url"
                  label="웹사이트 주소"
                  type="url"
                  inputMode="url"
                  autoComplete="url"
                  autoFocus
                  value={rawUrl}
                  onChange={(e) => setRawUrl(e.target.value)}
                  placeholder="example.com 또는 https://example.com"
                  error={touched && !validation.valid ? validation.message : ''}
                  hint={
                    !touched
                      ? 'https:// 는 생략해도 됩니다. 입력하면 자동으로 QR 코드가 만들어져요.'
                      : validation.valid
                      ? `변환 대상 · ${validation.url}`
                      : ''
                  }
                />

                <div className="mt-6 space-y-5">
                  <SegmentedControl
                    label="크기"
                    options={SIZE_OPTIONS.map((o) => ({ ...o, label: `${o.label} (${o.value}px)` }))}
                    value={size}
                    onChange={setSize}
                  />

                  <div>
                    <SegmentedControl
                      label="오류 정정 수준"
                      options={ECC_OPTIONS}
                      value={ecc}
                      onChange={setEcc}
                    />
                    <p className="mt-1.5 text-xs text-slate-500">
                      수준이 높을수록 인쇄물이 훼손돼도 잘 읽히지만, 패턴이 촘촘해집니다.
                    </p>
                  </div>

                  <div>
                    <p className="mb-1.5 text-sm font-semibold text-slate-700">색상 프리셋</p>
                    <div className="flex flex-wrap gap-2">
                      {PRESETS.map((preset) => {
                        const active = !transparent && preset.dark === dark && preset.light === light;
                        return (
                          <button
                            key={preset.label}
                            type="button"
                            onClick={() => applyPreset(preset)}
                            aria-pressed={active}
                            className={
                              'flex items-center gap-2 rounded-lg border px-3 py-1.5 text-xs font-semibold transition ' +
                              'focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 ' +
                              (active
                                ? 'border-indigo-500 bg-indigo-50 text-indigo-700'
                                : 'border-slate-200 text-slate-600 hover:border-slate-300 hover:bg-slate-50')
                            }
                          >
                            <span
                              className="h-4 w-4 rounded-full ring-1 ring-slate-300"
                              style={{ background: `linear-gradient(135deg, ${preset.dark} 50%, ${preset.light} 50%)` }}
                              aria-hidden="true"
                            />
                            {preset.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <ColorField label="QR 색상" value={dark} onChange={setDark} fallback="#000000" />
                    <div className={transparent ? 'pointer-events-none opacity-40' : ''}>
                      <ColorField label="배경 색상" value={light} onChange={setLight} fallback="#ffffff" />
                    </div>
                  </div>

                  <div className="space-y-4 rounded-xl bg-slate-50 p-4">
                    <Toggle
                      label="투명 배경"
                      description="배경 없이 QR 패턴만 PNG 로 저장합니다."
                      checked={transparent}
                      onChange={setTransparent}
                    />
                    <div className="h-px bg-slate-200" />
                    <Toggle
                      label="여백(Quiet Zone)"
                      description="스캔 인식률을 위해 테두리 여백을 남깁니다. 권장."
                      checked={quietZone}
                      onChange={setQuietZone}
                    />
                  </div>
                </div>
              </Card>

              {/* ---------- 미리보기 & 저장 ---------- */}
              <div className="animate-fade-up lg:col-span-2">
                <Card className="p-5 sm:p-6 lg:sticky lg:top-6">
                  <div className="mb-4 flex items-center justify-between">
                    <h2 className="text-sm font-bold text-slate-800">미리보기</h2>
                    {isReady ? (
                      <Badge tone="emerald">
                        <span className="h-1.5 w-1.5 rounded-full bg-emerald-500" aria-hidden="true" />
                        준비 완료
                      </Badge>
                    ) : (
                      <Badge>대기 중</Badge>
                    )}
                  </div>

                  <QrPreview
                    canvasRef={canvasRef}
                    status={status}
                    error={renderError}
                    transparent={transparent}
                  />

                  {isReady && (
                    <p className="mt-3 truncate text-center font-mono text-xs text-slate-500" title={renderedUrl}>
                      {renderedUrl}
                    </p>
                  )}

                  <div className="mt-5 grid grid-cols-2 gap-2">
                    <Button onClick={handleDownloadPng} disabled={!isReady}>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="h-4 w-4" aria-hidden="true">
                        <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" strokeLinecap="round" strokeLinejoin="round" />
                      </svg>
                      PNG 저장
                    </Button>
                    <Button variant="secondary" onClick={handleDownloadSvg} disabled={!isReady}>
                      SVG 저장
                    </Button>
                    <Button variant="secondary" onClick={handleCopyImage} disabled={!isReady}>
                      이미지 복사
                    </Button>
                    <Button variant="secondary" onClick={handleCopyUrl} disabled={!isReady}>
                      주소 복사
                    </Button>
                  </div>

                  <Button variant="ghost" size="sm" onClick={handleReset} disabled={!touched} className="mt-2 w-full">
                    초기화
                  </Button>
                </Card>
              </div>
            </div>

            <HistoryList items={history} onSelect={(url) => setRawUrl(url)} onClear={handleClearHistory} />

            <Footer />
          </div>

          <Toast message={toast} />
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <QrGeneratorPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
